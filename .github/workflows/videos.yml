name: Update Videos

# 영상 탭(docs/data/videos.json): 어드민에서 등록한 유튜브 채널의 RSS를 몇 시간마다 받아 쌓는다.
# API 키가 필요 없고, 데이터 갱신(Update Stats) 워크플로와는 따로 돈다 - 영상만 바뀌어도 시트·빌드를 다시 돌리지 않는다.
on:
  schedule:
    - cron: '* */* * * *'   # 3시간마다 (UTC 기준, 정각 혼잡을 피해 17분)
  push:
    paths:
      - 'docs/data/video_channels.json'   # 어드민에서 채널·추천 영상을 저장하면 바로 한 번 돈다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos-update
  cancel-in-progress: false

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 채널 RSS 받아 영상 목록 갱신
      run: python scripts/sync_videos.py

    - name: 바뀌었으면 커밋
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add docs/data/videos.json
        if git diff --staged --quiet; then
          echo "ℹ️ 바뀐 영상이 없습니다."
        else
          git commit -m "📺 영상 목록 업데이트"
          # 다른 워크플로가 먼저 푸시했으면 그 위에 다시 얹는다
          git pull --rebase
          git push
        fi
