name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'scripts/build_html.py'
      - 'scripts/generate_stats.py'
      - 'scripts/export_supabase.py'
      - 'scripts/match_link.py'
      - 'scripts/write_site_data.py'
      - 'scripts/write_supabase_browser_config.py'
      - 'scripts/capture_calendar.py'
      - 'requirements.txt'
      - 'package.json'

# 빌드 결과(docs/)를 저장소에 커밋하지 않고 GitHub Pages에 바로 배포한다
# (저장소 설정 → Pages → Source: GitHub Actions). 예전처럼 봇 커밋이 쌓이지 않는다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staruniv-web-build
  cancel-in-progress: false

jobs:
  # 테스트(test.yml)를 먼저 돌리고, 통과해야 빌드·배포한다(정기 실행 포함).
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export web build cache from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/export_supabase.py

      - name: Build internal StarUniv stats and pages
        run: |
          python scripts/generate_stats.py
          python scripts/build_html.py
          python scripts/write_site_data.py

          echo "=== docs/data ==="
          ls -la docs/data

          if [ ! -f docs/data/site_shell.json ] || [ ! -f docs/data/site_records.json ]; then
            echo "split site data files were not generated"
            exit 1
          fi

      - name: Write browser Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_browser_config.py

      - id: pages
        uses: actions/configure-pages@v6

      # 외부 자동화가 가져가는 docs/data/calendar.png. 러너에 깔린 크롬으로 찍는다(Node·puppeteer 불필요).
      # 캡처가 실패해도 사진 주소가 비지 않게, 먼저 지금 배포돼 있는 사진을 받아 둔다.
      - name: Keep last published calendar image
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/calendar.png" -o docs/data/calendar.png || true
      - name: Capture calendar image
        continue-on-error: true
        run: python scripts/capture_calendar.py
      # 게시판이 쓰는 주소(staruniv.vercel.app/calendar.png)는 Supabase Storage의 이 사진을 보여준다
      # (docs/vercel.json). 늘 같은 경로에 덮어쓰고, 캐시하지 않게 올린다.
      - name: Upload calendar image to Supabase Storage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ ! -s docs/data/calendar.png ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY 또는 달력 사진이 없어 건너뜀"; exit 0
          fi
          curl -fsS -X POST "${SUPABASE_URL%/}/storage/v1/object/staruniv-media/calendar.png" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: image/png" -H "x-upsert: true" -H "cache-control: no-cache" \
            --data-binary @docs/data/calendar.png

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
