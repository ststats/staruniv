name: Build StarUniv web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'scripts/build_html.py'
      - 'scripts/generate_stats.py'
      - 'scripts/export_supabase.py'
      - 'scripts/match_link.py'
      - 'scripts/write_site_data.py'
      - 'scripts/write_supabase_browser_config.py'
      - 'scripts/capture_calendar.py'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'

# 빌드 결과(docs/)를 저장소에 커밋하지 않고 GitHub Pages에 바로 배포한다
# (저장소 설정 → Pages → Source: GitHub Actions). 예전처럼 봇 커밋이 쌓이지 않는다.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staruniv-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export web build cache from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/export_supabase.py

      - name: Build internal StarUniv stats and pages
        run: |
          python scripts/generate_stats.py
          python scripts/build_html.py
          python scripts/write_site_data.py

          echo "=== docs/data ==="
          ls -la docs/data

          if [ ! -f docs/data/site_shell.json ] || [ ! -f docs/data/site_records.json ]; then
            echo "split site data files were not generated"
            exit 1
          fi

      - name: Write browser Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_browser_config.py

      - id: pages
        uses: actions/configure-pages@v6

      # 외부 자동화가 가져가는 docs/data/calendar.png. 러너에 깔린 크롬으로 찍는다(Node·puppeteer 불필요).
      # 캡처가 실패해도 사진 주소가 비지 않게, 먼저 지금 배포돼 있는 사진을 받아 둔다.
      - name: Keep last published calendar image
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/calendar.png" -o docs/data/calendar.png || true
      - name: Capture calendar image
        continue-on-error: true
        run: python scripts/capture_calendar.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
