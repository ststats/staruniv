name: Build StarUniv web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'scripts/build_html.py'
      - 'scripts/generate_stats.py'
      - 'scripts/export_supabase.py'
      - 'scripts/match_link.py'
      - 'scripts/write_site_data.py'
      - 'scripts/write_supabase_browser_config.py'
      - 'capture.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: staruniv-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Sync latest main
        run: |
          git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Export web build cache from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/export_supabase.py

      - name: Build internal StarUniv stats and pages
        run: |
          python scripts/generate_stats.py
          python scripts/build_html.py
          python scripts/write_site_data.py

          echo "=== docs/data ==="
          ls -la docs/data

          if [ ! -f docs/data/site_shell.json ] || [ ! -f docs/data/site_records.json ]; then
            echo "split site data files were not generated"
            exit 1
          fi

      - name: Write browser Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: python scripts/write_supabase_browser_config.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Capture calendar image
        continue-on-error: true
        run: node capture.js

      - name: Commit generated web files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data
          git add -A docs

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Build StarUniv web"
          git push origin main
