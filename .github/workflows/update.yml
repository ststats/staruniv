name: Update Stats

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-update
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 구글 시트 연동 및 통계 산출, 웹페이지 빌드
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: |
        python scripts/update_data.py
        python scripts/generate_stats.py
        python scripts/build_html.py

    - name: 변경된 데이터 및 HTML 깃허브에 배포
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        # index.html 뿐 아니라 분리된 정적 자산(css/js)도 같이 add
        # holidays.json은 build_html.py가 templates/assets/에서 docs/로 복사는 하지만
        # 여기서 git add 대상에 빠져있어서 커밋/푸시가 안 되고 있었음 (docs/에는 있지만
        # 저장소에는 반영이 안 돼 배포 사이트에서는 계속 없는 상태로 남는 버그) -> 추가.
        git add data/*.json docs/index.html docs/style.css docs/app.js docs/calendar.js
        [ -f docs/holidays.json ] && git add docs/holidays.json
        git diff --quiet && git diff --staged --quiet || git commit -m "🚀 통계 웹페이지 자동 업데이트"
        git push
