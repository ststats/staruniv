name: Update Site

# 한 번 돌리면 사이트에 필요한 걸 전부 갱신한다. 서로 독립이라 하나가 실패해도 나머지는 간다.
#   1) 유튜브 → 영상 목록 (docs/data/videos.json)                 - 키 있으면 전체, 없으면 RSS 15개
#   2) eloboard 전적 증분 → 상대전적 파일 (docs/data/h2h/)        - 시트·외부 키 불필요
#   3) 구글 시트 → data/db.json                                   - 시트 시크릿이 있을 때만
#   4) 통계 산출 + docs/ 페이지 빌드 (data/db.json이 있을 때만)
#   5) 캘린더 이미지 캡처 (admin.html을 헤드리스 브라우저로 렌더링 → docs/data/calendar.png)
#   6) 바뀐 것만 한 번에 커밋
#
# 돌리는 방법 (셋 다 같은 일을 한다)
#   · Actions 탭에서 'Run workflow' 수동 실행
#   · 외부 크론에서 호출:
#       curl -X POST -H "Authorization: Bearer <PAT>" -H "Accept: application/vnd.github+json" \
#         https://api.github.com/repos/<소유자>/<저장소>/dispatches \
#         -d '{"event_type":"update"}'
#   (어드민 저장은 커밋만 하고 이 워크플로우를 돌리지 않는다 - 다음 크론 때 반영된다)
#
# [처음 한 번] 전적 아카이브(data/eloboard.json)가 없으면 전적 단계는 건너뛴다. 전체 수집은
# 한 시간이 넘어서 여기 두지 않았다 - 따로 만든 수집용 저장소(eloboard-collect)에서 한 번 받아
# data/eloboard.json 을 이 저장소에 커밋하면, 그 뒤부터 여기서 증분(요청 1~2회)으로 이어받는다.
# [자동 실행 없음] 어드민에서 저장하면 저장소에 커밋만 되고 이 워크플로우는 돌지 않는다.
# 예전에는 docs/data/video_channels.json 이 바뀌면 바로 한 번 돌게 해뒀는데, 저장할 때마다
# 사이트 전체 갱신이 도는 게 부담스러워서 뺐다. 다음 크론 실행 때 함께 반영된다.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update]

permissions:
  contents: write

# 외부 크론이 짧은 간격으로 여러 번 불러도 한 번에 하나만 돌게 한다(같은 브랜치에 커밋하므로).
concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # 시트 시크릿이 둘 다 있을 때만 시트 단계를 돈다.
      HAS_SHEET: ${{ secrets.GOOGLE_SHEET_ID != '' && secrets.GOOGLE_CREDENTIALS_JSON != '' }}

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        # git push는 이 체크아웃 스텝이 설정한 인증 정보를 그대로 쓴다. 기본 자동 토큰
        # (secrets.GITHUB_TOKEN)은 저장소 설정이 "읽기 전용"이면 push가 막힐 수 있어서,
        # 그 설정 영향을 안 받는 개인 액세스 토큰(PAT, secrets.GH_TOKEN)을 쓴다.
        # GH_TOKEN(개인 액세스 토큰)을 넣어뒀으면 그걸 쓰고, 없으면 Actions가 자동으로 주는
        # 토큰으로 푸시한다(그 경우 Settings → Actions → Workflow permissions 를
        # 'Read and write'로 켜둬야 한다).
        token: ${{ secrets.GH_TOKEN || github.token }}

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    # 영상·전적 수집은 파이썬 표준 라이브러리만 쓴다(구글 시트도, pandas도 필요 없다).
    # 그래서 라이브러리 설치나 시트 연동보다 먼저 돌려, 그쪽이 안 되는 상황에서도 갱신되게 한다.
    # 남의 서버(유튜브·eloboard)를 읽는 일이라 실패해도 나머지 단계는 그대로 진행한다.
    # YOUTUBE_API_KEY 시크릿이 있으면 채널 업로드 목록을 전부(과거 영상까지) 받고,
    # 없으면 RSS로 최신 15개만 받는다. 어느 쪽이든 동작한다.
    - name: 유튜브 영상 목록 갱신
      continue-on-error: true
      env:
        # Secrets 탭이든 Variables 탭이든 어디에 넣었어도 읽는다(헷갈려서 Variables에 넣는 일이 잦다).
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || vars.YOUTUBE_API_KEY }}
      run: |
        # 키가 워크플로우까지 왔는지 먼저 알려준다. 값은 찍지 않고 길이만 본다(로그에 남으면 안 되니까).
        if [ -z "$YOUTUBE_API_KEY" ]; then
          echo "ℹ️ YOUTUBE_API_KEY 가 비어 있습니다 - RSS로 받습니다."
          echo "   저장소 Settings → Secrets and variables → Actions 에 이 이름 그대로 넣어주세요."
          echo "   (이 저장소의 'Repository secret' 이어야 합니다. Environment secret이나 다른 저장소에 넣으면 여기서 안 보입니다)"
        else
          echo "✅ YOUTUBE_API_KEY 확인 (${#YOUTUBE_API_KEY}자)"
        fi
        python scripts/sync_videos.py

    - name: 전적 아카이브 증분 수집
      continue-on-error: true
      run: |
        if [ ! -f data/eloboard.json ]; then
          echo "ℹ️ data/eloboard.json 이 없습니다 - 전적 단계를 건너뜁니다."
          echo "   (처음 한 번은 수집용 저장소에서 전체 수집 후 data/eloboard.json 을 커밋해주세요)"
          exit 0
        fi
        python scripts/sync_eloboard.py

    - name: 필요 라이브러리 설치 (시트 연동 · 페이지 빌드용)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 시트 시크릿이 없는 저장소에서는 이 단계를 건너뛴다(영상·전적만으로도 사이트는 돈다).
    # 시트가 잠깐 안 되더라도 아래 빌드와 커밋은 그대로 진행한다 - 그때는 저장소에
    # 이미 들어있는 data/db.json으로 빌드한다.
    - name: 구글 시트에서 최신 데이터 받기
      if: env.HAS_SHEET == 'true'
      continue-on-error: true
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: python scripts/update_data.py

    # 상대전적 파일은 시트에서 받은 선수 명단(data/db.json의 members 시트)을 쓰기 때문에
    # 시트 단계 뒤에 온다. 명단이 없으면 예전처럼 시너지 명단으로 물러난다.
    - name: 상대전적 파일 만들기
      continue-on-error: true
      run: |
        if [ ! -f data/eloboard.json ]; then
          echo "ℹ️ data/eloboard.json 이 없어 상대전적 단계를 건너뜁니다."
          exit 0
        fi
        python scripts/build_h2h.py

    # 티어표 '분석' 탭이 쓸 자체 Elo 레이팅. build_h2h.py와 같은 잇기 로직(휴면 필터는
    # 여기서만 적용)을 쓰므로 같은 조건에서 건너뛴다.
    - name: 자체 레이팅(Elo) 계산
      continue-on-error: true
      run: |
        if [ ! -f data/eloboard.json ]; then
          echo "ℹ️ data/eloboard.json 이 없어 레이팅 계산을 건너뜁니다."
          exit 0
        fi
        python scripts/generate_elo.py

    - name: 통계 산출 및 웹페이지 빌드
      run: |
        if [ ! -f data/db.json ]; then
          echo "ℹ️ data/db.json 이 없어 통계·빌드를 건너뜁니다(시트를 아직 연결하지 않은 저장소)."
          exit 0
        fi
        python scripts/generate_stats.py
        python scripts/build_html.py

    - name: Node 환경 세팅
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Puppeteer 캐시 복원
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        # package-lock.json에 잠긴 puppeteer 버전이 바뀔 때만 새로 받는다(캡처 로직만
        # 바뀌고 버전은 그대로인 capture.js 커밋에서는 매번 다시 받지 않는다).
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Puppeteer 설치
      # package-lock.json에 잠긴 버전 그대로 설치한다(매번 최신을 새로 받지 않아 재현 가능하다).
      run: npm ci

    - name: 캘린더 이미지 캡처 (오늘의 일정 + 이달의 일정)
      continue-on-error: true
      env:
        # admin.html이 GitHub API로 "가장 최신" 일정을 읽어올 때 쓰는 토큰. 없으면 저장소에
        # 들어있는 docs/data/calendar.json으로 캡처한다(없어도 동작한다).
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: node capture.js

    - name: 바뀐 것 커밋
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

        # templates/assets/(style.css, core.js, page-*.js 등)는 build_html.py가 파일명 그대로
        # docs/로 복사한다. 여기서 파일명을 하나하나 나열하면 새 정적 파일이 추가됐을 때
        # 목록에 넣는 걸 깜빡하기 쉬워서(실제로 mv-shared.js가 그렇게 빠진 적이 있다)
        # 폴더의 실제 파일 목록을 그대로 따라간다.
        git add -A data
        git add docs/index.html docs/*/index.html docs/holidays.json
        # 손으로 관리하는 두 페이지도 빌드가 자산 버전(?v=)을 고쳐 쓰므로 같이 커밋한다.
        git add docs/admin.html docs/multiview.html
        git add docs/data/site_data.json docs/data/calendar.png docs/data/videos.json
        git add docs/data/tier_members.json
        git add -A docs/data/h2h
        git add -A docs/data/elo
        for f in templates/assets/*; do
          git add "docs/$(basename "$f")"
        done

        # 무엇이 바뀌었는지(또는 안 바뀌었는지) 로그에 남긴다 - "워크플로우는 도는데 반영이
        # 안 됨" 문제가 생기면 (1) 애초에 diff가 없었는지 (2) 커밋은 됐는데 push가 실패했는지
        # 이 로그만 보고 구분할 수 있다.
        echo "── git status (add 이후) ──"
        git status --short

        if git diff --staged --quiet; then
          echo "ℹ️ 바뀐 내용이 없습니다 - 커밋을 건너뜁니다."
          exit 0
        fi

        git commit -m "🚀 사이트 자동 업데이트"
        # 어드민 저장 등 다른 커밋이 먼저 들어와 있으면 그 위에 다시 얹는다.
        git pull --rebase
        git push
