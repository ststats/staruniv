name: Update Stats

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-update
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        # git push는 이 체크아웃 스텝이 설정한 인증 정보를 그대로 쓴다. 기본
        # 자동 토큰(secrets.GITHUB_TOKEN)은 레포 Settings → Actions → Workflow
        # permissions가 "읽기 전용"으로 되어있으면 push가 막힐 수 있는데, 그
        # 설정 영향을 안 받는 개인 액세스 토큰(PAT, secrets.GH_TOKEN)을 대신
        # 써서 그 가능성 자체를 없앤다.
        token: ${{ secrets.GH_TOKEN }}

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 구글 시트 연동 및 통계 산출, 웹페이지 빌드
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: |
        python scripts/update_data.py
        python scripts/generate_stats.py
        python scripts/build_html.py

    - name: Node 환경 세팅
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Puppeteer 캐시 복원
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('capture.js') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Puppeteer 설치
      run: npm install puppeteer

    - name: 캘린더 이미지 캡처 (오늘의 일정 + 이달의 일정 통합, admin.html을 헤드리스 브라우저로 렌더링)
      env:
        # admin.html이 GitHub API로 최신 일정(calendar.json)을 읽어올 때 쓰는
        # 토큰 - 체크아웃 스텝과 동일한 PAT으로 통일한다.
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: node capture.js

    - name: 변경된 데이터 및 HTML 깃허브에 배포
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        # templates/assets/(style.css, app.js, calendar.js, mv-shared.js 등)는
        # build_html.py가 파일명 그대로 docs/에 복사해준다. 여기서 파일명을 하나하나
        # 나열하면(예전 방식) 나중에 새 정적 파일이 추가됐을 때 이 목록에 추가하는 걸
        # 깜빡하기 쉽고, 실제로 mv-shared.js가 그렇게 빠져서 배포가 안 된 적이 있다 -
        # 그래서 이 폴더의 실제 파일 목록을 그대로 따라가도록 바꿔 같은 문제가
        # 다시 생기지 않게 한다.
        git add data/*.json docs/index.html docs/holidays.json docs/data/site_data.json docs/data/calendar.png
        for f in templates/assets/*; do
          git add "docs/$(basename "$f")"
        done
        # 디버그용: 뭐가 바뀌었는지(또는 안 바뀌었는지) 로그에 남겨서, 다음에 또
        # "워크플로우는 도는데 반영이 안 됨" 문제가 생기면 여기 로그만 보고
        # (1) 애초에 diff가 없었는지 (2) commit은 됐는데 push가 실패했는지 바로 구분한다.
        echo "── git status (add 이후) ──"
        git status --short
        if git diff --staged --quiet; then
          echo "ℹ️ 스테이징된 변경사항이 없습니다 (캡쳐/데이터가 이전과 동일) - 커밋을 건너뜁니다."
        else
          git commit -m "🚀 통계 웹페이지 자동 업데이트"
          echo "── git push ──"
          git push
        fi
