name: Daily Calendar Capture

on:
  workflow_dispatch: # 수동 버튼 또는 외부 스케줄러가 트리거

permissions:
  contents: write

jobs:
  capture-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 2. Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. 스크린샷 툴(Puppeteer) 설치
        run: npm install puppeteer

      - name: 4. 스크린샷 캡처 실행
        env:
          # GitHub Settings -> Secrets and variables -> Actions 에 저장된 토큰 사용
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node capture.js

      - name: 5. 갱신된 이미지 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/calendar.png
          # 변경사항이 있을 때만 커밋+푸시 진행
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 날짜 갱신 캘린더 자동 캡처" && git push)
