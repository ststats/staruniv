name: Test

# node --test tests/*.test.js (CSS 구조 검사 포함).
# Build도 배포 전에 이 워크플로를 불러 돌린다 - 테스트가 실패하면 정기 실행을 포함해 배포하지 않는다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm test
