name: Test

# node --test tests/*.test.js (CSS 구조 검사 포함). 사이트 배포(update.yml)와는 따로 돌아서
# 테스트가 실패해도 정기 배포를 막지 않는다 - 실패하면 Actions 탭에 빨갛게 남는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm test

  # 일회성: 지운 임시 워크플로(Probe fmkorea, OCR bench)의 실행 기록 삭제. 다음 커밋에서 뺀다.
  cleanup-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in 366099365 366744580; do
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" --jq '.workflow_runs[].id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" && echo "삭제: $id"
            done
          done
