name: Test

# 노드·파이썬 테스트와 페이지 연기 테스트. Build도 배포 전에 이 워크플로를 부른다.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm test
      # 표준 라이브러리만 쓰는 모듈이라 패키지 설치 없이 돈다
      - run: python3 -m unittest discover -s tests/py -p 'test_*.py'
      # 정기 빌드는 코드 모양 때문에 배포가 막히지 않게 건너뛴다. 고칠 땐 npm run format
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm ci && npm run format:check

  # 가짜 데이터로 공개 페이지를 열어 스크립트 오류·로딩 멈춤을 본다
  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'jinja2>=3.0,<4'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:pages
