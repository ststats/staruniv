name: Probe fmkorea (임시 시험)
on:
  push:
    branches: [main-hti2qw]
    paths: ['.github/workflows/probe-fmkorea.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 글 페이지·이미지 요청
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for u in https://www.fmkorea.com/9060359921 https://m.fmkorea.com/9060359921; do
            code=$(curl -s -L -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -o page.html -w "%{http_code}" "$u")
            echo "PAGE $u -> $code $(grep -o '<title>[^<]*' page.html | head -1)"
            echo "  article: $(grep -c '<article' page.html) attach: $(grep -o 'image.fmkorea.com/files/attach[^"]*' page.html | sort -u | wc -l)"
          done
          code=$(curl -s -A "$UA" -e https://www.fmkorea.com/9060359921 -o img.webp -w "%{http_code} %{size_download}" "https://image.fmkorea.com/files/attach/new5/20260924/10372198095_6042994_2df1de5bc5695ff6348f59976dc131d9.png.webp")
          echo "IMAGE -> $code"
