name: Squash Git History

# data/eloboard.json(전적 아카이브)과 docs/data/h2h/**가 매일 자동 커밋되며 git 히스토리가
# 계속 쌓인다. 이 워크플로는 그 누적된 과거 커밋을 정리한다: 지금 브랜치의 "현재 상태"를
# 커밋 1개로 남기고, 그 이전 커밋은 모두 버린다.
#
# [주의 - 되돌릴 수 없는 작업]
#   - 실행하면 지금까지의 커밋 이력이 전부 사라진다(고아 커밋 1개로 대체 후 강제 푸시).
#   - 이 저장소를 이미 clone/fork한 사람은 다음 pull이 충돌한다 - 다시 clone해야 한다.
#   - 그래서 자동 스케줄(cron)로 돌리지 않는다. Actions 탭에서 손으로만 실행한다.
#     기준 없이 "주기적으로" 돌리기보다는, `git count-objects -vH`로 저장소(.git) 용량을
#     확인해서 부담스러워졌을 때(예: 반기~연 1회 점검) 실행하는 걸 권장한다.
#   - 실수로 눌러 돌아가는 사고를 막기 위해 confirm 칸에 정확히 SQUASH를 입력해야 한다.
#
# 실행 방법: Actions 탭 → Squash Git History → Run workflow → confirm 칸에 SQUASH 입력
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '정말 실행하려면 정확히 SQUASH를 입력하세요 (커밋 이력이 전부 사라지며 되돌릴 수 없습니다)'
        required: true

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: 입력 확인
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "SQUASH" ]; then
            echo "❌ confirm 칸에 정확히 'SQUASH'를 입력해야 실행됩니다 (입력값: '${{ github.event.inputs.confirm }}')."
            exit 1
          fi

      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 기본 토큰은 브랜치 보호 규칙에 막힐 수 있어 PAT을 우선 쓴다(update.yml과 동일한 이유).
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: 정리 전 용량
        run: git count-objects -vH

      - name: 히스토리를 커밋 1개로 압축
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "대상 브랜치: $BRANCH"

          # 지금 트리 상태를 그대로 담은, 부모 없는(orphan) 커밋을 하나 만든다.
          git checkout --orphan __squash_tmp
          git add -A
          git commit -m "🧹 git 히스토리 정리 (이전 커밋을 커밋 1개로 압축)"

          git branch -M __squash_tmp "$BRANCH"
          git push --force origin "$BRANCH"

      - name: 정리 후 용량 (로컬 gc 기준 - 원격 실제 용량은 며칠 뒤 GitHub 쪽 백그라운드 gc 이후 반영된다)
        run: |
          git gc --aggressive --prune=now
          git count-objects -vH
