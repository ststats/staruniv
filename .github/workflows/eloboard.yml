name: Update Eloboard

# 상대전적 탭: eloboard 전적을 하루 한 번 증분으로 받아(data/eloboard.json) 선수별 파일로 잘라
# docs/data/h2h/ 에 올린다. 원본 아카이브(14MB)는 저장소에만 두고 사이트로는 내보내지 않는다.
#
# [처음 한 번] 전체 수집은 약 1,974요청(2초 간격 = 약 66분)이라 이 워크플로로 돌리지 않는다.
# 로컬에서 `python scripts/sync_eloboard.py --full` 로 한 번 받아 커밋한 뒤부터 여기서 증분으로 이어간다.
on:
  schedule:
    - cron: '25 19 * * *'   # 매일 04:25 KST (UTC 19:25)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eloboard-update
  cancel-in-progress: false

jobs:
  sync-eloboard:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 새 전적 받기 (증분)
      run: python scripts/sync_eloboard.py

    - name: 상대전적 파일 만들기
      run: python scripts/build_h2h.py

    - name: 바뀌었으면 커밋
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/eloboard.json docs/data/h2h
        if git diff --staged --quiet; then
          echo "ℹ️ 새 전적이 없습니다."
        else
          git commit -m "🥊 전적 아카이브 업데이트"
          git pull --rebase
          git push
        fi
