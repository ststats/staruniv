name: Update all stats

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # print()가 stdout으로 가면 GitHub Actions 로그 캡처 환경에서 버퍼링돼서
    # stderr(경고/에러)보다 늦게 찍혀 로그 순서가 실제 실행 순서와 어긋날 수
    # 있다 - PYTHONUNBUFFERED=1로 stdout도 즉시 흘려보내게 한다.
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # members.xlsx(있으면)를 members.json에 먼저 병합한다 - id 기준 병합이라
      # xlsx에 없는 멤버(admin.html/EloBoard 동기화로 추가된 사람 등)는 그대로
      # 보존된다. xlsx 파일 자체가 없으면 조용히 건너뛰므로 continue-on-error도
      # 딱히 필요 없지만, 혹시 모를 파싱 오류가 나머지 파이프라인을 막지 않도록
      # 안전하게 감싸둔다.
      # members.xlsx와 members.json을 양방향으로 동기화한다(3-way 병합 -
      # data/members_sync_baseline.json에 저장해둔 지난 동기화 스냅샷과 비교해서
      # 어느 쪽이 바뀌었는지 판단). admin.html에서 고친 내용도 이 스텝을 거쳐
      # xlsx에 반영된다. 실패해도 워크플로우 전체를 막지 않도록 continue-on-error.
      - name: Sync members.xlsx <-> members.json
        continue-on-error: true
        run: python scripts/convert_members_xlsx.py

      # members.json을 EloBoard 티어 목록 기준으로 동기화한다(xlsx 병합 다음
      # 순서) - 이 스텝이 Update data보다 앞에 있어야, 오늘 새로 추가된 멤버의
      # 별풍선/스폰전적도 같은 날 바로 수집된다. 실패해도(예: 엘로보드 API 일시
      # 장애) 워크플로우 전체를 막지 않도록 continue-on-error로 둔다 -
      # members.json 갱신이 밀리는 것보다, 그날의 별풍선/스폰전적 수집(기존 멤버
      # 대상)이 아예 안 도는 게 더 큰 손실이라서다.
      - name: Sync members.json tiers
        continue-on-error: true
        run: python scripts/sync_members.py

      # Checkout은 워크플로우 시작 시점에 딱 한 번만 스냅샷을 받아온다 - 그 이후
      # admin.html이 GitHub API로 직접 members.json을 커밋해도(예: "미상" 임시
      # 프로필을 실제 정보로 채워 넣는 수정) 이 워크플로우는 그 커밋을 전혀
      # 모른 채로 계속 돈다. 그 상태에서 fetch_eloboard_data.py가 로컬(체크아웃
      # 시점 기준)의 오래된 members.json만 보고 "이 elo_id 모르는 사람"이라고
      # 판단해서, admin이 이미 채워둔 사람을 또 "미상"으로 중복 추가해버리는
      # 문제가 실제로 있었다(둘 다 나중에 git rebase로 텍스트 레벨에서는
      # 충돌 없이 합쳐져서 중복이 그대로 남음). 그래서 신규 elo_id를 판단하는
      # 스텝(Update data) 바로 직전에 한 번 더 pull해서, admin.html이 그
      # 사이에 커밋한 최신 상태를 반영한 뒤 진행한다. 이 시점엔 아직 이
      # 워크플로우 자신이 뭘 커밋한 게 없으니 rebase 충돌 걱정 없이 항상
      # fast-forward로 끝난다.
      - name: Pull latest (admin.html이 그 사이 커밋했을 수 있음)
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      # 별풍선(풍고)과 스폰전적(엘로보드)을 한 스크립트 안에서 순서 걱정 없이 처리한다
      # 아카이빙/월확정/오늘자 수집을 전부 update_data.py가 조율한다

      - name: Update data (풍고 + 엘로보드)
        run: python scripts/update_data.py

      - name: Generate pages
        run: python scripts/generate_pages.py

      # generate_pages.py 이후에 돌아야 한다 - docs/*.html을 스캔해서 실제
      # 사용된 문자를 확인하기 때문. 폰트 다운로드가 실패해도(외부 CDN 문제
      # 등) 사이트 나머지가 안 깨지게 continue-on-error로 둔다 - 이 경우
      # docs/fonts/PretendardVariable.woff2가 이전 실행 결과 그대로 남는다.
      - name: Subset font
        continue-on-error: true
        run: python scripts/subset_font.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "데이터 갱신 (풍고+엘로보드): $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || (sleep 5 && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
