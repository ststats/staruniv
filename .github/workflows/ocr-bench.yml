name: OCR bench (one-off)
on:
  workflow_dispatch:
    inputs:
      url:
        description: tier table image url
        required: true
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor
      - run: pip install -q numpy pillow pytesseract psycopg[binary] paddlepaddle paddleocr
      - run: python scripts/ocr_bench.py "${{ inputs.url }}"
