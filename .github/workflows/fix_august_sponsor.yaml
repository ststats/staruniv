name: Fix August Sponsor Data (One-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          pip install requests openpyxl

      - name: 누락 데이터 복구 스크립트 실행
        run: python scripts/fix_august_sponsor.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive/2026-08-31.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix: 8월 스폰전적 누락분 수동 소급 적용" && git push)