name: Backup

# 공유 Supabase DB와 Storage 파일을 월 1회 암호화해 Actions 아티팩트로 둔다(무료 플랜엔 자동 백업이 없다).
# 공개 저장소라 아티팩트는 누구나 받을 수 있어 반드시 암호화한다. 복구 방법은 README '백업' 절.
on:
  schedule:
    - cron: '30 18 1 * *'   # 매월 2일 03:30(한국 시간)
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 이전 백업 아티팩트 삭제용

concurrency:
  group: staruniv-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::BACKUP_PASSPHRASE · SUPABASE_DB_URL · SUPABASE_URL 이 필요합니다(암호 없이 올리지 않는다)."
            exit 1
          fi

      # Supabase 서버보다 오래된 pg_dump는 거부된다.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        run: |
          set -euo pipefail
          # pg_dump는 세션 연결이 필요해 풀러 트랜잭션 모드(:6543)를 세션 모드(:5432)로 바꾼다.
          url="${SUPABASE_DB_URL/:6543\//:5432/}"
          echo "DB_URL_SESSION=$url" >> "$GITHUB_ENV"
          mkdir -p backup
          # 파이프라인이 다시 만드는 표는 구조만 남긴다. elo_derived_snapshots도 빼야 복구 뒤 통계가 다시 계산된다.
          /usr/lib/postgresql/17/bin/pg_dump "$url" --format=custom --no-owner --no-privileges \
            --schema=public \
            --exclude-table-data=public.elo_derived_snapshots \
            --exclude-table-data=public.elo_player_stats \
            --exclude-table-data=public.elo_h2h_stats \
            --exclude-table-data=public.elo_race_stats \
            --exclude-table-data=public.elo_rankings \
            --exclude-table-data=public.elo_ranking_meta \
            --exclude-table-data=public.elo_rating_history \
            --exclude-table-data=public.elo_player_ratings \
            --exclude-table-data=public.live_broadcasts \
            --exclude-table-data=public.member_posts \
            --exclude-table-data=public.sync_jobs \
            --file=backup/db.dump
          /usr/lib/postgresql/17/bin/pg_restore --list backup/db.dump | grep -c "TABLE DATA" | xargs echo "table data entries:"

      # DB 덤프에는 Storage 파일 내용이 없다.
      - name: Download Storage files
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$DB_URL_SESSION" -At \
            -c "select name from storage.objects where bucket_id = 'staruniv-media' order by name" > names.txt
          python3 - <<'PY'
          import os, pathlib, sys, time, urllib.parse, urllib.request
          base = os.environ['SUPABASE_URL'].rstrip('/') + '/storage/v1/object/public/staruniv-media/'
          names = [n for n in pathlib.Path('names.txt').read_text(encoding='utf-8').splitlines() if n and not n.endswith('/')]
          failed = []
          for name in names:
              out = pathlib.Path('backup/storage') / name
              out.parent.mkdir(parents=True, exist_ok=True)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(base + urllib.parse.quote(name), timeout=60) as res:
                          out.write_bytes(res.read())
                      break
                  except Exception as exc:
                      if attempt == 2:
                          failed.append(f'{name}: {exc}')
                      else:
                          time.sleep(5 * (attempt + 1))
          saved = sum(1 for name in names if (pathlib.Path('backup/storage') / name).is_file())
          print(f'storage files: {saved}/{len(names)}')
          # 파일이 빠진 백업으로 이전 백업을 지우지 않게 여기서 실패시킨다
          if failed or saved != len(names):
              for line in failed:
                  print('::error::' + line)
              sys.exit(f'storage download incomplete: {saved}/{len(names)}')
          PY
          du -sh backup/*

      - name: Encrypt
        run: |
          set -euo pipefail
          name="supabase-backup-$(date -u +%Y%m%d).tar.gz.gpg"
          tar -C backup -czf backup.tar.gz .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "$name" backup.tar.gz <<< "$BACKUP_PASSPHRASE"
          rm -rf backup backup.tar.gz names.txt
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup-*.tar.gz.gpg
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      # 이번 백업에 모르는 문제가 있을 수 있어 직전 백업 하나는 남긴다.
      - name: Delete older backups
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: supabase-backup-${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          api = f"https://api.github.com/repos/{os.environ['REPO']}/actions/artifacts"
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
          def call(url, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method), timeout=30) as res:
                  return json.loads(res.read() or b'{}')
          # Pages 아티팩트도 쌓여 첫 100개만 보면 오래된 백업을 놓친다
          arts, page = [], 1
          while True:
              batch = call(f'{api}?per_page=100&page={page}').get('artifacts', [])
              arts += batch
              if len(batch) < 100:
                  break
              page += 1
          old = sorted((a for a in arts if a['name'].startswith('supabase-backup-') and a['name'] != os.environ['KEEP']
                        and not a.get('expired')), key=lambda a: a['created_at'], reverse=True)
          for a in old[1:]:
              call(f"{api}/{a['id']}", method='DELETE')
              print('deleted', a['name'], a['created_at'])
          print(f'kept {os.environ["KEEP"]}' + (f' and {old[0]["name"]}' if old else '') + f', deleted {len(old[1:])}')
          PY
