name: Temporary schedule regression test formatting
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx prettier --write tests/schedule-presentation.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/schedule-presentation.test.js
          if ! git diff --cached --quiet; then
            git commit -m "Format schedule regression tests"
            git push origin HEAD:main
          fi
