name: Tier analysis

# 관리자 '티어표 갱신'이 admin_request_tier_analysis를 거쳐 실행한다. 결과는 tier_update_jobs에만 쓴다.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'tier_update_jobs 작업 번호'
        required: true

permissions:
  contents: read

concurrency:
  group: staruniv-tier-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements/**/*.txt'

      - name: Install Tesseract (Korean)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor

      - name: Install Python dependencies
        run: pip install -r requirements/ocr.txt

      - name: Analyze tier table
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/tier_table.py --job "$JOB_ID"
