name: Tier table analysis

# 관리자 화면의 '티어표 갱신'이 Supabase(admin_request_tier_analysis)를 거쳐 실행한다.
# 펨코 티어표 이미지를 읽어 DB와 비교하고, 결과를 tier_update_jobs에 넣는다(사이트는 바꾸지 않는다).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'tier_update_jobs 작업 번호'
        required: true

permissions:
  contents: read

concurrency:
  group: staruniv-tier-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Tesseract (Korean)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Analyze tier table
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/tier_table.py --job "$JOB_ID"
