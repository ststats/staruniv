{% extends "base.html" %}

{% block content %}
<div class="page-container stats-page">
  <!-- 27번: 방송통계 요약 카드들 위에 '전체 요약' 타이틀 추가 -->
  <div class="stats-summary-header">
    <div class="section-header-bar">
      <div class="header-title-group">
        <h2 class="title-ko">전체 요약</h2>
        <span class="title-en" style="font-size: 13px; color: var(--text-muted); margin-left: 8px;">OVERALL SUMMARY</span>
      </div>
    </div>
  </div>

  <div class="stats-summary-cards-grid" id="statsSummaryGrid">
    <div class="stat-card cut-box">
      <span class="stat-label">총 경기수</span>
      <span class="stat-value" id="statTotalMatches">-</span>
    </div>
    <div class="stat-card cut-box">
      <span class="stat-label">최다 승리 크루</span>
      <span class="stat-value" id="statTopCrew">-</span>
    </div>
    <div class="stat-card cut-box">
      <span class="stat-label">승률 1위 플레이어</span>
      <span class="stat-value" id="statTopPlayer">-</span>
    </div>
  </div>

  <div class="stats-detail-section">
    <div class="section-header-bar" style="margin-top: 24px;">
      <h3>상세 전적 및 승률</h3>
    </div>
    <div class="stats-table-wrapper cut-box" id="statsTableContainer">
      <!-- page-stats.js 동적 렌더링 -->
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/assets/page-stats.js"></script>
{% endblock %}
