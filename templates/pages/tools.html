{% extends "base.html" %}

{% block content %}
<div class="page-container tools-page">
  <div class="section-header-bar">
    <h2>편의 도구</h2>
  </div>

  <!-- 28번: 멀티뷰어 설정칸 균등 정렬 배치 -->
  <div class="tool-section-block cut-box" style="margin-bottom: 32px;">
    <h3 class="tool-block-title" style="margin-bottom: 16px;">SOOP 멀티뷰어 설정</h3>
    <div class="multiview-settings-card">
      <div class="form-group">
        <label for="mvQuality">화질 설정</label>
        <select id="mvQuality" class="form-select">
          <option value="auto">자동 (Auto)</option>
          <option value="1080p">1080p FHD</option>
          <option value="720p">720p HD</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mvLayout">분할 레이아웃</label>
        <select id="mvLayout" class="form-select">
          <option value="2x2">4분할 (2x2)</option>
          <option value="1+3">주 화면 + 3분할</option>
          <option value="1x2">2분할 (1x2)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mvMute">오디오 모드</label>
        <select id="mvMute" class="form-select">
          <option value="single">선택 방송만 소리 재생</option>
          <option value="all">전체 동시 재생</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 29번: 외부 도구 카드 텍스트와 이미지 모두 중앙 정렬 -->
  <div class="external-tools-grid">
    <a href="https://eloboard.com" target="_blank" rel="noopener" class="external-tool-card cut-box">
      <div class="tool-icon">📊</div>
      <h4 class="tool-title">엘로보드 (Eloboard)</h4>
      <p class="tool-desc">전체 스타크래프트 전적 및 공식 레이팅 순위표 확인</p>
    </a>
    <a href="/multiview.html" class="external-tool-card cut-box">
      <div class="tool-icon">📺</div>
      <h4 class="tool-title">SOOP 동시 시청</h4>
      <p class="tool-desc">동시에 여러 방송을 한 화면에서 즐기는 멀티뷰어</p>
    </a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/assets/page-tools.js"></script>
{% endblock %}
