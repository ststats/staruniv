{% extends "base.html" %}

{% block content %}
<!-- 히어로 섹션 (1~8, 10, 11, 12, 33, 34번 적용) -->
<section class="hero-section">
  <div class="hero-container">
    <div class="hero-header">
      <!-- 1, 2번: '캄몬스타즈의', '현황, 일정, 전적' -->
      <span class="hero-badge">캄몬스타즈의 현황, 일정, 전적</span>
      
      <!-- 34번: '스타' 흰색, '대학' 파란색 줄바꿈 -->
      <h1 class="hero-title">
        <span class="title-white">스타</span><br><span class="title-blue">대학</span>
      </h1>
      
      <!-- 6번: '방송 중인 멤버와 최신 공지를 확인하세요.' (티어표 내용 삭제) -->
      <p class="hero-desc">방송 중인 멤버와 최신 공지를 확인하세요.</p>
    </div>

    <!-- 11번: 탭 및 카드 정렬 통일 -->
    <div class="hero-grid">
      <!-- 10번: 스타대학 칸 - 최신전적이 아닌 오늘의 일정 표시 -->
      <div class="hero-card cut-box">
        <div class="card-header">
          <h3>스타대학 오늘의 일정</h3>
        </div>
        <div class="card-body">
          <ul id="heroTodayScheduleList" class="hero-schedule-list">
            <li class="empty-msg">오늘 예정된 일정을 불러오는 중입니다...</li>
          </ul>
        </div>
        <div class="card-footer">
          <!-- 5번: '일정 보기' -->
          <a href="/schedule/" class="btn-hero">일정 보기</a>
        </div>
      </div>

      <!-- 최근 경기 결과 카드 (3번: 전적보기 박스 삭제 대신 매치 요약 유지, 4번: '전적 보기') -->
      <div class="hero-card cut-box">
        <div class="card-header">
          <h3>최근 경기 결과</h3>
        </div>
        <div class="card-body" id="heroRecentMatches">
          <p class="loading-text">최근 경기 결과를 불러오는 중입니다...</p>
        </div>
        <div class="card-footer">
          <!-- 4번: '전적 보기' -->
          <a href="/records/" class="btn-hero">전적 보기</a>
        </div>
      </div>

      <!-- 7, 8번: 티어표 요약 박스 및 ranking 항목은 완전히 삭제됨 -->
    </div>
  </div>
</section>

<!-- 방송 중인 멤버 섹션 (13, 14번 적용) -->
<section class="home-live-section section-container">
  <div class="section-header-bar">
    <div class="header-title-group">
      <h2>방송 중인 멤버</h2>
    </div>
    <div class="header-badge-group">
      <span class="badge-live-red" id="homeLiveCount">0명 방송중</span>
    </div>
  </div>
  <div class="stream-grid" id="homeStreamGrid">
    <!-- JS(page-home.js)에서 13번(시간 우하단), 14번(상하여백 축소) 구조로 동적 렌더링 -->
  </div>
</section>

<!-- 최근 공지 섹션 (15번 모서리 중복 채움 방지 적용) -->
<section class="home-notice-section section-container">
  <div class="section-header-bar">
    <div class="header-title-group">
      <h2>최근 공지사항</h2>
    </div>
  </div>
  <div class="notice-list-container cut-box">
    <ul class="notice-list" id="homeNoticeList">
      <li class="notice-item">공지사항을 불러오는 중입니다...</li>
    </ul>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/assets/page-home.js"></script>
{% endblock %}
