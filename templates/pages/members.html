{% extends "base.html" %}

{% block content %}
<div class="page-container members-page">
  <div class="section-header-bar">
    <div class="header-title-group">
      <h2>크루 / 멤버 현황</h2>
    </div>
    <!-- 25번: 검은색 박스로 인원수 오른쪽 정렬 -->
    <div class="header-badge-group">
      <span class="badge-count-black" id="memberTotalCount">총 0명</span>
      <span class="badge-live-red" id="memberLiveCount">0명 방송중</span>
    </div>
  </div>

  <div class="members-layout">
    <!-- 21번: 스크롤 따라 움직이는 sticky 사이드바 -->
    <aside class="member-notice-sidebar">
      <div class="sidebar-block cut-box">
        <h4 class="sidebar-title">멤버 공지</h4>
        <!-- 20번: 오른쪽 리스트들 이어진 것들 개별 모서리 절삭 제거 -->
        <ul class="member-notice-list" id="memberNoticeList">
          <li class="notice-item">공지를 불러오는 중입니다...</li>
        </ul>
      </div>
    </aside>

    <!-- 멤버 카드 그리드 (31번: 라이브 표시 좌상단 이동) -->
    <main class="members-main-content">
      <div class="member-cards-grid" id="memberCardsGrid">
        <!-- page-members.js 동적 렌더링 -->
      </div>
    </main>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/assets/page-members.js"></script>
{% endblock %}
