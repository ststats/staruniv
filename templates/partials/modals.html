<div class="modal fade" id="teamMatchesModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable" style="max-width: 550px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="teamModalTitle">팀 전체 전적</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive custom-scrollbar">
                    <table class="table table-borderless table-hover mb-0 stat-table">
                        <thead>
                            <tr>
                                <th class="sticky-col" style="width:18.8%;">상대</th>
                                <th style="width:18.8%;">형식</th>
                                <th style="width:18.8%;">세트</th>
                                <th style="width:18.8%;">결과</th>
                                <th style="width:18.8%;">날짜</th>
                                <th style="width:6%;"></th>
                            </tr>
                        </thead>
                        <tbody id="team-modal-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="memberProfileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="memberProfileTitle">프로필</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding: 24px;">
                <!-- 🌟 사진 찌그러짐 방지(flex-shrink-0) 및 텍스트 밸런스 교정 🌟 -->
                <div class="d-flex align-items-center mb-4">
                    <div class="avatar avatar-xl flex-center text-secondary flex-shrink-0" style="font-size: 28px; margin-right: 16px;" id="mp-avatar">👤</div>
                    <div style="min-width: 0;">
                        <div class="fw-bold text-ellipsis" id="mp-name" style="font-size: 20px; letter-spacing: -0.5px; margin-bottom: 8px; line-height: 1;">이름</div>
                        <div class="d-flex gap-2 flex-wrap">
                            <span class="tag-badge" id="mp-role-badge">직책</span>
                            <span class="tag-badge" id="mp-tier-badge">티어</span>
                            <span class="tag-badge" id="mp-race-badge">종족</span>
                        </div>
                    </div>
                </div>
                
                <table class="table table-borderless mb-0" style="font-size:var(--fs-body);">
                    <tbody id="mp-info-body"></tbody>
                </table>

                <div class="mt-4">
                    <div class="section-title-sm">
                        이번 달 방송 활동
                        <span class="text-secondary" id="mp-activity-status" style="font-size:var(--fs-body); font-weight:600;">데이터 준비중</span>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-6">
                            <div class="clean-card text-center p-3">
                                <div class="text-secondary mb-1" style="font-size:var(--fs-body); font-weight:700;">별풍선</div>
                                <div class="fw-bold text-ellipsis" id="mp-balloons" style="font-size:var(--fs-body);">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center p-3">
                                <div class="text-secondary mb-1" style="font-size:var(--fs-body); font-weight:700;">방송시간</div>
                                <div class="fw-bold text-ellipsis" id="mp-broadcast-hours" style="font-size:var(--fs-body);">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center p-3">
                                <div class="text-secondary mb-1" style="font-size:var(--fs-body); font-weight:700;">누적시청자</div>
                                <div class="fw-bold text-ellipsis" id="mp-viewers" style="font-size:var(--fs-body);">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center p-3">
                                <div class="text-secondary mb-1" style="font-size:var(--fs-body); font-weight:700;">스폰전적</div>
                                <div class="fw-bold text-ellipsis" id="mp-sponsor-record" style="font-size:var(--fs-body);">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
