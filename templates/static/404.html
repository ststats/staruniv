<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 스타대학</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<!--
    GitHub Pages가 없는 주소에 내주는 페이지. 어느 경로에서 보일지 몰라 사이트 CSS를 불러오지 않는다.
    노치 토큰은 빌드가 아래 SHARED_NOTCH_TOKENS 자리에 넣는다.
-->
<style>
    /* SHARED_NOTCH_TOKENS */
    :root {
        --color-bg: #eef2f8; --color-card: #ffffff; --color-text-strong: #050a14; --color-text-muted: #666f7d; --color-border: #dde4ee;
        --navy: #14264a; --navy-on-text: #e6ecf7; --navy-on-muted: #b3c2de; --navy-accent: #5a95ff; --logo-accent: var(--kammon); --kammon: #055df3;
        --navy-pattern: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 8px);
        --hero-glow: none;
        --chip: #e4e9f2; --chip-text: #2a3445;
    }
    html[data-theme="dark"] {
        --color-bg: #07090d; --color-card: #10131a; --color-text-strong: #ffffff; --color-text-muted: #98a0ad; --color-border: #1f2531;
        --navy: #111a2c; --navy-on-text: #e9ecf1; --navy-on-muted: #9aa0ab; --navy-accent: #3d82ff; --logo-accent: #3d82ff;
        --navy-pattern: repeating-linear-gradient(135deg, rgba(90, 149, 255, 0.07) 0 1px, transparent 1px 8px);
        --hero-glow: radial-gradient(120% 140% at 100% 0%, rgba(59, 130, 255, 0.22), transparent 55%);
        --chip: #1b212c; --chip-text: #dbe0e8;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--color-bg); color: var(--color-text-strong);
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .bar { display: flex; align-items: center; height: 64px; padding: 0 max(20px, calc((100vw - 1280px) / 2 + 40px)); background: var(--color-card); border-bottom: 1px solid var(--color-border); }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .logo b { color: var(--logo-accent); font-weight: 800; }
    .hero {
        position: relative; overflow: hidden; padding: 56px max(20px, calc((100vw - 1280px) / 2 + 40px)) 64px;
        background: var(--navy); background-image: var(--hero-glow), var(--navy-pattern); color: var(--navy-on-text);
    }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .18em; color: var(--navy-on-muted); }
    .code { margin: 6px 0 0; font-size: clamp(72px, 16vw, 132px); font-weight: 800; line-height: 1; letter-spacing: -.04em; }
    .code span { color: var(--navy-accent); }
    h1 { margin: 18px 0 8px; font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.02em; }
    .hero .desc { margin: 0; max-width: 560px; font-size: 15px; line-height: 1.6; color: var(--navy-on-muted); word-break: keep-all; }
    .body { flex: 1; padding: 32px max(20px, calc((100vw - 1280px) / 2 + 40px)) 48px; }
    .home {
        display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px;
        background: var(--navy); background-image: var(--navy-pattern); color: #fff; font-size: 15px; font-weight: 800;
        clip-path: var(--notch-7);
    }
    html[data-theme="dark"] .home { background: var(--navy-on-text); color: var(--navy); }
    .label { margin: 32px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--color-text-muted); }
    .menu { display: flex; flex-wrap: wrap; gap: 8px; }
    .menu a {
        display: inline-flex; align-items: center; height: 38px; padding: 0 16px;
        background: var(--chip); color: var(--chip-text); font-size: 14px; font-weight: 700; clip-path: var(--notch-6);
    }
    .menu a:hover, .home:hover { filter: brightness(1.25); }
    @media (max-width: 560px) {
        .bar { height: 56px; }
        .hero { padding: 40px 20px 48px; }
        .body { padding: 24px 20px 40px; }
        .home { width: 100%; justify-content: center; }
    }
</style>
<script>
    // 사이트와 같은 저장값(staruniv-theme), 없으면 기기 설정
    try {
        var t = localStorage.getItem('staruniv-theme') ||
            (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    } catch (e) {}
</script>
</head>
<body>
<header class="bar"><a class="logo" data-root href="/">스타<b>대학</b></a></header>
<section class="hero">
    <p class="eyebrow">PAGE NOT FOUND</p>
    <p class="code">4<span>0</span>4</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p class="desc">주소가 바뀌었거나 없는 페이지입니다<br>잠시 뒤에 다시 열거나 아래 메뉴로 이동해 주세요</p>
</section>
<main class="body">
    <a class="home" data-root href="/">스타대학 홈으로</a>
    <p class="label">바로 가기</p>
    <nav class="menu">
        <a data-root="schedule/" href="/schedule/">일정</a>
        <a data-root="members/" href="/members/">멤버</a>
        <a data-root="records/" href="/records/">전적</a>
        <a data-root="tier/" href="/tier/">티어표</a>
        <a data-root="video/" href="/video/">영상</a>
        <a data-root="stats/" href="/stats/">방송통계</a>
        <a data-root="tools/" href="/tools/">도구</a>
    </nav>
</main>
<script>
    // GitHub Pages 프로젝트 페이지는 첫 경로 조각(저장소 이름)까지가 사이트 루트이고, 그 외는 "/"가 루트다.
    (function () {
        var segs = location.pathname.split('/').filter(Boolean);
        var root = /\.github\.io$/.test(location.hostname) && segs.length > 0 ? '/' + segs[0] + '/' : '/';
        document.querySelectorAll('[data-root]').forEach(function (a) { a.href = root + a.getAttribute('data-root'); });
    })();
</script>
</body>
</html>
