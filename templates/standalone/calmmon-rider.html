<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>캄몬라이더</title>
        <meta name="description" content="출전 선수를 고르고 자동 카트 레이스를 관전하는 MONSTARZ 시뮬레이터" />
        <!-- 사이트와 같은 주소의 Pretendard라 브라우저 캐시를 그대로 쓴다(iframe이라 부모 글꼴이 상속되지 않는다). -->
        <link
            rel="stylesheet"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css"
        />
        <link rel="stylesheet" href="calmmon-rider.css" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%232979ff%22%2F%3E%3Cpath%20d%3D%22M13%2047V17h9l10%2016%2010-16h9v30h-9V32L32%2047%2022%2032v15z%22%20fill%3D%22white%22%2F%3E%3C%2Fsvg%3E"
        />
    </head>
    <body>
        <main id="opening" class="opening">
            <div class="opening-title">
                <span class="opening-watermark" aria-hidden="true">09</span>
                <h1 class="opening-wordmark"><span>캄몬</span>라이더</h1>
                <p>17명의 멤버와 예측불가 아이템전. 오늘의 우승자는?</p>
            </div>
            <div class="opening-grid">
                <div class="lineup-card">
                    <section id="selection">
                        <div class="panel-head">
                            <h2>선수 선택 <span id="selectedCount">8</span></h2>
                            <div class="roster-actions" role="group" aria-label="선수 선택 도구">
                                <button id="all" class="tool-btn">전체 선택</button
                                ><button id="random" class="tool-btn">랜덤 8명</button
                                ><button id="clear" class="tool-btn">선택 해제</button>
                            </div>
                        </div>
                        <p class="subtle">카드를 눌러 출전 / 제외 · 최소 2명</p>
                        <div id="roster"></div>
                        <form id="addDriverForm" class="add-driver">
                            <label for="driverName">게스트 선수 추가</label>
                            <div>
                                <input
                                    id="driverName"
                                    maxlength="300"
                                    placeholder="게스트 이름 · 쉼표로 여러 명"
                                    autocomplete="off"
                                    required
                                /><button class="small-btn" type="submit">추가 +</button>
                            </div>
                            <p id="driverMessage" role="status"></p>
                        </form>
                    </section>
                </div>
                <aside class="setup-card">
                    <div class="setup-heading"><h2>경기 설정</h2></div>
                    <div class="entry-start-row">
                        <div class="entry-summary">
                            <span>출전 선수</span><b id="entryCount">08 <small>명</small></b>
                        </div>
                        <button id="start" class="primary start-race">
                            경기 시작 <span aria-hidden="true">▶</span>
                        </button>
                    </div>
                    <div class="setting-block">
                        <label for="trackSelect">트랙</label
                        ><select id="trackSelect">
                            <option value="park">몬스타즈파크</option>
                            <option value="pocket">캄몬빌리지 · 모바일 추천</option>
                        </select>
                    </div>
                    <div class="setting-block">
                        <label for="laps">레이스 길이</label
                        ><select id="laps">
                            <option value="1">1바퀴</option>
                            <option value="3" selected>3바퀴</option>
                            <option value="5">5바퀴</option>
                        </select>
                    </div>
                    <div class="setting-block">
                        <label>관전 배속</label>
                        <div class="segmented" id="speedButtons">
                            <button data-speed="1" class="active">1×</button><button data-speed="2">2×</button
                            ><button data-speed="4">4×</button>
                        </div>
                    </div>
                    <div class="setting-block">
                        <label>카메라</label>
                        <div class="camera-controls">
                            <button data-camera="auto" class="active">자동</button
                            ><button data-camera="wide">전체</button><button data-camera="leader">선두</button>
                        </div>
                    </div>
                    <div class="setting-block item-block">
                        <span class="block-label" id="itemListLabel">아이템 목록</span>
                        <div class="item-lineup" aria-labelledby="itemListLabel">
                            <span title="바나나">🍌</span><span title="우주선">🛸</span><span title="물폭탄">💧</span
                            ><span title="물파리"
                                ><svg width="19" height="19" viewBox="-10 -10 20 20" aria-hidden="true">
                                    <g fill="#aee0fa" stroke="#7cc9f2" stroke-width=".7">
                                        <ellipse
                                            cx="-4.6"
                                            cy="-4.2"
                                            rx="4.6"
                                            ry="2.1"
                                            transform="rotate(-42 -4.6 -4.2)"
                                        />
                                        <ellipse cx="4.6" cy="-4.2" rx="4.6" ry="2.1" transform="rotate(42 4.6 -4.2)" />
                                    </g>
                                    <ellipse cx="0" cy="1.2" rx="3.7" ry="4.6" fill="#3fadea" />
                                    <circle cx="0" cy="-3.4" r="2.6" fill="#7fd4f7" />
                                    <circle cx="-1.3" cy="-4.2" r=".7" fill="#fff" /></svg></span
                            ><span title="바리케이드">🚧</span><span title="미사일">🚀</span
                            ><span title="방어막">🛡</span><span title="번개">ϟ</span><span title="부스터">🔥</span
                            ><span title="자석">🧲</span>
                        </div>
                    </div>
                    <p id="error" role="status"></p>
                </aside>
            </div>
        </main>
        <main id="broadcast" class="workspace" hidden>
            <aside class="rank-panel">
                <div class="panel-head"><h2 id="rankTitle">실시간 순위</h2></div>
                <section id="standings"><div id="leaderList"></div></section>
            </aside>
            <section class="race-panel">
                <div class="track-wrap">
                    <canvas id="game" aria-label="아이템 레이싱 화면"></canvas>
                    <div class="race-hud">
                        <span class="track-name" id="trackName">몬스타즈파크</span><b id="lapLabel">3 LAPS</b
                        ><span id="timer">00:00.00</span><span id="finalBadge" aria-hidden="true">FINAL LAP</span>
                    </div>
                    <div id="countdown" aria-live="polite"></div>
                    <canvas id="miniMap" width="240" height="150" aria-label="전체 코스"></canvas>
                    <div id="itemToast" role="status"></div>
                </div>
                <div class="race-actions">
                    <div class="live-options" role="group" aria-label="관전 설정">
                        <button
                            id="soundToggle"
                            class="small-btn"
                            aria-pressed="true"
                            aria-label="소리 켜짐, 눌러서 끄기"
                        >
                            <span class="sound-label">소리 켜짐</span
                            ><svg
                                class="sound-icon"
                                viewBox="0 0 20 20"
                                width="14"
                                height="14"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M8 7H4v6h4l5 3V4L8 7Z" />
                                <path class="sound-waves" d="M16 7a5 5 0 0 1 0 6" />
                                <path class="sound-slash" d="M3 3l14 14" />
                            </svg></button
                        ><button id="pause" class="small-btn" hidden>일시 정지 Ⅱ</button
                        ><button id="reset" class="small-btn" hidden>나가기</button
                        ><button id="cinema" class="small-btn" hidden>화면 확대 ⛶</button>
                        <div class="camera-controls">
                            <button data-camera="auto" class="active">자동 카메라</button
                            ><button data-camera="wide">전체</button><button data-camera="leader">선두</button>
                        </div>
                        <div class="segmented">
                            <button data-speed="1" class="active">1×</button><button data-speed="2">2×</button
                            ><button data-speed="4">4×</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <div hidden>
            <div class="session-controls" role="group" aria-label="경기 조작">
                <button id="ceremonyOpen" class="small-btn" hidden>시상식 보기</button
                ><button id="replay" class="primary" hidden>다시 경기</button>
            </div>
            <span id="cameraLabel"></span><span id="sessionStatus"></span><span id="trackState"></span
            ><span id="focusLabel"></span><span id="commentary"></span><span id="centerOverlay"></span>
        </div>
        <dialog id="ceremony" aria-labelledby="ceremonyTitle">
            <button id="ceremonyClose" class="ceremony-close" aria-label="시상식 닫고 시작 화면으로 나가기">×</button>
            <div class="ceremony-heading">
                <span>RACE COMPLETE</span>
                <h2 id="ceremonyTitle">오늘의 주인공</h2>
                <p id="ceremonySummary"></p>
            </div>
            <div id="podium" class="podium"></div>
            <div id="ceremonyResults" class="ceremony-results" hidden aria-label="전체 순위"></div>
            <div class="ceremony-actions">
                <button id="ceremonyReplay" class="primary">다시 경기 ▶</button
                ><button id="ceremonyRanking" class="small-btn">전체 순위</button
                ><button id="ceremonyLineup" class="small-btn">나가기</button>
            </div>
        </dialog>
        <script src="calmmon-rider.js"></script>
    </body>
</html>
