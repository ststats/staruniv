<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티뷰어 - 스타대학</title>
<!-- 주소(?list=...) 없이는 빈 화면이라 검색에 올리지 않는다 -->
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-tier.css">
<link rel="stylesheet" href="style-tools.css">
<link rel="stylesheet" href="style-shared.css">
<style>
html,
body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}
html {
    scrollbar-gutter: auto;
}
.mv-fab {
    position: fixed;
    top: 6px;
    right: 12px;
    z-index: 100;
    width: 28px;
    height: 28px;
    padding: 0;
    clip-path: var(--notch-4);
    border: none;
    background: var(--color-primary);
    opacity: 0.85;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(41, 121, 255, 0.35);
    transition:
        opacity 0.15s,
        transform 0.1s,
        background 0.15s;
}
.mv-fab svg {
    width: 16px;
    height: 16px;
}
.mv-fab .mv-fab-close {
    display: none;
}
.mv-fab:hover {
    opacity: 1;
    transform: scale(1.06);
}
.mv-fab.active {
    background: var(--color-primary-deep);
    opacity: 1;
}
html:not([data-theme="dark"]) .mv-fab {
    background: var(--navy);
    box-shadow: 0 2px 8px rgba(20, 38, 70, 0.25);
}
.mv-fab.active .mv-fab-gear {
    display: none;
}
.mv-fab.active .mv-fab-close {
    display: block;
}
.mv-settings-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    width: 520px;
    max-width: 100vw;
    background: var(--color-bg);
    box-shadow: -8px 0 24px rgba(20, 24, 33, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.2s ease;
}
.mv-settings-panel.is-open {
    transform: translateX(0);
}
.mv-settings-top {
    padding-right: 40px;
    min-height: 28px;
    display: flex;
    align-items: center;
    margin-bottom: var(--space-stack-gap);
}
.mv-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0;
}
.mv-title-main {
    color: var(--color-text-main);
}
#mv-grid-area { height: 100dvh; }
.mv-grid {
    display: grid;
    height: 100%;
}
.mv-cell {
    position: relative;
    background: var(--color-video-bg);
    overflow: hidden;
    min-height: 0;
    container: mv-cell / inline-size;
}
.mv-cell-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-inline-gap);
    padding: 10px 12px;
    font-size: var(--fs-body);
    font-weight: 800;
    color: #fff;
    opacity: 0.55;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    pointer-events: none;
    transition:
        opacity 0.15s,
        padding-right 0.15s,
        padding-top 0.15s;
}
.mv-cell-header .mv-cell-actions {
    pointer-events: auto;
}
.mv-cell:hover .mv-cell-header,
.mv-cell-header:focus-within {
    opacity: 1;
}
.mv-cell-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.mv-cell-corner .mv-cell-header {
    padding-right: 46px;
}
.mv-cell-corner.mv-cell-corner-compact .mv-cell-header {
    padding-top: 38px;
    padding-right: 12px;
}
@container mv-cell (max-width: 99.98px) {
    .mv-cell-header {
        flex-wrap: wrap;
        row-gap: 2px;
    }
    .mv-cell-name {
        flex: 1 0 100%;
    }
    .mv-cell-actions {
        margin-left: auto;
    }
}
.mv-cell-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
}
.mv-cell-btn {
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    clip-path: var(--notch-4);
    background: rgba(0, 0, 0, 0.35);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition:
        background 0.15s,
        color 0.15s;
}
.mv-cell-btn svg {
    width: 15px;
    height: 15px;
    display: block;
}
.mv-cell-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
}
@keyframes mvSpin {
    to {
        transform: rotate(360deg);
    }
}
.mv-cell-refresh.is-loading { pointer-events: none; }
.mv-cell-refresh.is-loading svg {
    animation: mvSpin 0.8s linear infinite;
}
.mv-cell-body {
    position: absolute;
    inset: 0;
    background: var(--color-video-bg);
}
.mv-cell-video-wrap {
    position: relative;
    width: 100%;
    height: 100%;
}
.mv-cell-video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
.mv-cell-video-wrap iframe:fullscreen,
.mv-cell-video-wrap iframe:-webkit-full-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
}
.mv-cell-main {
    grid-column: span 2;
    grid-row: span 2;
}

.mv-empty {
    text-align: center;
    color: var(--color-text-sub);
    font-size: var(--fs-body);
    padding: 30vh 0;
}
.mv-settings-inner {
    width: 100%;
    padding: 20px;
}
@media (max-width: 420px) {
    .mv-settings-panel {
        width: 100vw;
    }
    .mv-settings-inner {
        padding: 16px;
    }
}
</style>
</head>
<body>
<main>
<h1 class="sr-only">멀티뷰어</h1>

<button type="button" class="mv-fab" id="mv-fab" data-click="mvToggleSettingsPanel" title="설정 열기/닫기" aria-label="설정 열기" aria-expanded="false" aria-controls="mv-settings-panel">
    <svg class="mv-fab-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <svg class="mv-fab-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
</button>

<div class="mv-settings-panel" id="mv-settings-panel">
    <div class="mv-settings-inner">
        <div class="mv-settings-top">
            <div class="mv-title"><span class="mv-title-main">멀티</span><span class="logo-accent">뷰어</span></div>
        </div>

        <div class="section-title"><span class="section-title-label">설정</span></div>
        <div class="mv-console">
            <div class="mv-console-tiles">
                <div class="mv-tile">
                    <svg class="mv-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
                    <div class="mv-tile-label">그리드</div>
                    <button type="button" class="mv-toggle-switch" id="mv-mode-toggle" aria-label="그리드 모드" aria-pressed="false" data-click="mvToggleFocusMode"></button>
                </div>
                <div class="mv-tile disabled" id="mv-col-tile">
                    <svg class="mv-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>
                    <div class="mv-tile-label">열 개수</div>
                    <div class="mv-stepper">
                        <button type="button" aria-label="열 줄이기" data-click="mvChangeCols" data-args='[-1]'>−</button>
                        <span class="mv-stepper-value" id="mv-cols-value" aria-live="polite">자동</span>
                        <button type="button" aria-label="열 늘리기" data-click="mvChangeCols" data-args='[1]'>+</button>
                    </div>
                </div>
                <div class="mv-tile">
                    <svg class="mv-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <div class="mv-tile-label">다크 모드</div>
                    <button type="button" class="mv-toggle-switch" id="mv-theme-toggle" aria-label="다크 모드" aria-pressed="false" data-click="mvToggleTheme"></button>
                </div>
            </div>
        </div>

        <div class="section-title"><span class="section-title-label">선택된 목록</span></div>
        <div class="mv-order-row" id="mv-order-row"></div>

        <div class="section-title"><span class="section-title-label">멤버 선택</span></div>
        <div class="mv-chip-box">
            <div class="mv-chip-row" id="mv-chip-row"></div>
            <div class="mv-quickadd">
                <input type="text" id="mv-add-input" placeholder="숲아이디 직접 입력" aria-label="숲아이디 직접 입력" maxlength="20" data-enter="mvAddCustom">
                <button type="button" class="mv-quickadd-btn" title="추가" aria-label="추가" data-click="mvAddCustom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
        </div>
    </div>
</div>

<div id="mv-grid-area"></div>
</main>

<script src="actions.js"></script>
<script src="supabase-config.js"></script>
<script src="api.js"></script>
<script src="mv-shared.js"></script>
<script src="multiview.js"></script>
</body>
</html>
