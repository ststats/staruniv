<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어드민</title>
<link rel="icon" type="image/webp" href="./logos/파비콘.webp">
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<!-- xlsx(엑셀)를 브라우저에서 직접 읽고/쓰기 위한 라이브러리(SheetJS). 최신
     안정 버전(0.20.3) - 0.20.1 이하는 ReDoS 취약점(CVE-2024-22363)이 있어
     반드시 이 버전 이상을 써야 한다. SheetJS는 npm 레지스트리 갱신을 중단하고
     자체 CDN(cdn.sheetjs.com)만 공식으로 관리하므로, jsdelivr/unpkg 같은
     제3자 CDN이 아니라 이 주소를 직접 쓴다. -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
@font-face {
  font-family: 'Pretendard Variable';
  font-weight: 45 920;
  font-style: normal;
  font-display: block;
  src: url('fonts/PretendardVariable.woff2') format('woff2-variations');
}

html { scrollbar-gutter: stable; }
* { box-sizing: border-box; }

body {
  font-family: 'Pretendard Variable', sans-serif;
  background: #f4f5f7;
  margin: 0;
  padding: 20px 10px;
  color: #1a1d29;
}

.page-wrap { max-width: 1080px; margin: 0 auto; }

/* 1. Top Bar - 메인 페이지 CSS 클래스 완벽 동일 적용 */
.top-bar { max-width: 1080px; margin: 0 auto 16px; background: #fff; border-radius: 20px; padding: 16px 20px; min-height: 64px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; box-shadow: 0 1px 2px rgba(20,20,30,0.04), 0 4px 12px rgba(20,20,30,0.05); }
.month-select-group { display: inline-flex; align-items: center; gap: 6px; position: relative; }
.top-date-btn { background: transparent; border: none; font-size: 20px; font-weight: 800; color: #141821; padding: 2px 0; font-family: inherit; display:flex; align-items:center; gap: 6px; }
.top-date-select { font-size: 20px; font-weight: 800; color: #4a5ce0; border: none; background: transparent; padding: 2px 0; }

.top-meta-group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.back-link { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: #8a8d97; text-decoration: none; }
.back-link:hover { color: #4a5ce0; }
.top-meta-sep { color: #c2c5cc; font-size: 10px; }
.top-meta { font-size: 10px; color: #a4a8b2; white-space: nowrap; }

/* 2. 어드민 페이지 전용 Card 및 입력 UI */
.card {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(20,20,30,0.04), 0 8px 24px rgba(20,20,30,0.06);
}

.field-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.field-row.nowrap { flex-wrap: nowrap; } 
.field-row + .field-row { margin-top: 14px; }
.field-label { font-size: 13px; color: #1a1d29; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
.input-fluid { flex: 1; min-width: 0; } 
.btn-group { display: flex; gap: 8px; flex-shrink: 0; white-space: nowrap; }

input[type=text], input[type=password], select {
  padding: 10px 14px;
  border: 1px solid #eef0f2;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  background: #fbfbfc;
  color: #1a1d29;
  transition: all 0.2s ease;
}
input[type=text]:focus, input[type=password]:focus, select:focus {
  outline: none;
  border-color: #4a5ce0;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(74, 92, 224, 0.1);
}

button {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  background: #4a5ce0;
  color: #fff;
  transition: background 0.15s ease;
  white-space: nowrap;
}
button:hover { background: #3d4ecf; }
button.secondary { background: #eef0f2; color: #1a1d29; }
button.secondary:hover { background: #e2e4ea; }
button.danger { background: #fdeaea; color: #c0392b; padding: 6px 12px; font-size: 12px; }
button.danger:hover { background: #fadada; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

#status-inline.error { color: #c0392b; }
#status-inline.success { color: #0f8a4c; }

.row-count { display: block; font-size: 11px; font-weight: 800; color: #a4a8b2; text-align: right; margin-bottom: 12px; }

.table-wrap {
  max-height: 65vh;
  overflow: auto;
  border: 1px solid #f0f1f4;
  border-radius: 16px;
  -webkit-overflow-scrolling: touch;
  background: #fff;
}
table { width: 100%; min-width: 1200px; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left;
  padding: 14px 12px;
  border-bottom: 2px solid #f0f1f4;
  color: #a4a8b2;
  font-weight: 800;
  font-size: 13px;
  position: sticky;
  top: 0;
  background: #fafbfc;
  white-space: nowrap;
  z-index: 10;
}
tbody td { padding: 6px 8px; border-bottom: 1px solid #f5f6f8; }
tbody tr:hover { background: #fbfbfc; }
.col-del { min-width: 70px; text-align: center; }

td input, td select {
  width: 100%;
  min-width: 110px;
  padding: 8px 12px;
  font-size: 14px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
}
td select { min-width: 80px; }
td input[data-field="id"], td input[data-field="nickname"] { min-width: 130px; }
td input[data-field="info_updated_at"] { min-width: 120px; }

td input:hover, td select:hover { border-color: #eef0f2; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
td input:focus, td select:focus { outline: none; border-color: #4a5ce0; background: #fff; }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="top-bar">
    <span class="month-select-group">
      <span class="top-date-btn" style="cursor: default;">STARUNIV 어드민</span>
      <span class="top-meta" style="margin-left: 2px;">members.xlsx 편집</span>
    </span>
    <span class="top-meta-group">
      <a class="back-link" href="index.html">전체페이지</a>
      <span class="top-meta-sep">·</span>
      <span class="top-meta" id="status-inline">토큰 대기 중</span>
    </span>
  </div>

  <div class="card">
    <div class="field-row nowrap">
      <label class="field-label">토큰</label>
      <input type="password" id="token-input" class="input-fluid" placeholder="ghp_...">
      <div class="btn-group">
        <button class="secondary" id="save-token-btn">토큰 저장</button>
        <button id="load-btn">불러오기</button>
      </div>
    </div>
  </div>

  <div class="card" id="editor-card" style="display:none;">
    <div class="field-row" style="margin-bottom:12px;">
      <input type="text" id="search-input" class="input-fluid" placeholder="닉네임 / 아이디 / 팀 검색">
      <div class="btn-group">
        <button class="secondary" id="add-btn">+ 새 멤버 추가</button>
      </div>
    </div>
    
    <div class="row-count" id="row-count"></div>
    
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>아이디</th>
            <th>엘로ID</th>
            <th>닉네임</th>
            <th>성별</th>
            <th>생일</th>
            <th>직책</th>
            <th>팀</th>
            <th>종족</th>
            <th>티어</th>
            <th>수정일</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    
    <div class="field-row" style="margin-top:20px;">
      <input type="text" id="commit-msg" class="input-fluid" placeholder="커밋 메시지 (비우면 자동)">
      <div class="btn-group">
        <button class="secondary" id="save-only-btn">저장</button>
        <button id="save-btn">저장 + 워크플로우 실행</button>
      </div>
    </div>
  </div>

</div>

<script>
const OWNER = 'ststats';
const REPO = 'staruniv';
const BRANCH = 'main';
const FILE_PATH = 'data/members.xlsx';
const SHEET_NAME = 'members';
const WORKFLOW_FILE = 'update-stats.yml';

// xlsx 시트의 컬럼 순서(A~J) - Python 쪽 스크립트(_common.py의 parse_xlsx_members/
// write_xlsx)와 반드시 같은 순서를 써야 한다. 헤더 행(1행)은 저장할 때 절대
// 건드리지 않는다(아래 commitMembers 참고) - 기존 파일에 이미 있는 헤더
// 문구/서식을 그대로 유지하기 위함이라, 여기선 그냥 컬럼 순서 참고용 주석으로만
// 남겨둔다: 이름, SOOP ID, ELO ID, 생년월일, 성별, 종족, 티어, 소속, 직책, 수정일

let members = [];
let fileSha = null;
// 불러온 워크북 전체(다른 시트, 헤더 서식, 열 너비 등 포함)를 그대로 들고
// 있다가, 저장할 때 members 시트의 데이터 부분(2행부터)만 갈아끼운다 - 매번
// 새 워크북을 처음부터 만들면(XLSX.utils.book_new()) 원본 파일에 다른 시트가
// 있거나 서식이 있어도 다 사라지기 때문이다.
let loadedWorkbook = null;

const FIELDS = ['id', 'elo_id', 'nickname', 'gender', 'birthdate', 'role', 'team', 'race', 'tier', 'info_updated_at'];

function getToken() {
  return sessionStorage.getItem('starts_admin_token') || '';
}

const STATUS_MAX_LEN = 60;

function setStatus(msg, type) {
  const inlineEl = document.getElementById('status-inline');
  inlineEl.textContent = msg.length > STATUS_MAX_LEN ? msg.slice(0, STATUS_MAX_LEN) + '…' : msg;
  inlineEl.className = 'top-meta' + (type ? ' ' + type : '');
}

document.getElementById('token-input').value = getToken();

document.getElementById('save-token-btn').addEventListener('click', () => {
  const v = document.getElementById('token-input').value.trim();
  if (!v) { alert('토큰을 입력하세요'); return; }
  sessionStorage.setItem('starts_admin_token', v);
  setStatus('토큰 저장됨', 'success');
});

async function ghFetch(path, options) {
  const token = getToken();
  if (!token) throw new Error('먼저 토큰을 저장하세요');
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {
    ...options,
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options && options.headers ? options.headers : {}),
    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`GitHub API ${res.status}: ${text.slice(0, 300)}`);
  }
  return res.status === 204 ? null : res.json();
}

// 날짜 셀 값(엑셀 날짜 타입이면 JS Date 객체, 텍스트로 저장돼있었으면 문자열)을
// "YYYY-MM-DD" 문자열로 통일한다. 값이 없으면 null.
function cellToDateString(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) {
    const pad2 = (n) => String(n).padStart(2, '0');
    return `${v.getFullYear()}-${pad2(v.getMonth() + 1)}-${pad2(v.getDate())}`;
  }
  return String(v).trim() || null;
}

// 시트의 한 행(배열, A~J 순서)을 우리가 다루는 member 객체로 변환한다.
// Python 쪽(_common.py의 parse_xlsx_members)과 필드 의미/변환 규칙을 맞춘다
// (성별은 시트엔 "남자"/"여자"로 저장되지만, 내부적으로는 "m"/"f"로 다룬다).
function rowToMember(row) {
  const [nickname, soopId, eloId, birthdate, genderKr, race, tier, team, role, updatedAt] = row;
  let gender = genderKr;
  if (genderKr === '남자') gender = 'm';
  else if (genderKr === '여자') gender = 'f';
  return {
    id: soopId != null ? String(soopId) : '',
    elo_id: (eloId === undefined || eloId === null || eloId === '') ? null : eloId,
    nickname: nickname != null ? nickname : '',
    gender: gender || '',
    birthdate: cellToDateString(birthdate),
    role: role || '',
    team: team != null ? team : '',
    race: race != null ? race : '',
    tier: tier != null ? String(tier) : '',
    info_updated_at: cellToDateString(updatedAt),
  };
}

// member 객체를 시트에 쓸 한 행(배열, A~J 순서)으로 되돌린다. rowToMember의 역방향.
function memberToRow(m) {
  let genderKr = m.gender;
  if (m.gender === 'm') genderKr = '남자';
  else if (m.gender === 'f') genderKr = '여자';
  const eloId = (m.elo_id === '' || m.elo_id == null) ? null : Number(m.elo_id);
  return [
    m.nickname || null,
    m.id || null,
    Number.isNaN(eloId) ? null : eloId,
    m.birthdate || null,
    genderKr || null,
    m.race || null,
    m.tier || null,
    m.team || null,
    m.role || null,
    m.info_updated_at || null,
  ];
}

document.getElementById('load-btn').addEventListener('click', async () => {
  setStatus('불러오는 중...', '');
  try {
    const data = await ghFetch(`/contents/${FILE_PATH}?ref=${BRANCH}`, { method: 'GET' });
    fileSha = data.sha;
    // GitHub Contents API는 파일 내용을 base64로 준다 - xlsx는 바이너리
    // 포맷이라 텍스트로 디코드하지 않고, SheetJS가 base64를 직접 읽게 한다.
    const wb = XLSX.read(data.content, { type: 'base64', cellDates: true });
    if (!wb.SheetNames.includes(SHEET_NAME)) {
      throw new Error(`'${SHEET_NAME}' 시트를 찾을 수 없습니다. (있는 시트: ${wb.SheetNames.join(', ')})`);
    }
    loadedWorkbook = wb;
    const ws = wb.Sheets[SHEET_NAME];
    // header:1 = 각 행을 객체가 아니라 배열로 반환(컬럼 위치 그대로 다루기
    // 위함). range:1 = 0-index 1번째 행(=엑셀 2행)부터 읽어서 헤더 행은 건너뜀.
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, range: 1 });
    members = rows
      .filter((r) => Array.isArray(r) && r.length > 0 && r[1] != null && r[1] !== '')
      .map(rowToMember);
    document.getElementById('editor-card').style.display = '';
    renderTable();
    setStatus(`불러옴: ${members.length}명 (sha ${fileSha.slice(0, 7)})`, 'success');
  } catch (e) {
    setStatus('불러오기 실패: ' + e.message, 'error');
  }
});

function escapeAttr(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function renderTable() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const tbody = document.getElementById('table-body');
  let shown = 0;
  let html = '';

  members.forEach((m, idx) => {
    if (q) {
      const hay = (m.nickname + ' ' + m.id + ' ' + m.team).toLowerCase();
      if (!hay.includes(q)) return;
    }
    shown++;
    
    html += `<tr>`;
    
    FIELDS.forEach((field) => {
      if (field === 'gender') {
        html += `<td><select data-idx="${idx}" data-field="gender">
          <option value="m"${m.gender === 'm' ? ' selected' : ''}>m</option>
          <option value="f"${m.gender === 'f' ? ' selected' : ''}>f</option>
        </select></td>`;
      } else {
        html += `<td><input type="text" data-idx="${idx}" data-field="${field}" value="${escapeAttr(m[field])}"></td>`;
      }
    });
    
    html += `<td><button class="danger" data-action="delete" data-idx="${idx}">삭제</button></td></tr>`;
  });

  tbody.innerHTML = html;
  document.getElementById('row-count').textContent = `${shown} / ${members.length}명 표시 중`;
}

document.getElementById('table-body').addEventListener('change', (e) => {
  const field = e.target.dataset.field;
  if (!field) return;
  const idx = Number(e.target.dataset.idx);
  members[idx][field] = e.target.value === '' ? null : e.target.value;
});

document.getElementById('table-body').addEventListener('click', (e) => {
  if (e.target.dataset.action !== 'delete') return;
  const idx = Number(e.target.dataset.idx);
  const m = members[idx];
  if (!confirm(`${m.nickname || m.id} 삭제할까요?`)) return;
  members.splice(idx, 1);
  renderTable();
});

let searchDebounceTimer = null;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderTable, 150);
});

document.getElementById('add-btn').addEventListener('click', () => {
  const blank = {};
  FIELDS.forEach((f) => { blank[f] = f === 'gender' ? 'm' : ''; });
  const now = new Date();
  const pad2 = (n) => String(n).padStart(2, '0');
  blank.info_updated_at = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  members.unshift(blank);
  document.getElementById('search-input').value = '';
  renderTable();
});

async function commitMembers() {
  if (!loadedWorkbook) {
    throw new Error('먼저 불러오기를 해야 저장할 수 있습니다.');
  }
  const ws = loadedWorkbook.Sheets[SHEET_NAME];

  // 기존 시트에 이미 있던 데이터 행 범위를 확인한다(헤더 1행 포함). 지금
  // 저장할 인원이 예전보다 줄었으면(누군가 삭제됨) 남는 오래된 셀이 그대로
  // 남아있으면 안 되니, 데이터 영역(2행부터, 헤더는 절대 안 건드림)을 먼저
  // 싹 비우고 나서 새로 쓴다.
  const oldRange = ws['!ref']
    ? XLSX.utils.decode_range(ws['!ref'])
    : { s: { r: 0, c: 0 }, e: { r: 0, c: 9 } };
  for (let r = 1; r <= oldRange.e.r; r++) {
    for (let c = 0; c <= 9; c++) {
      delete ws[XLSX.utils.encode_cell({ r, c })];
    }
  }

  // origin: 'A2' - 2행(0-index r=1)부터 쓴다. 1행(헤더)은 절대 안 건드리므로
  // 기존 파일의 헤더 문구/서식이 그대로 유지된다.
  const memberRows = members.map(memberToRow);
  XLSX.utils.sheet_add_aoa(ws, memberRows, { origin: 'A2' });

  // 시트의 사용 범위(!ref)를 새 데이터 크기에 맞게 갱신한다 - 안 그러면 예전
  // 범위 그대로 남아서, 방금 지운 빈 셀들까지 "이 시트 범위 안"인 것처럼
  // 남아있는 도구가 있을 수 있다.
  ws['!ref'] = XLSX.utils.encode_range({
    s: { r: 0, c: 0 },
    e: { r: Math.max(memberRows.length, oldRange.e.r), c: Math.max(oldRange.e.c, 9) },
  });

  // loadedWorkbook 전체(members 시트 말고 다른 시트가 있었다면 그것도 포함)를
  // 그대로 다시 내보낸다 - 이번에 건드린 건 members 시트의 데이터 부분뿐이다.
  // xlsx는 바이너리 포맷이라, JSON 때처럼 텍스트를 UTF-8 바이트로 바꿔 base64
  // 인코딩하는 게 아니라 SheetJS가 바이너리 자체를 base64로 직접 내보내게
  // 한다 - GitHub Contents API는 파일 내용을 항상 base64로 받는다.
  const base64Content = XLSX.write(loadedWorkbook, { type: 'base64', bookType: 'xlsx' });

  const msgInput = document.getElementById('commit-msg').value.trim();
  const message = msgInput || `어드민 페이지에서 members.xlsx 수정 (${members.length}명)`;

  const putRes = await ghFetch(`/contents/${FILE_PATH}`, {
    method: 'PUT',
    body: JSON.stringify({
      message,
      content: base64Content,
      sha: fileSha,
      branch: BRANCH,
    }),
  });
  fileSha = putRes.content.sha;
}

function confirmIfMissingFields() {
  const missing = members.filter((m) => !m.id || !m.nickname);
  if (missing.length > 0) {
    return confirm(`아이디 또는 닉네임이 비어있는 항목이 ${missing.length}개 있습니다. 그래도 저장할까요?`);
  }
  return true;
}

document.getElementById('save-only-btn').addEventListener('click', async () => {
  if (!confirmIfMissingFields()) return;

  setStatus('저장 중...', '');
  document.getElementById('save-only-btn').disabled = true;
  document.getElementById('save-btn').disabled = true;
  try {
    await commitMembers();
    setStatus(`저장 완료 (${members.length}명, ${new Date().toLocaleString('ko-KR')})`, 'success');
  } catch (e) {
    setStatus('저장 실패: ' + e.message, 'error');
  } finally {
    document.getElementById('save-only-btn').disabled = false;
    document.getElementById('save-btn').disabled = false;
  }
});

document.getElementById('save-btn').addEventListener('click', async () => {
  if (!confirmIfMissingFields()) return;

  setStatus('저장 중...', '');
  document.getElementById('save-only-btn').disabled = true;
  document.getElementById('save-btn').disabled = true;
  try {
    await commitMembers();
    setStatus('커밋 완료. 워크플로우 실행 중...', 'success');

    await ghFetch(`/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
      method: 'POST',
      body: JSON.stringify({ ref: BRANCH }),
    });
    setStatus(`저장 완료 + 워크플로우 실행됨 (${members.length}명, ${new Date().toLocaleString('ko-KR')})`, 'success');
  } catch (e) {
    setStatus('저장 실패: ' + e.message, 'error');
  } finally {
    document.getElementById('save-only-btn').disabled = false;
    document.getElementById('save-btn').disabled = false;
  }
});
</script>
</body>
</html>
