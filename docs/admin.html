<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스타대학 대시보드 - 어드민 관리</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/redesign.css">
  <style>
    .admin-container { max-width: 800px; margin: 40px auto; padding: 24px; }
    .form-row { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .color-preview-box { display: inline-block; width: 14px; height: 14px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  </style>
</head>
<body class="dark-mode">
  <div class="admin-container cut-box">
    <h2>캘린더 일정 등록 / 수정</h2>
    <form id="adminScheduleForm">
      <div class="form-row">
        <label for="eventTitle">일정 제목</label>
        <input type="text" id="eventTitle" required class="form-input" placeholder="예: YB vs JSA 대학대전">
      </div>
      <div class="form-row">
        <label for="eventStartDate">시작 날짜</label>
        <input type="date" id="eventStartDate" required class="form-input">
      </div>
      <div class="form-row">
        <label for="eventEndDate">종료 날짜 (연속 일정일 경우)</label>
        <input type="date" id="eventEndDate" class="form-input">
      </div>
      <!-- 17번: 빨주노초파남보회검 색상 옵션 선택 -->
      <div class="form-row">
        <label for="eventColor">일정 라벨 색상 (캘린더 반영)</label>
        <select id="eventColor" class="form-select">
          <option value="red">🔴 빨간색 (Red)</option>
          <option value="orange">🟠 주황색 (Orange)</option>
          <option value="yellow">🟡 노란색 (Yellow)</option>
          <option value="green">🟢 초록색 (Green)</option>
          <option value="blue" selected>🔵 파란색 (Blue)</option>
          <option value="indigo">🟣 남색 (Indigo)</option>
          <option value="purple">🟪 보라색 (Purple)</option>
          <option value="gray">⚪ 회색 (Gray)</option>
          <option value="black">⚫ 검은색 (Black)</option>
        </select>
      </div>
      <div class="form-row">
        <label for="eventDesc">비고 / 상세 내용</label>
        <textarea id="eventDesc" rows="3" class="form-input"></textarea>
      </div>
      <button type="submit" class="btn-primary">일정 저장</button>
    </form>
  </div>
</body>
</html>
