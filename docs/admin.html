<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어드민 - 스타대학</title>

<!--
    이 관리자 페이지는 사이트가 실제로 쓰는 style.css / calendar.js / holidays.json을
    그대로 링크해서 씁니다(복사본 아님) - 그래서 사이트 디자인이 바뀌면 이 페이지도
    자동으로 같이 바뀝니다. 사이트 본편(index.html)과 동일한 상단바 + 페이지 전환
    구조(.top-navbar/.page-section, switchPage)를 그대로 재사용해서, 나중에 다른
    탭(홈/멤버/전적/방송통계/도구)에도 각자의 관리 기능을 이어서 채워 넣을 수 있게
    했습니다. 지금 실제로 기능이 들어있는 건 '일정' 탭뿐이고, 나머지 탭은 자리만
    잡아둔 빈 페이지입니다.
    이 파일 자체가 만드는 건 딱 두 가지뿐입니다:
      1) GitHub 토큰으로 calendar.json 불러오기/저장하기
      2) 일정 추가/수정/삭제 폼 + 각 일정 카드에 [수정]/[삭제] 버튼 끼워넣기
       (calendar.js의 calRenderTodaySchedules/calRenderSelectedDateSchedules가
        각 카드를 만들 때 window.calCardExtra가 있으면 그 결과를 카드 안에
        추가로 넣어주도록 훅이 나 있어서, calendar.js 자체는 손대지 않고
        이 파일에서만 편집 버튼을 끼워넣습니다.)
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- html2canvas: 저장 시 "오늘의 일정"+"이달의 일정" 캡처용 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    /* 어드민 전용 요소(토큰 바 / 추가·수정 폼 / 좌우 레이아웃)만 여기서 스타일링.
       캘린더 자체 스타일(요일/날짜칸/카드 등)은 전부 style.css 걸 그대로 씁니다. */
    body { margin: 0; }
    .admin-layout { display: flex; gap: 24px; align-items: flex-start; width: 100%; min-width: 0; }
    .admin-main { flex: 1 1 0%; min-width: 0; width: 100%; }
    .admin-main .cal-main-layout { width: 100%; min-width: 0; }
    .admin-main .cal-calendar-area { min-width: 0; }
    .admin-side { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }
    @media (max-width: 991px) {
        .admin-layout { flex-direction: column; }
        .admin-side { width: 100%; }
    }

    .admin-token-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .admin-token-bar input { flex: 1 1 160px; min-width: 0; }
    /* 큰 타이틀(h1) 오른쪽에 저장 버튼을 나란히 두는 헤더 줄 - 일정/도구 탭에서 공용으로 씀 */
    .admin-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .admin-header-row .page-header-title { margin-bottom: 0; }
    .admin-token-bar input {
        flex: 1; height: 40px; padding: 0 12px; border: 1px solid var(--color-border);
        border-radius: 8px; font-size: var(--fs-body); font-family: inherit;
    }
    .admin-token-bar input:focus { outline: none; border-color: var(--color-primary); }
    .btn-solid { height: 40px; padding: 0 16px; border: none; border-radius: 8px; font-size: var(--fs-body); font-weight: 700; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
    .btn-solid:hover { opacity: 0.85; }
    .btn-solid:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-solid-dark { background: var(--color-text-main); color: #fff; }
    .btn-solid-primary { background: var(--color-primary); color: #fff; }

    .admin-form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .admin-form-row input, .admin-form-row select, .admin-form-row textarea {
        width: 100%; padding: 0 12px; height: 42px; border: 1px solid var(--color-border);
        border-radius: 8px; font-size: var(--fs-body); font-family: inherit; box-sizing: border-box;
        background: #fff; color: var(--color-text-main);
    }
    .admin-form-row select { flex: 1 1 50%; width: auto; }
    .admin-form-row textarea { flex: 1 1 50%; padding: 10px 12px; resize: none; overflow: hidden; line-height: 1.2; height: 42px; }
    .admin-form-row input#inputLongTermDesc { flex: 1 1 50%; width: auto; }
    .admin-form-row input:focus, .admin-form-row textarea:focus, .admin-form-row select:focus {
        outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-tint);
    }
    .admin-submit-btn {
        width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--color-primary);
        color: #fff; font-weight: 700; font-size: var(--fs-body); cursor: pointer; margin-top: 4px; transition: background 0.15s;
    }
    .admin-submit-btn:hover { background: #1c63e0; }
    .admin-form-title { font-size: var(--fs-subheading); font-weight: 800; color: #222; margin-bottom: 10px; }

    /* calendar.js가 만드는 카드 안에 끼워넣는 [수정]/[삭제] 버튼 (calCardExtra 훅으로 삽입) */
    .cal-card-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .cal-card-actions button { background: none; border: none; font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 4px; }
    .cal-card-actions .edit-btn { color: var(--color-primary); }
    .cal-card-actions .edit-btn:hover { text-decoration: underline; }
    .cal-card-actions .delete-btn { color: var(--color-lose); }
    .cal-card-actions .delete-btn:hover { text-decoration: underline; }

    /* 일정 추가 폼의 "하루/기간" 토글 버튼 */
    .admin-mode-btn { flex: 1; height: 36px; border: 1px solid var(--color-border); border-radius: 8px; background: #fff; color: var(--color-text-sub); font-size: var(--fs-body); font-weight: 700; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
    .admin-mode-btn.active { border-color: var(--color-primary); background: var(--color-primary-tint); color: var(--color-primary); }

    .admin-tool-row .edit-btn { background: none; border: none; font-size: 11px; font-weight: 700; color: var(--color-primary); cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
    .admin-tool-row .edit-btn:hover { text-decoration: underline; }

    /* 도구 관리 탭 / 장기 일정 목록: 항목을 행으로 나열 + 오른쪽에 수정/삭제 버튼 */
    .admin-tool-list { display: flex; flex-direction: column; gap: 8px; }
    .admin-tool-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 8px; }
    .admin-tool-row img { width: 24px; height: 24px; border-radius: 4px; object-fit: contain; flex-shrink: 0; }
    .admin-tool-info { min-width: 0; flex: 1; }
    .admin-tool-name { font-weight: 800; font-size: var(--fs-body); color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-tool-url { font-size: 11px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-tool-detail { font-size: 12px; font-weight: 500; color: var(--color-text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .admin-tool-row .delete-btn { background: none; border: none; font-size: 11px; font-weight: 700; color: var(--color-lose); cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
    .admin-tool-row .delete-btn:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- GNB - 사이트 본편(index.html)과 완전히 동일한 상단바 마크업/클래스 -->
<div class="top-navbar">
    <div class="navbar-inner container">
        <div class="logo"><span class="logo-black">스타</span><span class="logo-accent">대학</span><span class="tag-badge tier-badge" style="margin-left:8px;">어드민</span></div>
        <div class="nav-menu" id="mainMenu">
            <a class="nav-item active" data-page="home" onclick="switchPage('home')">홈</a>

    </div>

    <div class="admin-layout">

        <div class="admin-main">

                                <div id="monthTitle" class="cal-nav-badge"></div>
                                <button class="cal-nav-btn" onclick="changeMonth(1)"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>

                        <div class="clean-card p-3">

        <!-- 오른쪽: 오늘의 일정 / 선택한 날짜 + 일정 편집 폼 (전부 어드민 전용) -->
        <aside class="admin-side">

            </div>

                <div class="clean-card p-4">
                    <div class="cal-selected-list" id="selectedDateList"></div>
                </div>
            </div>

                <div class="section-title">등록된 장기 일정</div>

                            <option value="#dbeafe">🔵 파랑</option>
                            <option value="#e0e7ff">🟤 남색</option>

<!-- 사이트가 실제로 쓰는 캘린더 렌더링 로직을 그대로 가져다 쓴다 (복사본 아님) -->
<script src="calendar.js"></script>

<script>
    // ===== 상단바 페이지 전환 (사이트 본편 app.js의 switchPage를 어드민에 맞게 단순화) =====
    // 지금은 '일정' 탭에만 실제 기능이 있고, 나머지는 자리만 잡아둔 빈 페이지.
    const VALID_PAGE_IDS = ['home', 'schedule', 'members', 'records', 'stats', 'tools'];
    function switchPage(pageId) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('#mainMenu .nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
        const targetNav = document.querySelector(`#mainMenu .nav-item[data-page="${pageId}"]`);
        if (targetNav) targetNav.classList.add('active');
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    }

    // ===== 여기서부터는 어드민 전용: GitHub 로드/저장 + 일정 추가/수정/삭제 =====
    const REPO_OWNER = 'ststats';
    const REPO_NAME = 'staruniv';
    const DATA_FILE_PATH = 'docs/data/calendar.json';

    const escapeHTML = calEscapeHTML; // calendar.js가 이미 이스케이프 함수를 갖고 있어 그대로 재사용

    const saveTokenLocally = () => {
        const token = document.getElementById('githubToken').value.trim();
        if (!token) return alert('토큰을 입력해주세요.');
        localStorage.setItem('gh_token', token);
        alert('토큰이 임시 저장되었습니다.');
        loadDataFromGithub();
        loadToolsFromGithub();
    };

    const loadDataFromGithub = async () => {
        const token = document.getElementById('githubToken').value;
        if (!token) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                const decoded = decodeURIComponent(escape(atob(data.content)));
                const parsed = JSON.parse(decoded);
                calSchedules = parsed.schedules || parsed;
                calLongTerm = parsed.longTerm || [];
                calRenderCalendar();
            } else if (res.status === 404) {
                calRenderCalendar();
            }
        } catch (e) {
            console.error(e);
        }
        renderLongTermList();
    };

    const IMG_FILE_PATH = 'docs/data/calendar.png';

    const saveAllToGithub = async () => {
        const token = document.getElementById('githubToken').value;
        if (!token) return alert('GitHub 토큰을 먼저 입력하고 연동해주세요!');

        const saveBtn = document.getElementById('saveAllBtn');
        saveBtn.innerText = '저장중...';
        saveBtn.disabled = true;

        try {
            const jsonContent = JSON.stringify({ schedules: calSchedules, longTerm: calLongTerm }, null, 2);

            // 캘린더 그리드("이달의 일정")를 캡처해서 JSON이랑 같은 커밋에 같이 넣는다.
            // (따로 커밋하면 Vercel 배포가 두 번 트리거되니, 한 커밋에 묶어서 배포는 한 번만.)
            // windowWidth(가상 클론)만으로는 html2canvas가 캔버스 크기 자체를 원래(좁은)
            // 페이지에서 측정한 요소 크기로 잡아버려서 잘려 나온다. 대신 캡처 대상 요소
            // 자체의 width를 캡처 직전에 실제로(진짜 DOM에) 넓게 강제로 바꿔서, 안의
            // 그리드가 실제로 넓게 다시 배치된 상태를 그대로 캡처하고, 끝나면 원래대로
            // 되돌린다. 스크롤 영역(.cal-calendar-inner)도 같이 리셋해서 잘림을 막는다.
            const captureEl = document.getElementById('captureMonth');
            const CAPTURE_WIDTH = 936; // 실제 공개 사이트(일정 페이지)에서 캘린더가 렌더링되는 실측 폭과 동일하게 맞춤

            // 캡처 대상을 강제로 넓히면 옆의 .admin-side(오늘의 일정 카드)와 겹쳐서
            // 캘린더 오른쪽 요일들이 가려지는 게 실제 원인이었다 - 캡처하는 순간만
            // 사이드바를 잠깐 숨겨서 겹침 자체를 없앤다.
            const sideEl = document.querySelector('.admin-side');
            const prevSideDisplay = sideEl ? sideEl.style.display : null;
            if (sideEl) sideEl.style.display = 'none';

            const prevElWidth = captureEl.style.width;
            const prevElMaxWidth = captureEl.style.maxWidth;
            const prevElPadding = captureEl.style.padding;
            const prevElBoxSizing = captureEl.style.boxSizing;
            const prevElBackground = captureEl.style.background;
            captureEl.style.width = CAPTURE_WIDTH + 'px';
            captureEl.style.maxWidth = 'none';
            // 캡처 이미지 테두리에 살짝 여백을 주기 위한 padding (capture.js 자동
            // 캡처본과 동일한 여백이 나오도록 값을 맞춰둠).
            captureEl.style.padding = '16px';
            captureEl.style.boxSizing = 'content-box';
            captureEl.style.background = '#f4f7fc';

            const scrollTargets = captureEl.querySelectorAll('.cal-calendar-inner');
            const restoreFns = [];
            scrollTargets.forEach(el => {
                const prevOverflow = el.style.overflowX;
                const prevScrollLeft = el.scrollLeft;
                el.scrollLeft = 0;
                el.style.overflowX = 'visible';
                restoreFns.push(() => { el.style.overflowX = prevOverflow; el.scrollLeft = prevScrollLeft; });
            });

            // 스타일 변경이 실제로 레이아웃에 반영될 시간을 한 프레임 준다.
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

            let canvas;
            try {
                canvas = await html2canvas(captureEl, {
                    scale: 2, useCORS: true, backgroundColor: '#f4f7fc',
                    width: captureEl.scrollWidth, windowWidth: Math.max(CAPTURE_WIDTH + 200, 1200)
                });
            } finally {
                restoreFns.forEach(fn => fn());
                captureEl.style.width = prevElWidth;
                captureEl.style.maxWidth = prevElMaxWidth;
                captureEl.style.padding = prevElPadding;
                captureEl.style.boxSizing = prevElBoxSizing;
                captureEl.style.background = prevElBackground;
                if (sideEl) sideEl.style.display = prevSideDisplay;
            }
            const base64Image = canvas.toDataURL('image/png').split(',')[1];

            const headers = { Authorization: `token ${token}`, 'Content-Type': 'application/json' };
            const repoUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

            const repoRes = await fetch(repoUrl, { headers });
            if (!repoRes.ok) throw new Error('저장소 정보를 불러올 수 없습니다.');
            const defaultBranch = (await repoRes.json()).default_branch || 'main';

            const refRes = await fetch(`${repoUrl}/git/refs/heads/${defaultBranch}`, { headers });
            const latestCommitSha = (await refRes.json()).object.sha;

            const jsonBlobRes = await fetch(`${repoUrl}/git/blobs`, {
                method: 'POST', headers,
                body: JSON.stringify({ content: jsonContent, encoding: 'utf-8' })
            });
            const jsonBlobSha = (await jsonBlobRes.json()).sha;

            const imgBlobRes = await fetch(`${repoUrl}/git/blobs`, {
                method: 'POST', headers,
                body: JSON.stringify({ content: base64Image, encoding: 'base64' })
            });
            const imgBlobSha = (await imgBlobRes.json()).sha;

            const commitRes = await fetch(`${repoUrl}/git/commits/${latestCommitSha}`, { headers });
            const baseTreeSha = (await commitRes.json()).tree.sha;

            const treeRes = await fetch(`${repoUrl}/git/trees`, {
                method: 'POST', headers,
                body: JSON.stringify({
                    base_tree: baseTreeSha,
                    tree: [
                        { path: DATA_FILE_PATH, mode: '100644', type: 'blob', sha: jsonBlobSha },
                        { path: IMG_FILE_PATH, mode: '100644', type: 'blob', sha: imgBlobSha }
                    ]
                })
            });
            const newTreeSha = (await treeRes.json()).sha;

            const newCommitRes = await fetch(`${repoUrl}/git/commits`, {
                method: 'POST', headers,
                body: JSON.stringify({ message: '✅ 캘린더 데이터 + 이미지 업데이트', tree: newTreeSha, parents: [latestCommitSha] })
            });
            const newCommitSha = (await newCommitRes.json()).sha;

            const updateRefRes = await fetch(`${repoUrl}/git/refs/heads/${defaultBranch}`, {
                method: 'PATCH', headers,
                body: JSON.stringify({ sha: newCommitSha })
            });
            if (!updateRefRes.ok) throw new Error('브랜치 업데이트 실패');

            alert('✅ 데이터와 이미지가 성공적으로 저장되었습니다!');
        } catch (error) {
            console.error(error);
            alert('저장 중 오류가 발생했습니다: ' + error.message);
        } finally {
            saveBtn.innerText = '저장';
            saveBtn.disabled = false;
        }
    };

    // ----- 일정 추가/수정/삭제 -----
    // 'day'(하루짜리, calSchedules) / 'range'(장기, calLongTerm) 두 모드를 토글로 전환한다.
    let scheduleMode = 'day';

    // 모드에 따라 폼 UI만 바꾼다(값 초기화는 안 함) - enterEditLongTerm처럼 값을 채우기
    // 직전에도 이 함수만 불러서 모드를 맞출 수 있게 분리해뒀다.
    const applyScheduleModeUI = (mode) => {
        scheduleMode = mode;
        document.getElementById('modeBtnDay').classList.toggle('active', mode === 'day');
        document.getElementById('modeBtnRange').classList.toggle('active', mode === 'range');
        document.getElementById('rangeDatesRow').style.display = mode === 'range' ? 'flex' : 'none';
        document.getElementById('inputDesc').style.display = mode === 'range' ? 'none' : 'block';
        document.getElementById('inputLongTermDesc').style.display = mode === 'range' ? 'block' : 'none';
    };

    // 토글 버튼을 직접 눌렀을 때만 호출 - 모드를 바꾸면서 편집 중이던 내용은 초기화한다.
    const setScheduleMode = (mode) => {
        applyScheduleModeUI(mode);
        cancelEdit();
        if (mode === 'range' && calSelectedDateStr) {
            document.getElementById('inputStartDate').value = calSelectedDateStr;
        }
    };

    const clearForm = () => {
        document.getElementById('editScheduleId').value = '';
        document.getElementById('editLongTermId').value = '';
        document.getElementById('inputTime').value = '';
        document.getElementById('inputPerson').value = '';
        document.getElementById('inputDesc').value = '';
        document.getElementById('inputDesc').style.height = '42px';
        document.getElementById('inputDetail').value = '';
        document.getElementById('inputLongTermDesc').value = '';
        document.getElementById('inputColor').value = '#d1fae5';
        document.getElementById('inputStartDate').value = '';
        document.getElementById('inputEndDate').value = '';
    };

    const cancelEdit = () => {
        clearForm();
        document.getElementById('formTitle').innerText = scheduleMode === 'range'
            ? '장기 일정 추가'
            : `[${calSelectedDateStr || '날짜선택'}] 일정 추가`;
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = '일정 반영하기';
        submitBtn.style.background = '';
    };

    const addOrUpdateSchedule = () => {
        if (scheduleMode === 'range') { addOrUpdateLongTerm(); return; }
        if (!calSelectedDateStr) return alert('날짜를 먼저 클릭해주세요!');

        const time = document.getElementById('inputTime').value.trim();
        const person = document.getElementById('inputPerson').value.trim();
        const desc = document.getElementById('inputDesc').value.trim();
        const detail = document.getElementById('inputDetail').value.trim();
        const color = document.getElementById('inputColor').value;
        const editId = document.getElementById('editScheduleId').value;

        if (!desc && !time && !person) return alert('입력된 내용이 없습니다.');

        if (!calSchedules[calSelectedDateStr]) calSchedules[calSelectedDateStr] = [];

        if (editId) {
            const item = calSchedules[calSelectedDateStr].find(i => i.id == editId);
            if (item) Object.assign(item, { time, person, desc, detail, color });
        } else {
            calSchedules[calSelectedDateStr].push({ id: Date.now(), time, person, desc, detail, color });
        }

        calRenderCalendar();
        cancelEdit();
    };

    const enterEditMode = (dateStr, id) => {
        const item = calSchedules[dateStr]?.find(i => i.id === id);
        if (!item) return;

        applyScheduleModeUI('day');
        calSelectedDateStr = dateStr;
        document.getElementById('editScheduleId').value = item.id;
        document.getElementById('editLongTermId').value = '';
        document.getElementById('inputTime').value = item.time || '';
        document.getElementById('inputPerson').value = item.person || '';

        const inputDesc = document.getElementById('inputDesc');
        inputDesc.value = item.desc || '';
        inputDesc.style.height = '42px';
        inputDesc.style.height = inputDesc.scrollHeight + 'px';

        document.getElementById('inputDetail').value = item.detail || '';
        document.getElementById('inputColor').value = item.color || '#d1fae5';

        document.getElementById('formTitle').innerText = `✏️ [${dateStr}] 일정 수정`;
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = '수정 완료하기';
        submitBtn.style.background = 'var(--color-lose)';
    };

    const deleteSchedule = (dateStr, id) => {
        if (!confirm('일정을 삭제하시겠습니까?')) return;
        if (document.getElementById('editScheduleId').value == id) cancelEdit();

        calSchedules[dateStr] = calSchedules[dateStr].filter(item => item.id !== id);
        if (calSchedules[dateStr].length === 0) delete calSchedules[dateStr];

        calRenderCalendar();
    };

    // ----- 장기 일정(예: 장기휴방) 추가/수정/삭제 - calSchedules와 완전히 별도인 calLongTerm 배열 -----
    const renderLongTermList = () => {
        const container = document.getElementById('longTermList');
        if (!calLongTerm.length) {
            container.innerHTML = `<div class="text-center text-muted py-3" style="font-size:var(--fs-body);">등록된 장기 일정이 없습니다.</div>`;
            return;
        }
        container.innerHTML = calLongTerm.map(lt => `
            <div class="admin-tool-row">
                <span style="width:10px; height:10px; border-radius:50%; background:${lt.color || '#ffedd5'}; flex-shrink:0;"></span>
                <div class="admin-tool-info">
                    <div class="admin-tool-name">${escapeHTML(lt.title)}</div>
                    <div class="admin-tool-url">${escapeHTML(lt.startDate)} ~ ${escapeHTML(lt.endDate)}</div>
                    ${lt.desc ? `<div class="admin-tool-detail">${escapeHTML(lt.desc)}</div>` : ''}
                </div>
                <button class="edit-btn" onclick="enterEditLongTerm(${lt.id})">수정</button>
                <button class="delete-btn" onclick="deleteLongTerm(${lt.id})">삭제</button>
            </div>
        `).join('');
    };

    const addOrUpdateLongTerm = () => {
        const startDate = document.getElementById('inputStartDate').value;
        const endDate = document.getElementById('inputEndDate').value;
        const time = document.getElementById('inputTime').value.trim();
        const title = document.getElementById('inputPerson').value.trim();
        const color = document.getElementById('inputColor').value;
        const detail = document.getElementById('inputDetail').value.trim();
        const desc = document.getElementById('inputLongTermDesc').value.trim();
        const editId = document.getElementById('editLongTermId').value;

        if (!startDate || !endDate) return alert('시작일과 종료일을 모두 선택해주세요.');
        if (endDate < startDate) return alert('종료일은 시작일보다 빠를 수 없습니다.');
        if (!title) return alert('타이틀을 입력해주세요.');

        if (editId) {
            const item = calLongTerm.find(x => String(x.id) === String(editId));
            if (item) Object.assign(item, { title, startDate, endDate, time, color, detail, desc });
        } else {
            calLongTerm.push({ id: Date.now(), title, startDate, endDate, time, color, detail, desc });
        }

        calRenderCalendar();
        renderLongTermList();
        cancelEdit();
    };

    const enterEditLongTerm = (id) => {
        const lt = calLongTerm.find(x => x.id === id);
        if (!lt) return;

        applyScheduleModeUI('range');
        document.getElementById('editScheduleId').value = '';
        document.getElementById('editLongTermId').value = lt.id;
        document.getElementById('inputStartDate').value = lt.startDate;
        document.getElementById('inputEndDate').value = lt.endDate;
        document.getElementById('inputTime').value = lt.time || '';
        document.getElementById('inputPerson').value = lt.title;
        document.getElementById('inputColor').value = lt.color || '#ffedd5';
        document.getElementById('inputDetail').value = lt.detail || '';
        document.getElementById('inputLongTermDesc').value = lt.desc || '';

        document.getElementById('formTitle').innerText = '✏️ 장기 일정 수정';
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = '수정 완료하기';
        submitBtn.style.background = 'var(--color-lose)';
    };

    const deleteLongTerm = (id) => {
        if (!confirm('이 장기 일정을 삭제하시겠습니까?')) return;
        if (document.getElementById('editLongTermId').value == id) cancelEdit();

        calLongTerm = calLongTerm.filter(x => x.id !== id);
        calRenderCalendar();
        renderLongTermList();
    };

    // calendar.js의 오늘의 일정/선택한 날짜 카드 렌더링에 [수정]/[삭제] 버튼을 끼워넣는 훅.
    // "오늘의 일정" 카드는 사이트처럼 읽기 전용으로 두고, "선택한 날짜" 카드에만 버튼을 붙인다.
    // item._longTerm이면 장기 일정용 수정/삭제 함수로 분기한다.
    window.calCardExtra = (item, dateStr, type) => {
        if (type !== 'selected') return '';
        if (item._longTerm) {
            return `<div class="cal-card-actions">
                <button class="edit-btn" onclick="enterEditLongTerm(${item.id})">수정</button>
                <button class="delete-btn" onclick="deleteLongTerm(${item.id})">삭제</button>
            </div>`;
        }
        return `<div class="cal-card-actions">
            <button class="edit-btn" onclick="enterEditMode('${dateStr}', ${item.id})">수정</button>
            <button class="delete-btn" onclick="deleteSchedule('${dateStr}', ${item.id})">삭제</button>
        </div>`;
    };

    // 날짜를 새로 클릭하면(다른 날짜로 이동) 편집 중이던 폼은 초기화한다.
    // 기간 모드에서는 클릭한 날짜를 시작일로 편하게 채워준다.
    window.calOnDateSelect = (dateStr) => {
        cancelEdit();
        if (scheduleMode === 'range') {
            document.getElementById('inputStartDate').value = dateStr;
        }
    };

    const inputDescEl = document.getElementById('inputDesc');
    inputDescEl.addEventListener('input', function() {
        this.style.height = '42px';
        this.style.height = this.scrollHeight + 'px';
    });

    // ----- 도구 관리 (docs/data/tools.json) -----
    // 캘린더와 달리 이미지 캡처가 없어서 GitHub Contents API의 단순 PUT(생성/수정 겸용)만
    // 쓰면 충분하다. 토큰은 캘린더 탭에서 이미 연동한 걸(localStorage 'gh_token') 그대로 쓴다.
    const TOOLS_FILE_PATH = 'docs/data/tools.json';
    const TOOL_SECTION_KEYS = ['extTools', 'extSites'];
    let toolsData = {
        extTools: { title: '외부 도구', items: [] },
        extSites: { title: '외부 사이트', items: [] },
    };

    function renderToolsAdmin() {
        TOOL_SECTION_KEYS.forEach(key => {
            const list = document.getElementById('tools-list-' + key);
            if (!list) return;
            const items = (toolsData[key] && toolsData[key].items) || [];
            list.innerHTML = items.length ? items.map((t, i) => `
                <div class="admin-tool-row">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(t.url)}" alt="" onerror="this.style.display='none';">
                    <div class="admin-tool-info">
                        <div class="admin-tool-name">${escapeHTML(t.name)}</div>
                        <div class="admin-tool-url">${escapeHTML(t.url)}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTool('${key}', ${i})">삭제</button>
                </div>
            `).join('') : `<div class="text-center text-muted py-3" style="font-size:var(--fs-body);">등록된 도구가 없습니다.</div>`;
        });
    }

    const addTool = (key) => {
        const nameInput = document.getElementById('toolNameInput-' + key);
        const urlInput = document.getElementById('toolUrlInput-' + key);
        const name = nameInput.value.trim();
        let url = urlInput.value.trim();
        if (!name || !url) return alert('이름과 URL을 모두 입력해주세요.');
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        if (!toolsData[key]) toolsData[key] = { title: key, items: [] };
        toolsData[key].items.push({ name, url });
        nameInput.value = '';
        urlInput.value = '';
        renderToolsAdmin();
    };

    const deleteTool = (key, idx) => {
        if (!confirm('이 도구를 삭제하시겠습니까?')) return;
        toolsData[key].items.splice(idx, 1);
        renderToolsAdmin();
    };

    const loadToolsFromGithub = async () => {
        const token = localStorage.getItem('gh_token');
        if (!token) { renderToolsAdmin(); return; }
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TOOLS_FILE_PATH}`, {
                headers: { Authorization: `token ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                const decoded = decodeURIComponent(escape(atob(data.content)));
                toolsData = JSON.parse(decoded);
            }
            // 404면 파일이 아직 없는 것 - 기본 빈 구조를 그대로 쓴다.
        } catch (e) {
            console.error(e);
        }
        renderToolsAdmin();
    };

    const saveToolsToGithub = async () => {
        const token = localStorage.getItem('gh_token');
        if (!token) return alert('GitHub 토큰을 먼저 연동해주세요! (일정 탭에서 연동할 수 있습니다)');

        const btn = document.getElementById('saveToolsBtn');
        btn.innerText = '저장중...';
        btn.disabled = true;
        try {
            const headers = { Authorization: `token ${token}`, 'Content-Type': 'application/json' };
            const repoUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

            // 이미 파일이 있으면 sha가 있어야 덮어쓰기가 되고, 처음 저장하는 거면 sha 없이 새로 만든다.
            let sha;
            const existing = await fetch(`${repoUrl}/contents/${TOOLS_FILE_PATH}`, { headers });
            if (existing.ok) sha = (await existing.json()).sha;

            const content = btoa(unescape(encodeURIComponent(JSON.stringify(toolsData, null, 2))));
            const body = { message: '🔧 도구 목록 업데이트', content, ...(sha ? { sha } : {}) };
            const putRes = await fetch(`${repoUrl}/contents/${TOOLS_FILE_PATH}`, {
                method: 'PUT', headers, body: JSON.stringify(body)
            });
            if (!putRes.ok) throw new Error('저장 실패');

            alert('✅ 도구 목록이 저장되었습니다!');
        } catch (error) {
            console.error(error);
            alert('저장 중 오류가 발생했습니다: ' + error.message);
        } finally {
            btn.innerText = '저장';
            btn.disabled = false;
        }
    };

    const init = async () => {
        await loadPublicHolidays();

        const today = new Date();
        calSelectedDateStr = calGetFormatDate(today.getFullYear(), today.getMonth() + 1, today.getDate());

        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
            await loadDataFromGithub();
        } else {
            calRenderCalendar();
            renderLongTermList();
        }
        await loadToolsFromGithub();
    };

    init();
</script>
</body>
</html>
