<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티뷰어 - 캄몬스타즈</title>
<link rel="stylesheet" href="style.css">
<style>
    /* ===== 다크모드: 사이트 CSS 변수를 이 페이지 안에서만 덮어쓴다 ===== */
    html[data-theme="dark"] {
        --color-bg: #14161b;
        --color-card: #1d2027;
        --color-border: #2b2f38;
        --color-border-strong: #3a3f4a;
        --color-text-main: #e7e9ec;
        --color-text-sub: #9aa1ac;
        --color-primary: #5b93ff;
        --color-primary-tint: #1c2740;
        --color-bg-subtle: #22262e;
    }
    html[data-theme="dark"] body { background: var(--color-bg); color: var(--color-text-main); }

    /* 기본 화면은 그리드만 꽉 차게 보이는 게 목적이라, 여백/타이틀 같은 크롬은
       전부 없애고 오른쪽 위 ⚙️ 버튼 하나만 항상 떠 있게 한다. 설정은 그 버튼을
       눌렀을 때만 위에서 내려오는 패널로 보여준다. */
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Pretendard', sans-serif; background: var(--color-bg, #f4f7fc); color: var(--color-text-main, #222); }

    /* ===== 설정 열기 버튼 (항상 떠 있음) ===== */
    .mv-fab { position: fixed; top: 12px; right: 12px; z-index: 100; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--color-border-strong); background: var(--color-card, #fff); opacity: 0.85; color: var(--color-text-main); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .mv-fab:hover { opacity: 1; border-color: var(--color-primary); }
    .mv-fab.on { border-color: var(--color-primary); color: var(--color-primary); }

    /* ===== 설정 패널 (기본 숨김, ⚙️ 누르면 위에서 펼쳐짐) ===== */
    .mv-settings-panel { position: fixed; top: 0; left: 0; right: 0; z-index: 90; background: var(--color-card, #fff); border-bottom: 1px solid var(--color-border); box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-height: 80vh; overflow-y: auto; display: none; }
    .mv-settings-panel.open { display: block; }
    .mv-settings-inner { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
    .mv-settings-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .mv-title { font-size: 16px; font-weight: 800; }
    .mv-icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--color-border-strong); background: var(--color-bg, #fff); color: var(--color-text-main); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .mv-icon-btn:hover { border-color: var(--color-primary); }
    .mv-icon-btn.on { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-tint); }

    .mv-settings-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 16px; background: var(--color-bg-subtle, #f4f7fc); border: 1px solid var(--color-border); border-radius: 10px; margin-bottom: 12px; }
    .mv-settings-group { display: flex; align-items: center; gap: 8px; }
    .mv-settings-label { font-size: 12px; font-weight: 700; color: var(--color-text-sub); }
    .mv-stepper { display: flex; align-items: center; border: 1px solid var(--color-border-strong); border-radius: 8px; overflow: hidden; }
    .mv-stepper button { width: 26px; height: 26px; border: none; background: var(--color-card, #fff); color: var(--color-primary); font-weight: 800; font-size: 14px; cursor: pointer; }
    .mv-stepper button:hover { background: var(--color-primary-tint); }
    .mv-stepper button:disabled { color: #888; cursor: not-allowed; }
    .mv-stepper-value { width: 26px; text-align: center; font-weight: 800; font-size: 13px; border-left: 1px solid var(--color-border-strong); border-right: 1px solid var(--color-border-strong); line-height: 26px; }
    .mv-checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--color-text-sub); cursor: pointer; }
    .mv-checkbox-label input { width: 14px; height: 14px; accent-color: var(--color-primary); cursor: pointer; }
    .mv-add-form { display: flex; gap: 6px; align-items: center; margin-left: auto; }
    .mv-add-form input { padding: 6px 10px; border: 1px solid var(--color-border-strong); border-radius: 6px; font-size: 12px; background: var(--color-bg, #fff); color: var(--color-text-main); width: 190px; }
    .mv-add-form input:focus { outline: none; border-color: var(--color-primary); }
    .mv-add-form button { border: 1px solid var(--color-border-strong); background: var(--color-card, #fff); color: var(--color-text-main); border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .mv-add-form button:hover { border-color: var(--color-primary); color: var(--color-primary); }

    .mv-order-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .mv-order-item { display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 10px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-card, #fff); font-size: 12px; }
    .mv-order-item.custom { border-style: dashed; }
    .mv-order-name { font-weight: 700; margin-right: 2px; }
    .mv-order-item button { width: 20px; height: 20px; border: none; background: transparent; color: var(--color-text-sub); cursor: pointer; border-radius: 4px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .mv-order-item button:hover:not(:disabled) { background: var(--color-bg-subtle); color: var(--color-text-main); }
    .mv-order-item button:disabled { opacity: 0.3; cursor: not-allowed; }
    .mv-order-item .mv-order-remove:hover:not(:disabled) { color: #f03e3e; }

    /* ===== 그리드: 스크롤 없이 화면(뷰포트) 안에 정확히 맞춘다. MultiTwitch 등
       다른 멀티뷰어들도 칸 크기를 직접 16:9로 계산하지 않고 그냥 칸을 꽉
       채운 뒤 비율 처리는 임베드 플레이어 자체에 맡긴다 - SOOP 플레이어도
       마찬가지로 자기가 받은 박스 안에서 알아서 레터박스 처리를 해줄 걸로
       보고, 우리는 칸을 꽉 채우는 단순한 방식으로 돌아간다. */
    html, body { overflow: hidden; }
    #mv-grid-area { height: 100vh; padding: 10px; box-sizing: border-box; }
    .mv-grid { display: grid; gap: 10px; height: 100%; }
    .mv-cell { background: var(--color-card, #fff); border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .mv-cell-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--color-border); font-size: 12px; font-weight: 800; }
    .mv-cell-header a { color: var(--color-text-sub); font-size: 11px; font-weight: 700; text-decoration: none; }
    .mv-cell-header a:hover { color: var(--color-primary); }
    .mv-cell-body { flex: 1; min-height: 0; background: #0b0c10; }
    .mv-cell-video-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .mv-cell-video-wrap iframe { position: absolute; border: 0; display: block; }

    /* 포커스 모드: 스크린샷처럼 균일한 그리드 안에서 메인 하나만 2×2칸을
       차지(grid-column/row span)하고, 나머지는 CSS Grid의 기본 자동배치가
       비어있는 칸에 알아서 순서대로 채워준다 - 남는 칸 좌표를 직접 계산할
       필요가 없다. */
    .mv-cell-main { grid-column: span 2; grid-row: span 2; }

    .mv-empty { text-align: center; color: var(--color-text-sub); font-size: 13px; padding: 30vh 0; }
</style>
</head>
<body>

<button type="button" class="mv-fab" id="mv-fab" onclick="mvToggleSettingsPanel()" title="설정 열기/닫기">⚙️</button>

<div class="mv-settings-panel" id="mv-settings-panel">
    <div class="mv-settings-inner">
        <div class="mv-settings-top">
            <div class="mv-title">🎬 멀티뷰어</div>
            <button type="button" class="mv-icon-btn" id="mv-theme-btn" onclick="mvToggleTheme()" title="다크모드">🌙</button>
        </div>
        <div class="mv-settings-bar">
            <div class="mv-settings-group" id="mv-cols-group">
                <span class="mv-settings-label">열 개수</span>
                <div class="mv-stepper">
                    <button type="button" onclick="mvChangeCols(-1)">−</button>
                    <span class="mv-stepper-value" id="mv-cols-value">2</span>
                    <button type="button" onclick="mvChangeCols(1)">+</button>
                </div>
            </div>
            <label class="mv-checkbox-label">
                <input type="checkbox" id="mv-focus-checkbox" onchange="mvToggleFocus()">
                포커스 모드 (1번을 크게)
            </label>
            <form class="mv-add-form" onsubmit="event.preventDefault(); mvAddCustom();">
                <input type="text" id="mv-add-input" placeholder="숲 아이디 직접 입력">
                <button type="submit">추가</button>
            </form>
        </div>
        <div class="mv-order-row" id="mv-order-row"></div>
    </div>
</div>

<div id="mv-grid-area"></div>

<script>
    function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag]));
    }

    // ===== 상태 =====
    // order: [{ soopId, name, isMember }] - 화면에 그려지는 순서 그대로
    let mvOrder = [];
    let mvCols = 2;
    let mvFocus = false;

    function mvSaveState() {
        try {
            localStorage.setItem('mv-order', JSON.stringify(mvOrder));
            localStorage.setItem('mv-cols', String(mvCols));
            localStorage.setItem('mv-focus', mvFocus ? '1' : '0');
        } catch (e) { /* localStorage 접근 불가한 환경이면 그냥 무시 */ }
    }

    function mvInit() {
        const params = new URLSearchParams(location.search);
        let list = null;
        if (params.has('list')) {
            try { list = JSON.parse(params.get('list')); } catch (e) { list = null; }
        }
        if (Array.isArray(list) && list.length > 0) {
            mvOrder = list
                .filter(e => e && typeof e.id === 'string' && /^[a-z0-9_-]+$/i.test(e.id))
                .map(e => ({ soopId: e.id.toLowerCase(), name: e.name || e.id, isMember: !!e.isMember }));
            mvCols = Math.min(4, Math.max(1, parseInt(params.get('cols'), 10) || 2));
            mvFocus = params.get('focus') === '1';
            // 도구 탭에서 명시적으로 넘긴 다크모드 설정이 있으면 그걸 우선한다
            // (없으면 아래에서 마지막으로 써둔 localStorage 값을 그대로 쓴다).
            if (params.get('theme') === 'dark' || params.get('theme') === 'light') {
                mvApplyTheme(params.get('theme'));
            }
        } else {
            // URL에 아무것도 없으면(직접 이 페이지를 열었거나 새로고침한 경우) 마지막으로
            // 저장해둔 상태를 이어서 보여준다.
            try {
                mvOrder = JSON.parse(localStorage.getItem('mv-order') || '[]');
                mvCols = Math.min(4, Math.max(1, parseInt(localStorage.getItem('mv-cols'), 10) || 2));
                mvFocus = localStorage.getItem('mv-focus') === '1';
            } catch (e) { mvOrder = []; mvCols = 2; mvFocus = false; }
        }
        document.getElementById('mv-focus-checkbox').checked = mvFocus;
    }

    // ===== 다크모드 =====
    function mvApplyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('mv-theme-btn').innerText = theme === 'dark' ? '☀️' : '🌙';
        document.getElementById('mv-theme-btn').classList.toggle('on', theme === 'dark');
        localStorage.setItem('mv-theme', theme);
    }
    function mvToggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        mvApplyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // ===== 설정 패널 여닫기 =====
    function mvApplySettingsPanel(open) {
        document.getElementById('mv-settings-panel').classList.toggle('open', open);
        document.getElementById('mv-fab').classList.toggle('on', open);
    }
    function mvToggleSettingsPanel() {
        const isOpen = document.getElementById('mv-settings-panel').classList.contains('open');
        mvApplySettingsPanel(!isOpen);
    }

    // ===== 열 개수 =====
    function mvChangeCols(delta) {
        mvCols = Math.min(4, Math.max(1, mvCols + delta));
        document.getElementById('mv-cols-value').innerText = mvCols;
        mvApplyGridColumns();
        mvSaveState();
    }
    function mvApplyGridColumns(explicitCols) {
        const grid = document.getElementById('mv-grid');
        if (!grid) return;
        const count = grid.children.length;
        if (count === 0) return;
        // 남은 칸이 열 개수보다 적으면 그만큼만 컬럼을 써서 빈 칸이 오른쪽에
        // 휑하게 남지 않게 한다. rows는 남은 칸 수 기준으로 계산해서
        // grid-template-rows에 못박아, 세로도 뷰포트 안에 딱 맞게 나눠진다.
        const wantCols = explicitCols || mvCols;
        const cols = Math.max(1, Math.min(wantCols, count));
        const rows = Math.max(1, Math.ceil(count / cols));
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    }

    // 포커스 모드: 메인이 2×2칸을 차지하는 균일 그리드. 컨테이너의 가로세로
    // 비율에 맞춰 칸이 너무 눌리거나 늘어나지 않게 열/행 개수를 정하고,
    // 실제 배치(빈 칸 채우기)는 CSS Grid 자동배치에 맡긴다.
    function mvComputeFocusGridDims(totalW, totalH, restCount) {
        const units = 4 + restCount; // 메인이 4칸(2x2) + 나머지는 한 칸씩
        const aspect = totalW / (totalH || 1);
        const cols = Math.max(2, Math.round(Math.sqrt(units * aspect)));
        const rows = Math.max(2, Math.ceil(units / cols));
        return { cols, rows };
    }

    function mvToggleFocus() {
        mvFocus = document.getElementById('mv-focus-checkbox').checked;
        mvApplyColsGroupVisibility();
        mvRenderGrid();
        mvSaveState();
    }
    function mvApplyColsGroupVisibility() {
        // 포커스 모드에서는 열 개수가 화면 크기·인원 수 기준 자동 계산(mvComputeFocusGridDims)으로
        // 정해지고 이 스테퍼 값은 아예 안 쓰이므로, 혼동 없게 그리드 모드일 때만
        // 보여준다.
        document.getElementById('mv-cols-group').style.display = mvFocus ? 'none' : 'flex';
    }

    // ===== 순서 목록 =====
    function mvOrderItemHtml(entry, idx) {
        return `
        <div class="mv-order-item${entry.isMember ? '' : ' custom'}">
            <button type="button" title="위로" onclick="mvMove(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button type="button" title="아래로" onclick="mvMove(${idx}, 1)" ${idx === mvOrder.length - 1 ? 'disabled' : ''}>▼</button>
            <span class="mv-order-name">${escapeHTML(entry.name)}</span>
            <button type="button" class="mv-order-remove" title="빼기" onclick="mvRemove(${idx})">✕</button>
        </div>`;
    }
    function mvRenderOrderRow() {
        const row = document.getElementById('mv-order-row');
        row.innerHTML = mvOrder.length
            ? mvOrder.map(mvOrderItemHtml).join('')
            : '<span style="font-size:12px; color:var(--color-text-sub);">추가된 방송이 없습니다. 숲 아이디를 입력해 추가해보세요.</span>';
    }
    function mvMove(idx, dir) {
        const target = idx + dir;
        if (target < 0 || target >= mvOrder.length) return;
        [mvOrder[idx], mvOrder[target]] = [mvOrder[target], mvOrder[idx]];
        mvRenderAll();
    }
    function mvRemove(idx) {
        mvOrder.splice(idx, 1);
        mvRenderAll();
    }
    function mvAddCustom() {
        const input = document.getElementById('mv-add-input');
        const id = input.value.trim().toLowerCase();
        if (!id) return;
        if (!/^[a-z0-9_-]+$/.test(id)) { alert('숲 아이디 형식이 아닙니다 (영문/숫자/-/_ 만 가능).'); return; }
        if (mvOrder.some(e => e.soopId === id)) { alert('이미 추가된 아이디입니다.'); return; }
        mvOrder.push({ soopId: id, name: id, isMember: false });
        input.value = '';
        mvRenderAll();
    }

    // ===== 그리드: 실시간 영상은 SOOP의 공식 라이브 임베드 엔드포인트
    // (play.sooplive.com/{아이디}/embed)를 iframe으로 그대로 삽입한다. 채팅은
    // 요청대로 껐고(showChat=false), 자동재생을 켜뒀다(autoPlay=true) - 브라우저의
    // 자동재생 정책상 소리가 있는 자동재생은 막힐 수 있는데, 그건 SOOP 플레이어
    // 자체가 처리하는 부분이라 우리 쪽에서 더 손볼 여지는 없다.
    function mvEmbedUrl(soopId) {
        const params = new URLSearchParams({
            quality: '1080p', resolution: '1080p', preferredQuality: '1080p',
            vq: 'hd1080', hd: '1', showChat: 'false', autoPlay: 'true',
        });
        return `https://play.sooplive.com/${encodeURIComponent(soopId)}/embed?${params.toString()}`;
    }
    function mvCellHtml(entry, isMain) {
        const channelUrl = `https://play.sooplive.co.kr/${encodeURIComponent(entry.soopId)}`;
        return `
        <div class="mv-cell${isMain ? ' mv-cell-main' : ''}">
            <div class="mv-cell-header">
                <span>${escapeHTML(entry.name)}</span>
                <a href="${channelUrl}" target="_blank" rel="noopener">새 탭↗</a>
            </div>
            <div class="mv-cell-body">
                <div class="mv-cell-video-wrap">
                    <iframe src="${mvEmbedUrl(entry.soopId)}" allowfullscreen loading="lazy" allow="autoplay; encrypted-media; fullscreen"></iframe>
                </div>
            </div>
        </div>`;
    }
    function mvRenderGrid() {
        const area = document.getElementById('mv-grid-area');
        if (mvOrder.length === 0) {
            area.innerHTML = '<div class="mv-empty">추가된 방송이 없습니다. 오른쪽 위 ⚙️를 눌러 숲 아이디를 추가해보세요.</div>';
            return;
        }
        if (mvFocus) {
            // 포커스 모드: 메인이 2×2칸을 차지하는 균일 그리드로 만들고, 나머지는
            // CSS Grid 기본 자동배치(grid-auto-flow)가 비어있는 칸에 순서대로
            // 알아서 채워준다 - 남는 칸 좌표를 직접 계산할 필요가 없다.
            const [main, ...rest] = mvOrder;
            if (rest.length === 0) {
                // 나머지가 없으면 메인 혼자 화면 전체를 그대로 쓴다(그리드 자체가 필요 없음).
                area.innerHTML = mvCellHtml(main, false);
                document.querySelector('#mv-grid-area > .mv-cell').style.height = '100%';
            } else {
                const totalW = area.clientWidth;
                const totalH = area.clientHeight;
                const { cols, rows } = mvComputeFocusGridDims(totalW, totalH, rest.length);
                const cellsHtml = mvCellHtml(main, true) + rest.map(e => mvCellHtml(e, false)).join('');
                area.innerHTML = `<div class="mv-grid" id="mv-grid" style="grid-template-columns:repeat(${cols}, 1fr); grid-template-rows:repeat(${rows}, 1fr);">${cellsHtml}</div>`;
            }
        } else {
            area.innerHTML = `<div class="mv-grid" id="mv-grid">${mvOrder.map(e => mvCellHtml(e, false)).join('')}</div>`;
            mvApplyGridColumns();
        }
        mvCoverFitAll();
    }

    function mvRenderAll() {
        mvRenderOrderRow();
        mvRenderGrid();
        mvSaveState();
    }

    // ===== 영상은 칸을 빈틈없이 꽉 채우고(레터박스/가운데 여백 없음), 비율이
    // 안 맞는 만큼만 살짝 잘라낸다(overflow:hidden으로 크롭) - 늘어나거나
    // 찌그러지지도 않고, 그렇다고 여백을 남기지도 않는 "꽉 채우기" 방식.
    // 메인/그리드 셀 구분 없이 모든 .mv-cell-video-wrap에 똑같이 적용한다.
    function mvCoverFitIframe(wrap) {
        const iframe = wrap.querySelector('iframe');
        if (!iframe) return;
        const w = wrap.clientWidth;
        const h = wrap.clientHeight;
        if (w === 0 || h === 0) return;
        let ifW = w;
        let ifH = w * 9 / 16;
        if (ifH < h) {
            // 칸이 영상보다 세로로 더 길면(=너비 기준으로는 세로가 부족하면)
            // 세로를 기준으로 다시 키워서 남는 세로가 없게 한다.
            ifH = h;
            ifW = h * 16 / 9;
        }
        ifW = Math.ceil(ifW);
        ifH = Math.ceil(ifH);
        iframe.style.width = ifW + 'px';
        iframe.style.height = ifH + 'px';
        iframe.style.left = Math.floor((w - ifW) / 2) + 'px';
        iframe.style.top = Math.floor((h - ifH) / 2) + 'px';
    }
    function mvCoverFitAll() {
        document.querySelectorAll('.mv-cell-video-wrap').forEach(mvCoverFitIframe);
    }
    // 창 크기가 바뀌면 포커스 모드의 ㄴ자 배치(오른쪽 열/아래 줄 인원수 포함)와
    // 일반 그리드 열 개수, 각 영상의 크롭 크기가 전부 다시 계산돼야 하므로
    // 그냥 전체를 다시 그린다(mvRenderGrid는 현재 mvOrder/mvFocus 상태를
    // 그대로 다시 그리는 멱등 함수라 안전하다).
    window.addEventListener('resize', mvRenderGrid);

    // ===== 초기화 =====
    mvApplyTheme(localStorage.getItem('mv-theme') || 'light');
    mvInit();
    document.getElementById('mv-cols-value').innerText = mvCols;
    mvApplyColsGroupVisibility();
    mvRenderAll();
</script>
</body>
</html>
