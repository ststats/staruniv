<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티뷰어 - 스타대학</title>
<link rel="stylesheet" href="style.css">
<style>
    /* ===== 다크모드: 사이트 CSS 변수를 이 페이지 안에서만 덮어쓴다 ===== */
    html[data-theme="dark"] {
        --color-bg: #14161b;
        --color-card: #1d2027;
        --color-border: #2b2f38;
        --color-border-strong: #3a3f4a;
        --color-text-main: #e7e9ec;
        --color-text-sub: #9aa1ac;
        --color-primary: #5b93ff;
        --color-primary-tint: #1c2740;
        --color-bg-subtle: #22262e;
    }
    html[data-theme="dark"] body { background: var(--color-bg); color: var(--color-text-main); }

    /* 기본 화면은 그리드만 꽉 차게 보이는 게 목적이라, 여백/타이틀 같은 크롬은
       전부 없애고 오른쪽 위 ⚙️ 버튼 하나만 항상 떠 있게 한다. 설정은 그 버튼을
       눌렀을 때만 오른쪽에서 슬라이드로 펼쳐지는 패널로 보여준다. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: 'Pretendard', sans-serif; background: var(--color-bg, #f4f7fc); color: var(--color-text-main, #222); }

    /* ===== 설정 열기 버튼 (항상 떠 있음) ===== */
    /* 각 방송 카드의 새로고침(⟳) 버튼은 헤더 맨 위 우측에 있어서, 이 버튼을
       화면 우상단에 두면 그리드 첫 칸의 새로고침 버튼을 정확히 가려버린다.
       그래서 우하단으로 옮기고, 아이콘 대신 눈에 잘 띄는 파란 배경으로 바꿨다.
       이모지(⚙️)는 폰트/OS마다 모양·정렬이 제각각이라 SVG 아이콘으로 바꿔
       확실하게 깔끔한 흰색 톱니바퀴가 나오게 했다. 평소(닫혀있을 때)엔 살짝
       투명하게 두어 화면을 덜 가리고, 열려있거나 호버 중일 땐 또렷하게 보인다. */
    .mv-fab { position: fixed; bottom: 16px; right: 16px; z-index: 100; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--color-primary); opacity: 0.7; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(41,121,255,0.35); transition: opacity 0.15s, transform 0.1s, background 0.15s; }
    .mv-fab svg { width: 18px; height: 18px; }
    .mv-fab:hover { opacity: 1; transform: scale(1.05); }
    .mv-fab.on { background: var(--color-primary-deep, var(--color-primary)); opacity: 1; }

    /* ===== 설정 패널: 오른쪽에서 접혔다 펴지는 서랍 형태 ===== */
    .mv-settings-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 90; width: 340px; max-width: 88vw; background: rgba(255,255,255,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-left: 1px solid var(--color-border); box-shadow: -4px 0 16px rgba(0,0,0,0.15); overflow-y: auto; transform: translateX(100%); transition: transform 0.2s ease; }
    html[data-theme="dark"] .mv-settings-panel { background: rgba(29,32,39,0.82); }
    .mv-settings-panel.open { transform: translateX(0); }
    .mv-settings-inner { padding: 16px; }
    .mv-settings-top { margin-bottom: 20px; }
    .mv-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .mv-title-main { color: var(--color-text-main); }

/* ===== 설정 패널(사이드바) 안에서는 PC 화면이라도 항상 바둑판(모바일) 레이아웃 유지 ===== */
    .mv-settings-panel .mv-console { 
        flex-direction: column !important; 
        align-items: stretch !important; 
        padding: 14px !important; 
    }
    .mv-settings-panel .mv-console-tiles { 
        display: grid !important; 
        grid-template-columns: repeat(3, 1fr) !important; 
    }
    .mv-settings-panel .mv-tile { 
        flex-direction: column !important; 
        align-items: center !important; 
        gap: 7px !important; 
        padding: 10px 6px 12px !important; 
    }

    /* 선택된 목록은 서랍 안에서 세로로 순서대로 나열한다. */
    .mv-order-row { display: flex; flex-direction: column; gap: 6px; }
    .mv-order-item { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-bg, #fff); font-size: var(--fs-body); }
    .mv-order-item.custom { border-style: dashed; }
    .mv-order-num { font-weight: 800; color: var(--color-text-sub); flex-shrink: 0; }
    .mv-order-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-main); }
    .mv-order-item button { width: 20px; height: 20px; border: none; background: transparent; color: var(--color-text-sub); cursor: pointer; border-radius: 4px; font-size: var(--fs-body); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mv-order-item button:hover:not(:disabled) { background: var(--color-bg-subtle); color: var(--color-text-main); }
    .mv-order-item button:disabled { opacity: 0.3; cursor: not-allowed; }
    .mv-order-item .mv-order-remove:hover:not(:disabled) { color: #f03e3e; }
    .mv-order-item.selectable { cursor: pointer; }
    .mv-order-item.focus-target { border-color: var(--color-primary); background: var(--color-primary-tint); }

    /* ===== 그리드: 스크롤 없이 화면(뷰포트) 안에 정확히 맞춘다. 모바일은 100vh가
       주소창 때문에 실제 보이는 영역보다 크게 잡히는 문제가 있어 100dvh(동적
       뷰포트 높이)를 우선 쓴다. */
    #mv-grid-area { height: 100vh; height: 100dvh; padding: 10px; box-sizing: border-box; }
    .mv-grid { display: grid; gap: 10px; height: 100%; }
    .mv-cell { background: var(--color-card, #fff); border: 1px solid var(--color-border); border-radius: var(--radius-card, 12px); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .mv-cell-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--color-border); font-size: var(--fs-body); font-weight: 800; color: var(--color-text-main); }
    .mv-cell-refresh { border: none; background: transparent; color: var(--color-text-sub); font-size: var(--fs-body); font-weight: 700; cursor: pointer; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
    .mv-cell-refresh:hover { background: var(--color-bg-subtle); color: var(--color-primary); }
    .mv-cell-body { flex: 1; min-height: 0; background: #0b0c10; }
    .mv-cell-video-wrap { position: relative; width: 100%; height: 100%; }
    .mv-cell-video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

    /* 포커스 모드: 균일한 그리드 안에서 메인 하나만 2×2칸을 차지(grid-column/row
       span)하고, 나머지는 CSS Grid의 기본 자동배치가 비어있는 칸에 알아서
       순서대로 채워준다 - 남는 칸 좌표를 직접 계산할 필요가 없다. */
    .mv-cell-main { grid-column: span 2; grid-row: span 2; }

    .mv-empty { text-align: center; color: var(--color-text-sub); font-size: var(--fs-body); padding: 30vh 0; }
</style>
</head>
<body>

<button type="button" class="mv-fab" id="mv-fab" onclick="mvToggleSettingsPanel()" title="설정 열기/닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
</button>

<div class="mv-settings-panel" id="mv-settings-panel">
    <div class="mv-settings-inner">
        <div class="mv-settings-top">
            <div class="mv-title"><span class="mv-title-main">멀티</span><span class="logo-accent">뷰어</span></div>
        </div>

        <div class="section-title">설정</div>
        <div class="mv-console">
            <div class="mv-console-tiles">
                <div class="mv-tile">
                    <svg class="mv-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
                    <div class="mv-tile-label">그리드</div>
                    <button type="button" class="mv-toggle-switch" id="mv-mode-toggle" onclick="mvToggleFocusMode()"></button>
                </div>
                <div class="mv-tile disabled" id="mv-col-tile">
                    <svg class="mv-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>
                    <div class="mv-tile-label">열 개수</div>
                    <div class="mv-stepper">
                        <button type="button" onclick="mvChangeCols(-1)">−</button>
                        <span class="mv-stepper-value" id="mv-cols-value">2</span>
                        <button type="button" onclick="mvChangeCols(1)">+</button>
                    </div>
                </div>
                <div class="mv-tile">
                    <svg class="mv-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <div class="mv-tile-label">다크 모드</div>
                    <button type="button" class="mv-toggle-switch" id="mv-theme-toggle" onclick="mvToggleTheme()"></button>
                </div>
            </div>
        </div>

        <div class="section-title">선택된 목록</div>
        <div class="mv-order-row" id="mv-order-row"></div>

        <div class="section-title">멤버 선택</div>
        <div class="mv-chip-box">
            <div class="mv-chip-row" id="mv-chip-row"></div>
            <div class="mv-quickadd">
                <input type="text" id="mv-add-input" placeholder="숲아이디 직접 입력" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault(); mvAddCustom();}">
                <button type="button" class="mv-quickadd-btn" title="추가" onclick="mvAddCustom()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
        </div>
    </div>
</div>

<div id="mv-grid-area"></div>

<script>
    function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag]));
    }
    function jsStrEscape(str) { return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    // ===== 상태 =====
    // order: [{ soopId, name, isMember }] - 화면에 그려지는 순서 그대로
    let mvOrder = [];
    let mvCols = 2;
    let mvFocus = true;
    let mvFocusId = null;  // 포커스 모드에서 크게 보여줄 대상(soopId) - 목록 순서와 무관하게 별도 지정
    let mvMembers = [];    // 사이트 멤버 목록(활동중 + 숲 아이디 있는) - site_data.json에서 로드
    let mvLiveMap = {};    // soopId -> 방송중 여부

    function mvFocusEntryId() {
        if (mvFocusId && mvOrder.some(e => e.soopId === mvFocusId)) return mvFocusId;
        return mvOrder.length ? mvOrder[0].soopId : null;
    }

    function mvSaveState() {
        try {
            localStorage.setItem('mv-order', JSON.stringify(mvOrder));
            localStorage.setItem('mv-cols', String(mvCols));
            localStorage.setItem('mv-focus', mvFocus ? '1' : '0');
            localStorage.setItem('mv-focus-id', mvFocusId || '');
        } catch (e) { /* localStorage 접근 불가한 환경이면 그냥 무시 */ }
    }

    function mvInit() {
        const params = new URLSearchParams(location.search);
        let list = null;
        if (params.has('list')) {
            try { list = JSON.parse(params.get('list')); } catch (e) { list = null; }
        }
        if (Array.isArray(list) && list.length > 0) {
            mvOrder = list
                .filter(e => e && typeof e.id === 'string' && /^[a-z0-9_-]+$/i.test(e.id))
                .map(e => ({ soopId: e.id.toLowerCase(), name: e.name || e.id, isMember: !!e.isMember }));
            mvCols = Math.min(4, Math.max(1, parseInt(params.get('cols'), 10) || 2));
            mvFocus = params.get('focus') === '1';
            mvFocusId = params.get('focusId') || null;
            // 도구 탭에서 명시적으로 넘긴 다크모드 설정이 있으면 그걸 우선한다
            // (없으면 아래에서 마지막으로 써둔 localStorage 값을 그대로 쓴다).
            if (params.get('theme') === 'dark' || params.get('theme') === 'light') {
                mvApplyTheme(params.get('theme'));
            }
        } else {
            // URL에 아무것도 없으면(직접 이 페이지를 열었거나 새로고침한 경우) 마지막으로
            // 저장해둔 상태를 이어서 보여준다.
            try {
                mvOrder = JSON.parse(localStorage.getItem('mv-order') || '[]');
                mvCols = Math.min(4, Math.max(1, parseInt(localStorage.getItem('mv-cols'), 10) || 2));
                mvFocus = localStorage.getItem('mv-focus') !== null ? localStorage.getItem('mv-focus') === '1' : true;
                mvFocusId = localStorage.getItem('mv-focus-id') || null;
            } catch (e) { mvOrder = []; mvCols = 2; mvFocus = true; mvFocusId = null; }
        }
        mvApplyModeButtons();
    }

    // ===== 다크모드 (도구 탭과 같은 버튼형 스위치) =====
    function mvApplyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('mv-theme-toggle');
        if (btn) btn.classList.toggle('on', theme === 'dark');
        localStorage.setItem('mv-theme', theme);
    }
    function mvToggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        mvApplyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // ===== 설정 패널 여닫기 =====
    function mvApplySettingsPanel(open) {
        document.getElementById('mv-settings-panel').classList.toggle('open', open);
        document.getElementById('mv-fab').classList.toggle('on', open);
    }
    function mvToggleSettingsPanel() {
        const isOpen = document.getElementById('mv-settings-panel').classList.contains('open');
        mvApplySettingsPanel(!isOpen);
    }

    // ===== 열 개수 =====
    function mvChangeCols(delta) {
        mvCols = Math.min(4, Math.max(1, mvCols + delta));
        document.getElementById('mv-cols-value').innerText = mvCols;
        mvApplyGridColumns();
        mvSaveState();
    }
    function mvApplyGridColumns(explicitCols) {
        const grid = document.getElementById('mv-grid');
        if (!grid) return;
        const count = grid.children.length;
        if (count === 0) return;
        // 남은 칸이 열 개수보다 적으면 그만큼만 컬럼을 써서 빈 칸이 오른쪽에
        // 휑하게 남지 않게 한다. rows는 남은 칸 수 기준으로 계산해서
        // grid-template-rows에 못박아, 세로도 뷰포트 안에 딱 맞게 나눠진다.
        const wantCols = explicitCols || mvCols;
        const cols = Math.max(1, Math.min(wantCols, count));
        const rows = Math.max(1, Math.ceil(count / cols));
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    }

    // 포커스 모드: 메인이 2×2칸을 차지하는 균일 그리드. 컨테이너의 가로세로
    // 비율에 맞춰 칸이 너무 눌리거나 늘어나지 않게 열/행 개수를 정하고,
    // 실제 배치(빈 칸 채우기)는 CSS Grid 자동배치에 맡긴다.
    function mvComputeFocusGridDims(totalW, totalH, restCount) {
        const units = 4 + restCount; // 메인이 4칸(2x2) + 나머지는 한 칸씩
        const aspect = totalW / (totalH || 1);
        const cols = Math.max(2, Math.round(Math.sqrt(units * aspect)));
        const rows = Math.max(2, Math.ceil(units / cols));
        return { cols, rows };
    }

    function mvApplyModeButtons() {
        const toggle = document.getElementById('mv-mode-toggle');
        if (toggle) toggle.classList.toggle('on', !mvFocus);
    }
    function mvSetFocusMode(isFocus) {
        if (isFocus === mvFocus) return;
        mvFocus = isFocus;
        mvApplyModeButtons();
        mvApplyColsGroupVisibility();
        mvRenderOrderRow();
        mvRenderGrid();
        mvSaveState();
    }
    // 포커스/그리드 pill에 붙은 새로고침 버튼: 누를 때마다 현재 모드의 반대로 전환한다.
    function mvToggleFocusMode() {
        mvSetFocusMode(!mvFocus);
    }
    function mvApplyColsGroupVisibility() {
        // 포커스 모드에서는 열 개수가 화면 크기·인원 수 기준 자동 계산
        // (mvComputeFocusGridDims)으로 정해지고 이 스테퍼 값은 아예 안 쓰이므로,
        // 요소를 아예 숨기지 않고 흐릿하게 비활성화만 한다(보였다 안 보였다
        // 하면 레이아웃이 덜컹거려서 오히려 지저분해 보인다).
        document.getElementById('mv-col-tile').classList.toggle('disabled', mvFocus);
    }

    // ===== 멤버 선택 칩 (도구 탭과 동일 - site_data.json에서 직접 불러온다) =====
    function mvAvatarHtml(soopId) {
        const id = String(soopId || '').trim().toLowerCase();
        if (!id || !/^[a-z0-9_-]+$/.test(id)) return `<span class="mv-chip-avatar d-flex align-items-center justify-content-center">👤</span>`;
        const url = `https://profile.img.sooplive.co.kr/LOGO/${id.substring(0, 2)}/${id}/${id}.jpg`;
        return `<img src="${url}" class="mv-chip-avatar" loading="lazy" onerror="this.outerHTML='<span class=\\'mv-chip-avatar d-flex align-items-center justify-content-center\\'>👤</span>';">`;
    }
    function mvChipHtml(m) {
        const soopId = m['SOOP ID'];
        const selected = mvOrder.some(e => e.soopId === soopId);
        const isLive = !!mvLiveMap[soopId];
        return `
        <div class="mv-chip${selected ? ' selected' : ''}" onclick="mvToggleMemberChip('${jsStrEscape(soopId)}', '${jsStrEscape(m['이름'])}')">
            ${mvAvatarHtml(soopId)}
            ${isLive ? '<span class="mv-chip-live">LIVE</span>' : ''}
            <span class="mv-chip-name">${escapeHTML(m['이름'])}</span>
            <span class="mv-chip-check">✓</span>
        </div>`;
    }
    function mvRenderMemberChips() {
        const container = document.getElementById('mv-chip-row');
        if (!container) return;
        container.innerHTML = mvMembers.length
            ? mvMembers.map(mvChipHtml).join('')
            : '<div style="font-size:var(--fs-body); color:var(--color-text-sub);">멤버 목록을 불러오지 못했습니다.</div>';
    }
    function mvToggleMemberChip(soopId, name) {
        const idx = mvOrder.findIndex(e => e.soopId === soopId);
        if (idx !== -1) {
            mvRemove(idx);
        } else {
            mvOrder.push({ soopId, name, isMember: true });
            mvAddGridCell(mvOrder[mvOrder.length - 1]);
            mvRenderMemberChips();
            mvRenderOrderRow();
            mvSaveState();
        }
    }
    async function mvLoadMembers() {
        try {
            const res = await fetch('data/site_data.json', { cache: 'no-store' });
            if (res.ok) {
                const data = await res.json();
                mvMembers = (data.members || []).filter(m => {
                    const active = !m['퇴단일'] || String(m['퇴단일']).trim() === '';
                    const soopId = m['SOOP ID'];
                    return active && soopId && /^[a-zA-Z0-9_-]+$/.test(String(soopId).trim());
                });
            }
        } catch (e) { mvMembers = []; }
        mvRenderMemberChips();
        mvCheckLiveMembers();
    }
    // 홈 화면 방송중 체크와 같은 방식(bjapi.afreecatv.com 직접 fetch, CORS 허용됨)으로
    // 멤버 목록 로드 후 딱 한 번만 라이브 여부를 확인해 LIVE 뱃지를 덧입힌다.
    async function mvCheckLiveMembers() {
        if (mvMembers.length === 0) return;
        const settled = await Promise.allSettled(mvMembers.map(m => {
            const soopId = m['SOOP ID'];
            return fetch(`https://bjapi.afreecatv.com/api/${soopId}/station`)
                .then(r => r.json())
                .then(d => ({ soopId, live: !!(d && d.broad) }))
                .catch(() => ({ soopId, live: false }));
        }));
        mvLiveMap = {};
        settled.forEach(r => { if (r.status === 'fulfilled') mvLiveMap[r.value.soopId] = r.value.live; });
        mvRenderMemberChips();
    }

    // ===== 순서 목록 =====
    function mvOrderItemHtml(entry, idx) {
        const isFocusTarget = mvFocus && mvFocusEntryId() === entry.soopId;
        const rowClick = mvFocus ? ` onclick="mvSetFocusTarget('${jsStrEscape(entry.soopId)}')"` : '';
        return `
        <div class="mv-order-item${entry.isMember ? '' : ' custom'}${isFocusTarget ? ' focus-target' : ''}${mvFocus ? ' selectable' : ''}"${rowClick}>
            <span class="mv-order-num">${idx + 1}.</span>
            <button type="button" title="위로" onclick="event.stopPropagation(); mvMove(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button type="button" title="아래로" onclick="event.stopPropagation(); mvMove(${idx}, 1)" ${idx === mvOrder.length - 1 ? 'disabled' : ''}>▼</button>
            <span class="mv-order-name">${escapeHTML(entry.name)}</span>
            <button type="button" class="mv-order-remove" title="빼기" onclick="event.stopPropagation(); mvRemove(${idx})">✕</button>
        </div>`;
    }
    function mvRenderOrderRow() {
        const row = document.getElementById('mv-order-row');
        row.innerHTML = mvOrder.length
            ? mvOrder.map(mvOrderItemHtml).join('')
            : '<span style="font-size:var(--fs-body); color:var(--color-text-sub);">위에서 멤버를 선택하거나 이름/숲 아이디를 입력해 추가해보세요.</span>';
    }

    function mvSetFocusTarget(soopId) {
        const oldFocusId = mvFocusEntryId();
        if (soopId === oldFocusId) return; // 이미 메인인 사람을 다시 누른 경우

        if (mvFocus) {
            // 그리드를 통째로 다시 그리면 모든 iframe이 새로 생성돼 재생 중이던
            // 영상이 리셋된다 - 실제로는 "새 메인"과 "기존 메인" 두 칸의 위치와
            // 메인 표시(2×2) 클래스만 서로 맞바꾸면 되므로 그렇게 처리한다.
            const grid = document.getElementById('mv-grid');
            if (grid) {
                const oldFocusIdx = mvOrder.findIndex(e => e.soopId === oldFocusId);
                const newFocusIdx = mvOrder.findIndex(e => e.soopId === soopId);
                const toRenderIdx = i => (i === oldFocusIdx ? 0 : 1 + (i < oldFocusIdx ? i : i - 1));
                const newRenderIdx = toRenderIdx(newFocusIdx);
                if (newRenderIdx !== 0) {
                    mvSwapGridCells(0, newRenderIdx);
                    const cells = grid.children;
                    if (cells[0]) cells[0].classList.add('mv-cell-main');
                    if (cells[newRenderIdx]) cells[newRenderIdx].classList.remove('mv-cell-main');
                }
            } else {
                // 그리드 자체가 없는 특수 케이스(포커스 대상 혼자 남은 상태) -
                // 구조가 아예 다르므로 이 경우만 다시 그린다.
                mvFocusId = soopId;
                mvRenderGrid();
                mvRenderOrderRow();
                mvSaveState();
                return;
            }
        }

        mvFocusId = soopId;
        mvRenderOrderRow();
        mvSaveState();
    }

    function mvMove(idx, dir) {
        const target = idx + dir;
        if (target < 0 || target >= mvOrder.length) return;

        if (mvFocus) {
            const focusId = mvFocusEntryId();
            const aIsFocus = mvOrder[idx].soopId === focusId;
            const bIsFocus = mvOrder[target].soopId === focusId;
            if (aIsFocus || bIsFocus) {
                // 포커스 대상 본인은 순서가 바뀌어도 여전히 메인으로 그려지고,
                // 상대방도 "나머지" 안에서의 상대적 순서가 그대로라 그리드 화면
                // 자체는 안 바뀐다 - 순서 목록 UI(번호)만 갱신하면 된다.
                [mvOrder[idx], mvOrder[target]] = [mvOrder[target], mvOrder[idx]];
                mvRenderOrderRow();
                mvSaveState();
                return;
            }
            // 포커스 대상이 아닌 둘 사이의 스왑 - 그리드 DOM은 "메인을 뺀 나머지"
            // 순서로 그려지므로, 배열 인덱스를 그 렌더 인덱스로 변환해서 스왑한다.
            const focusIdx = mvOrder.findIndex(e => e.soopId === focusId);
            const toRenderIdx = i => 1 + (i < focusIdx ? i : i - 1);
            mvSwapGridCells(toRenderIdx(idx), toRenderIdx(target));
        } else {
            // 그리드를 통째로 다시 그리면 모든 iframe이 새로 생성되면서 재생
            // 중이던 영상까지 리셋된다 - 두 칸의 DOM 위치만 맞바꾼다.
            mvSwapGridCells(idx, target);
        }
        [mvOrder[idx], mvOrder[target]] = [mvOrder[target], mvOrder[idx]];
        mvRenderOrderRow();
        mvSaveState();
    }
    function mvSwapGridCells(idxA, idxB) {
        const grid = document.getElementById('mv-grid');
        if (!grid) return; // 남은 게 1개뿐이라 그리드 자체가 없는 경우(위/아래 버튼도 비활성화돼 있어 사실상 안 옴)
        const elA = grid.children[idxA];
        const elB = grid.children[idxB];
        if (!elA || !elB) return;
        // 두 엘리먼트의 DOM 위치를 실제로 맞바꾼다(임시 표시자로 안전하게 스왑) -
        // 카드 내용(iframe)은 그대로 두므로 재생 중이던 영상이 안 끊긴다.
        const placeholder = document.createComment('mv-swap');
        elA.replaceWith(placeholder);
        elB.replaceWith(elA);
        placeholder.replaceWith(elB);
    }
    function mvRemove(idx) {
        if (mvFocus) {
            const focusId = mvFocusEntryId();
            if (mvOrder[idx].soopId === focusId) {
                // 메인 본인을 지우는 거라 누가 새 메인이 될지부터 다시 정해야
                // 하므로(다음 사람이 기본값으로 승격) 전체를 다시 그린다.
                mvOrder.splice(idx, 1);
                if (mvFocusId === focusId) mvFocusId = null;
                mvRenderGrid();
                mvRenderMemberChips();
                mvRenderOrderRow();
                mvSaveState();
                return;
            }
            const focusIdx = mvOrder.findIndex(e => e.soopId === focusId);
            const renderIdx = 1 + (idx < focusIdx ? idx : idx - 1);
            const handled = mvRemoveGridCellAt(renderIdx);
            mvOrder.splice(idx, 1);
            if (handled) mvRelayoutGridDims(); else mvRenderGrid();
            mvRenderMemberChips();
            mvRenderOrderRow();
            mvSaveState();
            return;
        }
        // 삭제 후 구조 자체가 바뀌는 경계(그리드 자체가 필요 없어지는 경우)만
        // 전체를 다시 그리고, 그 외에는 지우는 카드 하나만 없애서 나머지
        // iframe은 그대로 둔다.
        const handled = mvRemoveGridCellAt(idx);
        mvOrder.splice(idx, 1);
        if (handled) mvRelayoutGridDims(); else mvRenderGrid();
        mvRenderMemberChips();
        mvRenderOrderRow();
        mvSaveState();
    }
    function mvRemoveGridCellAt(renderIdx) {
        const remainingCount = mvOrder.length - 1;
        if (remainingCount === 0 || (mvFocus && remainingCount === 1)) return false;
        const grid = document.getElementById('mv-grid');
        if (!grid) return false;
        const el = grid.children[renderIdx];
        if (!el) return false;
        el.remove();
        return true;
    }
    function mvAddGridCell(entry) {
        // 처음 추가되거나(그리드 자체가 아직 없음), 포커스 모드에서 메인 혼자인
        // 단독 구조 -> 메인+나머지 그리드 구조로 바뀌는 경계는 전체를 다시 그린다.
        // 그 외에는 새 카드 하나만 맨 끝에 추가한다(항상 목록 끝에 붙으므로
        // 메인이 될 일은 없다 - 기존 카드들은 안 건드리니 iframe도 그대로 유지).
        const needsFullRebuild = mvOrder.length === 1 || (mvFocus && mvOrder.length === 2);
        const grid = document.getElementById('mv-grid');
        if (needsFullRebuild || !grid) { mvRenderGrid(); return; }
        grid.insertAdjacentHTML('beforeend', mvCellHtml(entry, false));
        mvRelayoutGridDims();
    }
    // 인원 수가 바뀌면 열/행 개수가 달라질 수 있어 그리드 크기(스타일)만 다시
    // 계산한다 - 칸 내용(iframe)은 손대지 않는다.
    function mvRelayoutGridDims() {
        const grid = document.getElementById('mv-grid');
        if (!grid) return;
        if (mvFocus) {
            const area = document.getElementById('mv-grid-area');
            const { cols, rows } = mvComputeFocusGridDims(area.clientWidth, area.clientHeight, mvOrder.length - 1);
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        } else {
            mvApplyGridColumns();
        }
    }
    function mvAddCustom() {
        const input = document.getElementById('mv-add-input');
        const raw = input.value.trim();
        if (!raw) return;

        // 1) 우리 멤버 이름과 정확히 일치하면(대소문자 무시) 그 멤버를 추가한다.
        const byName = mvMembers.find(m => String(m['이름']).trim().toLowerCase() === raw.toLowerCase());
        if (byName) {
            if (mvOrder.some(e => e.soopId === byName['SOOP ID'])) { alert('이미 선택된 목록에 있습니다.'); return; }
            mvOrder.push({ soopId: byName['SOOP ID'], name: byName['이름'], isMember: true });
            mvAddGridCell(mvOrder[mvOrder.length - 1]);
            mvRenderMemberChips();
            mvRenderOrderRow();
            mvSaveState();
            input.value = '';
            return;
        }

        // 2) 이름이 아니면 숲 아이디로 취급한다.
        const id = raw.toLowerCase();
        if (!/^[a-z0-9_-]+$/.test(id)) { alert('멤버 이름이 아니면 숲 아이디 형식(영문/숫자/-/_)이어야 합니다.'); return; }
        if (mvOrder.some(e => e.soopId === id)) { alert('이미 추가된 아이디입니다.'); return; }
        const knownMember = mvMembers.find(m => m['SOOP ID'] === id);
        const entry = knownMember ? { soopId: id, name: knownMember['이름'], isMember: true } : { soopId: id, name: id, isMember: false };
        mvOrder.push(entry);
        mvAddGridCell(entry);
        mvRenderMemberChips();
        mvRenderOrderRow();
        mvSaveState();
        input.value = '';
    }

    // ===== 그리드: 실시간 영상은 SOOP의 공식 라이브 임베드 엔드포인트
    // (play.sooplive.com/{아이디}/embed)를 iframe으로 그대로 삽입한다. 채팅은
    // 요청대로 껐고(showChat=false), 자동재생을 켜뒀다(autoPlay=true).
    // 화질을 1080p 등으로 강제 요청하면 SOOP이 "고화질 스트리머"라는 PC 전용
    // 로컬 프로그램에 연결을 시도하는데, 이게 iframe 안에서는 막혀서 재생이
    // 안 됐다 - 화질 파라미터를 아예 안 넘기고 기본(자동) 화질로 열면 그
    // 로컬 프로그램을 거치지 않고 정상 재생됨을 실제 테스트로 확인함.
    function mvEmbedUrl(soopId) {
        const params = new URLSearchParams({ showChat: 'false', autoPlay: 'true' });
        return `https://play.sooplive.com/${encodeURIComponent(soopId)}/embed?${params.toString()}`;
    }
    // 특정 카드 하나만 새로고침한다(가끔 렉 걸리는 스트림만 개별로 다시 불러오고
    // 싶을 때 씀) - 다른 카드들은 그대로 두므로 재생 중이던 나머지 영상엔
    // 영향이 없다. src를 한 번 비웠다가 다시 넣어서 같은 URL이어도 확실히
    // 새로고침되게 한다.
    function mvRefreshCell(btn, soopId) {
        const cell = btn.closest('.mv-cell');
        const iframe = cell && cell.querySelector('iframe');
        if (!iframe) return;
        iframe.src = 'about:blank';
        requestAnimationFrame(() => { iframe.src = mvEmbedUrl(soopId); });
    }
    function mvCellHtml(entry, isMain) {
        return `
        <div class="mv-cell${isMain ? ' mv-cell-main' : ''}">
            <div class="mv-cell-header">
                <span>${escapeHTML(entry.name)}</span>
                <button type="button" class="mv-cell-refresh" title="새로고침" onclick="mvRefreshCell(this, '${jsStrEscape(entry.soopId)}')">⟳</button>
            </div>
            <div class="mv-cell-body">
                <div class="mv-cell-video-wrap">
                    <iframe src="${mvEmbedUrl(entry.soopId)}" allowfullscreen loading="lazy" allow="autoplay; encrypted-media; fullscreen; local-network-access; loopback-network"></iframe>
                </div>
            </div>
        </div>`;
    }
    function mvRenderGrid() {
        const area = document.getElementById('mv-grid-area');
        if (mvOrder.length === 0) {
            area.innerHTML = '<div class="mv-empty">추가된 방송이 없습니다. 오른쪽 위 ⚙️를 눌러 멤버를 선택하거나 아이디를 추가해보세요.</div>';
            return;
        }
        if (mvFocus) {
            // 포커스 모드: 지정된 포커스 대상(mvFocusEntryId)이 2×2칸을 차지하는
            // 균일 그리드로 만들고, 나머지는 CSS Grid 기본 자동배치(grid-auto-flow)가
            // 비어있는 칸에 순서대로 알아서 채워준다 - 남는 칸 좌표를 직접
            // 계산할 필요가 없다.
            const focusId = mvFocusEntryId();
            const focusIdx = mvOrder.findIndex(e => e.soopId === focusId);
            const main = mvOrder[focusIdx];
            const rest = mvOrder.filter((_, i) => i !== focusIdx);
            if (rest.length === 0) {
                // 나머지가 없으면 메인 혼자 화면 전체를 그대로 쓴다(그리드 자체가 필요 없음).
                area.innerHTML = mvCellHtml(main, false);
                document.querySelector('#mv-grid-area > .mv-cell').style.height = '100%';
            } else {
                const totalW = area.clientWidth;
                const totalH = area.clientHeight;
                const { cols, rows } = mvComputeFocusGridDims(totalW, totalH, rest.length);
                const cellsHtml = mvCellHtml(main, true) + rest.map(e => mvCellHtml(e, false)).join('');
                area.innerHTML = `<div class="mv-grid" id="mv-grid" style="grid-template-columns:repeat(${cols}, 1fr); grid-template-rows:repeat(${rows}, 1fr);">${cellsHtml}</div>`;
            }
        } else {
            area.innerHTML = `<div class="mv-grid" id="mv-grid">${mvOrder.map(e => mvCellHtml(e, false)).join('')}</div>`;
            mvApplyGridColumns();
        }
    }

    // 창 크기가 바뀌면 포커스 모드의 열/행 개수(화면 비율 기준)와 일반 그리드
    // 열 개수가 다시 계산돼야 하므로 전체를 다시 그린다(mvRenderGrid는 현재
    // mvOrder/mvFocus 상태를 그대로 다시 그리는 멱등 함수라 안전하다). 영상
    // 자체의 비율 맞춤은 각 iframe이 칸을 100% 채우기만 하고, 실제 레터박스
    // 처리는 SOOP 플레이어 자신에게 맡긴다.
    window.addEventListener('resize', mvRenderGrid);

    // ===== 초기화 =====
    mvApplyTheme(localStorage.getItem('mv-theme') || 'light');
    mvInit();
    document.getElementById('mv-cols-value').innerText = mvCols;
    mvApplyColsGroupVisibility();
    mvRenderOrderRow();
    mvRenderGrid();
    mvLoadMembers();
</script>
</body>
</html>
