<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티뷰어 - 스타대학</title>
<link rel="stylesheet" href="style.css">
<style>
    /* ===== 다크모드: 사이트 CSS 변수를 이 페이지 안에서만 덮어쓴다 ===== */
    html[data-theme="dark"] {
        --color-bg: #14161b;
        --color-card: #1d2027;
        --color-border: #2b2f38;
        --color-border-strong: #3a3f4a;
        --color-text-main: #e7e9ec;
        --color-text-sub: #9aa1ac;
        --color-primary: #5b93ff;
        --color-primary-tint: #1c2740;
        --color-bg-subtle: #22262e;
    }
    html[data-theme="dark"] body { background: var(--color-bg); color: var(--color-text-main); }

    body { margin: 0; font-family: 'Pretendard', sans-serif; background: var(--color-bg, #f4f7fc); color: var(--color-text-main, #222); }
    .mv-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
    .mv-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .mv-title { font-size: 18px; font-weight: 800; }
    .mv-theme-toggle { display: flex; align-items: center; gap: 6px; font-size: var(--fs-body); font-weight: 700; color: #666; cursor: pointer; user-select: none; }
    .mv-theme-toggle input { width: 16px; height: 16px; accent-color: var(--color-primary); cursor: pointer; }

    /* 설정 바(포커스모드/다크모드) - 도구 탭과 동일한 클래스(style.css 공용) */
    .mv-settings-bar { margin-bottom: 24px; }

    /* 선택된 목록 */
    .mv-order-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .mv-order-item { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-card, #fff); font-size: 12px; }
    .mv-order-item.custom { border-style: dashed; }
    .mv-order-num { font-weight: 800; color: var(--color-text-sub); flex-shrink: 0; }
    .mv-order-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mv-order-item button { width: 20px; height: 20px; border: none; background: transparent; color: var(--color-text-sub); cursor: pointer; border-radius: 4px; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .mv-order-item button:hover:not(:disabled) { background: var(--color-bg-subtle); color: var(--color-text-main); }
    .mv-order-item button:disabled { opacity: 0.3; cursor: not-allowed; }
    .mv-order-item .mv-order-remove:hover:not(:disabled) { color: #f03e3e; }
    .mv-order-item.selectable { cursor: pointer; }
    .mv-order-item.focus-target { border-color: var(--color-primary); background: var(--color-primary-tint); }
    .mv-order-item .mv-order-status { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; flex-shrink: 0; }
    .mv-order-item .mv-order-status.open { background: var(--color-primary-tint); color: var(--color-primary); }
    .mv-order-item .mv-order-status.closed { background: var(--color-bg-subtle); color: var(--color-text-sub); }

    /* 실행/닫기 액션 */
    .mv-launch-bar { display: flex; gap: 8px; margin-top: 16px; }
    .mv-launch-btn { flex: 1; background: var(--color-primary); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; padding: 13px; cursor: pointer; transition: 0.1s; }
    .mv-launch-btn:hover:not(:disabled) { filter: brightness(1.08); }
    .mv-launch-btn:disabled { background: #c8ccd2; cursor: not-allowed; }
    .mv-closeall-btn { background: transparent; color: #d94848; border: 1px solid #ffd2d2; border-radius: 8px; font-size: 13px; font-weight: 700; padding: 13px 16px; cursor: pointer; }
    .mv-closeall-btn:hover { background: #fff5f5; border-color: #ffb8b8; }
    .mv-hint { margin-top: 10px; font-size: 12px; color: var(--color-text-sub); line-height: 1.5; }
    .mv-overflow-hint { margin-top: 12px; padding: 12px 14px; background: #fff8e6; border: 1px solid #ffe1a8; border-radius: 8px; font-size: 12px; color: #8a5700; line-height: 1.5; }
    .mv-overflow-url-row { display: flex; gap: 6px; margin-top: 8px; }
    .mv-overflow-url-row input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #ffe1a8; border-radius: 6px; font-size: 11px; background: #fff; color: #444; }
    .mv-overflow-url-row button { border: 1px solid #ffe1a8; background: #fff; color: #8a5700; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .mv-overflow-url-row button:hover { background: #fff3d6; }
</style>
</head>
<body>

<div class="mv-wrap">
    <div class="mv-top">
        <div class="mv-title">🎬 멀티뷰어</div>
        <label class="mv-theme-toggle">
            <input type="checkbox" id="mv-theme-checkbox" onchange="mvToggleThemeCheckbox()">
            다크 모드
        </label>
    </div>

    <div class="section-title">설정</div>
    <div class="mv-settings-bar">
        <label class="mv-toggle">
            <input type="checkbox" id="mv-focus-checkbox" onchange="mvToggleFocus()">
            포커스 모드
        </label>
    </div>

    <div class="section-title">멤버 선택</div>
    <div class="mv-chip-row" id="mv-chip-row"></div>
    <div class="mv-add-row">
        <input type="text" id="mv-add-input" placeholder="멤버 이름이나 숲아이디 직접 입력" onkeydown="if(event.key==='Enter'){event.preventDefault(); mvAddCustom();}">
        <button type="button" class="mv-add-btn" onclick="mvAddCustom()">추가</button>
    </div>

    <div class="section-title">선택된 목록</div>
    <div class="mv-order-row" id="mv-order-row"></div>

    <div class="mv-launch-bar">
        <button type="button" class="mv-launch-btn" id="mv-launch-btn" onclick="mvLaunchAll()" disabled>실행 (새 창으로 열기)</button>
        <button type="button" class="mv-closeall-btn" onclick="mvCloseAll()">모두 닫기</button>
    </div>
    <p class="mv-hint">각 방송을 SOOP의 헤더·채팅 없는 깔끔한 화면(임베드 페이지)으로 별도 창을 열어서 화면에 타일처럼 배치합니다. iframe이 아니라 진짜 새 창이라 채팅·화질 문제 없이 정상 동작합니다. 브라우저가 팝업 여러 개를 한꺼번에 차단할 수 있으니, 차단 안내가 뜨면 허용해주세요.</p>
</div>

<script>
    function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag]));
    }
    function jsStrEscape(str) { return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    // ===== 상태 =====
    // order: [{ soopId, name, isMember }] - 화면에 그려지는 순서 그대로
    let mvOrder = [];
    let mvFocus = false;
    let mvFocusId = null;  // 포커스 모드에서 크게 보여줄 대상(soopId) - 목록 순서와 무관하게 별도 지정
    let mvMembers = [];    // 사이트 멤버 목록(활동중 + 숲 아이디 있는) - site_data.json에서 로드
    let mvLiveMap = {};    // soopId -> 방송중 여부
    let mvWindowRefs = {}; // soopId -> 실제로 열어놓은 창 참조 (닫기/다시 포커스용)

    function mvFocusEntryId() {
        if (mvFocusId && mvOrder.some(e => e.soopId === mvFocusId)) return mvFocusId;
        return mvOrder.length ? mvOrder[0].soopId : null;
    }
    function mvSetFocusTarget(soopId) {
        mvFocusId = soopId;
        mvRenderOrderRow();
        mvSaveState();
    }

    function mvSaveState() {
        try {
            localStorage.setItem('mv-order', JSON.stringify(mvOrder));
            localStorage.setItem('mv-focus', mvFocus ? '1' : '0');
            localStorage.setItem('mv-focus-id', mvFocusId || '');
        } catch (e) { /* localStorage 접근 불가한 환경이면 그냥 무시 */ }
    }

    function mvInit() {
        const params = new URLSearchParams(location.search);
        let list = null;
        if (params.has('list')) {
            try { list = JSON.parse(params.get('list')); } catch (e) { list = null; }
        }
        if (Array.isArray(list) && list.length > 0) {
            mvOrder = list
                .filter(e => e && typeof e.id === 'string' && /^[a-z0-9_-]+$/i.test(e.id))
                .map(e => ({ soopId: e.id.toLowerCase(), name: e.name || e.id, isMember: !!e.isMember }));
            mvFocus = params.get('focus') === '1';
            mvFocusId = params.get('focusId') || null;
            if (params.get('theme') === 'dark' || params.get('theme') === 'light') {
                mvApplyTheme(params.get('theme'));
            }
        } else {
            try {
                mvOrder = JSON.parse(localStorage.getItem('mv-order') || '[]');
                mvFocus = localStorage.getItem('mv-focus') === '1';
                mvFocusId = localStorage.getItem('mv-focus-id') || null;
            } catch (e) { mvOrder = []; mvFocus = false; mvFocusId = null; }
        }
        document.getElementById('mv-focus-checkbox').checked = mvFocus;
    }

    // ===== 다크모드 =====
    function mvApplyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const cb = document.getElementById('mv-theme-checkbox');
        if (cb) cb.checked = theme === 'dark';
        localStorage.setItem('mv-theme', theme);
    }
    function mvToggleThemeCheckbox() {
        mvApplyTheme(document.getElementById('mv-theme-checkbox').checked ? 'dark' : 'light');
    }

    function mvToggleFocus() {
        mvFocus = document.getElementById('mv-focus-checkbox').checked;
        mvRenderOrderRow();
        mvSaveState();
    }

    // ===== 멤버 선택 칩 =====
    function mvAvatarHtml(soopId) {
        const id = String(soopId || '').trim().toLowerCase();
        if (!id || !/^[a-z0-9_-]+$/.test(id)) return `<span class="mv-chip-avatar d-flex align-items-center justify-content-center">👤</span>`;
        const url = `https://profile.img.sooplive.co.kr/LOGO/${id.substring(0, 2)}/${id}/${id}.jpg`;
        return `<img src="${url}" class="mv-chip-avatar" loading="lazy" onerror="this.outerHTML='<span class=\\'mv-chip-avatar d-flex align-items-center justify-content-center\\'>👤</span>';">`;
    }
    function mvChipHtml(m) {
        const soopId = m['SOOP ID'];
        const selected = mvOrder.some(e => e.soopId === soopId);
        const isLive = !!mvLiveMap[soopId];
        return `
        <div class="mv-chip${selected ? ' selected' : ''}" onclick="mvToggleMemberChip('${jsStrEscape(soopId)}', '${jsStrEscape(m['이름'])}')">
            ${mvAvatarHtml(soopId)}
            ${isLive ? '<span class="mv-chip-live">LIVE</span>' : ''}
            <span class="mv-chip-name">${escapeHTML(m['이름'])}</span>
            <span class="mv-chip-check">✓</span>
        </div>`;
    }
    function mvRenderMemberChips() {
        const container = document.getElementById('mv-chip-row');
        if (!container) return;
        container.innerHTML = mvMembers.length
            ? mvMembers.map(mvChipHtml).join('')
            : '<div style="font-size:12px; color:var(--color-text-sub);">멤버 목록을 불러오지 못했습니다.</div>';
    }
    function mvToggleMemberChip(soopId, name) {
        const idx = mvOrder.findIndex(e => e.soopId === soopId);
        if (idx !== -1) mvRemove(idx);
        else {
            mvOrder.push({ soopId, name, isMember: true });
            mvRenderAll();
        }
    }
    async function mvLoadMembers() {
        try {
            const res = await fetch('data/site_data.json', { cache: 'no-store' });
            if (res.ok) {
                const data = await res.json();
                mvMembers = (data.members || []).filter(m => {
                    const active = !m['퇴단일'] || String(m['퇴단일']).trim() === '';
                    const soopId = m['SOOP ID'];
                    return active && soopId && /^[a-zA-Z0-9_-]+$/.test(String(soopId).trim());
                });
            }
        } catch (e) { mvMembers = []; }
        mvRenderMemberChips();
        mvCheckLiveMembers();
    }
    async function mvCheckLiveMembers() {
        if (mvMembers.length === 0) return;
        const settled = await Promise.allSettled(mvMembers.map(m => {
            const soopId = m['SOOP ID'];
            return fetch(`https://bjapi.afreecatv.com/api/${soopId}/station`)
                .then(r => r.json())
                .then(d => ({ soopId, live: !!(d && d.broad) }))
                .catch(() => ({ soopId, live: false }));
        }));
        mvLiveMap = {};
        settled.forEach(r => { if (r.status === 'fulfilled') mvLiveMap[r.value.soopId] = r.value.live; });
        mvRenderMemberChips();
    }

    // ===== 순서 목록 =====
    function mvOrderItemHtml(entry, idx) {
        const isFocusTarget = mvFocus && mvFocusEntryId() === entry.soopId;
        const rowClick = mvFocus ? ` onclick="mvSetFocusTarget('${jsStrEscape(entry.soopId)}')"` : '';
        const win = mvWindowRefs[entry.soopId];
        const isOpen = !!(win && !win.closed);
        return `
        <div class="mv-order-item${entry.isMember ? '' : ' custom'}${isFocusTarget ? ' focus-target' : ''}${mvFocus ? ' selectable' : ''}"${rowClick}>
            <span class="mv-order-num">${idx + 1}.</span>
            <button type="button" title="위로" onclick="event.stopPropagation(); mvMove(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button type="button" title="아래로" onclick="event.stopPropagation(); mvMove(${idx}, 1)" ${idx === mvOrder.length - 1 ? 'disabled' : ''}>▼</button>
            <span class="mv-order-name">${escapeHTML(entry.name)}</span>
            <span class="mv-order-status ${isOpen ? 'open' : 'closed'}">${isOpen ? '열림' : '닫힘'}</span>
            <button type="button" class="mv-order-remove" title="빼기" onclick="event.stopPropagation(); mvRemove(${idx})">✕</button>
        </div>`;
    }
    function mvRenderOrderRow() {
        const row = document.getElementById('mv-order-row');
        row.innerHTML = mvOrder.length
            ? mvOrder.map(mvOrderItemHtml).join('')
            : '<span style="font-size:12px; color:var(--color-text-sub);">위에서 멤버를 선택하거나 이름/숲 아이디를 입력해 추가해보세요.</span>';
        const launchBtn = document.getElementById('mv-launch-btn');
        if (launchBtn) launchBtn.disabled = mvOrder.length === 0;
    }
    function mvMove(idx, dir) {
        const target = idx + dir;
        if (target < 0 || target >= mvOrder.length) return;
        [mvOrder[idx], mvOrder[target]] = [mvOrder[target], mvOrder[idx]];
        mvRenderOrderRow();
        mvSaveState();
        // 실행 중이었다면(창들이 이미 열려있다면) 새 순서/포커스 배치로 바로 다시 맞춰준다.
        if (Object.values(mvWindowRefs).some(w => w && !w.closed)) mvLaunchAll();
    }
    function mvRemove(idx) {
        const entry = mvOrder[idx];
        const win = entry && mvWindowRefs[entry.soopId];
        if (win && !win.closed) { try { win.close(); } catch (_) { } }
        if (entry) delete mvWindowRefs[entry.soopId];
        mvOrder.splice(idx, 1);
        mvRenderAll();
    }
    function mvAddCustom() {
        const input = document.getElementById('mv-add-input');
        const raw = input.value.trim();
        if (!raw) return;

        const byName = mvMembers.find(m => String(m['이름']).trim().toLowerCase() === raw.toLowerCase());
        if (byName) {
            if (mvOrder.some(e => e.soopId === byName['SOOP ID'])) { alert('이미 선택된 목록에 있습니다.'); return; }
            mvOrder.push({ soopId: byName['SOOP ID'], name: byName['이름'], isMember: true });
            input.value = '';
            mvRenderAll();
            return;
        }

        const id = raw.toLowerCase();
        if (!/^[a-z0-9_-]+$/.test(id)) { alert('멤버 이름이 아니면 숲 아이디 형식(영문/숫자/-/_)이어야 합니다.'); return; }
        if (mvOrder.some(e => e.soopId === id)) { alert('이미 추가된 아이디입니다.'); return; }
        const knownMember = mvMembers.find(m => m['SOOP ID'] === id);
        mvOrder.push(knownMember ? { soopId: id, name: knownMember['이름'], isMember: true } : { soopId: id, name: id, isMember: false });
        input.value = '';
        mvRenderAll();
    }

    function mvRenderAll() {
        mvRenderMemberChips();
        mvRenderOrderRow();
        mvSaveState();
    }

    // ===== 화면 타일 배치 계산 =====
    // SOOP 멀티뷰 유저스크립트(Greasy Fork)의 레이아웃 표를 그대로 참고함 - 인원
    // 수별로 미리 다듬어진 분할이라 우리가 새로 궁리한 공식보다 실전에서 더 낫다.
    function mvGetLayoutRows(count) {
        if (count <= 0) return [];
        if (count === 1) return [1];
        if (count === 2) return [2];
        if (count === 3) return [2, 1];
        if (count === 4) return [2, 2];
        if (count === 5) return [3, 2];
        if (count === 6) return [4, 2];
        if (count === 7) return [4, 3];
        return [4, 4]; // 8명 이상은 4x4로 캡
    }
    function mvSegmentRect(start, total, index, parts) {
        const from = start + Math.round((total * index) / parts);
        const to = start + Math.round((total * (index + 1)) / parts);
        return { start: from, size: Math.max(1, to - from) };
    }
    function mvGetSlotRect(index, count) {
        const screenW = screen.availWidth, screenH = screen.availHeight;
        const screenL = screen.availLeft || 0, screenT = screen.availTop || 0;
        const rows = mvGetLayoutRows(count);
        let offset = 0;
        for (let row = 0; row < rows.length; row++) {
            const cols = rows[row];
            if (index < offset + cols) {
                const col = index - offset;
                const x = mvSegmentRect(screenL, screenW, col, cols);
                const y = mvSegmentRect(screenT, screenH, row, rows.length);
                return { left: x.start, top: y.start, width: x.size, height: y.size };
            }
            offset += cols;
        }
        return { left: screenL, top: screenT, width: screenW, height: screenH };
    }
    // 포커스 모드: 메인은 화면 왼쪽 68%를 전체 높이로 크게, 나머지는 오른쪽
    // 세로 스트립에 균등하게 나눠 담는다.
    function mvGetFocusRects(count) {
        const screenW = screen.availWidth, screenH = screen.availHeight;
        const screenL = screen.availLeft || 0, screenT = screen.availTop || 0;
        if (count <= 1) return [{ left: screenL, top: screenT, width: screenW, height: screenH }];
        const mainW = Math.round(screenW * 0.68);
        const restW = screenW - mainW;
        const rects = [{ left: screenL, top: screenT, width: mainW, height: screenH }];
        const restCount = count - 1;
        for (let i = 0; i < restCount; i++) {
            const seg = mvSegmentRect(screenT, screenH, i, restCount);
            rects.push({ left: screenL + mainW, top: seg.start, width: restW, height: seg.size });
        }
        return rects;
    }

    // ===== 창 열기/닫기 =====
    // 일반 페이지(헤더/채팅 다 보임) 대신, 이전에 이미 새 창에서는 정상 동작을
    // 확인한 임베드 페이지(헤더 없음, showChat=false로 채팅도 없음)를 그대로
    // 새 창으로 연다 - iframe이 아니라 진짜 새 창(top-level)이라 프레임버스팅,
    // 로컬 네트워크 권한, 고화질 스트리머 문제 자체가 안 생기면서도 화면은
    // 깔끔한 영상만 나온다.
    function mvChannelUrl(soopId) {
        const params = new URLSearchParams({ showChat: 'false', autoPlay: 'true' });
        return `https://play.sooplive.com/${encodeURIComponent(soopId)}/embed?${params.toString()}`;
    }
    function mvOpenWindow(entry, rect) {
        const url = mvChannelUrl(entry.soopId);
        const name = `mv_${entry.soopId}`;
        const features = `width=${Math.round(rect.width)},height=${Math.round(rect.height)},left=${Math.round(rect.left)},top=${Math.round(rect.top)},menubar=no,toolbar=no,location=no,status=no,resizable=yes`;
        let win = mvWindowRefs[entry.soopId];
        if (win && !win.closed) {
            try {
                win.moveTo(Math.round(rect.left), Math.round(rect.top));
                win.resizeTo(Math.round(rect.width), Math.round(rect.height));
                win.focus();
            } catch (_) { }
            return win;
        }
        win = window.open(url, name, features);
        if (win) mvWindowRefs[entry.soopId] = win;
        return win;
    }
    // 같은 브라우저 세션(로그인/쿠키 공유)에서는 SOOP이 계정당 동시 접속 수를
    // 제한하는 것으로 보인다(참고한 유저스크립트도 동일 증상 대응 - MAX_CONTEXT_STREAMS=4).
    // 그래서 4개까지만 이 창에서 바로 열고, 나머지는 시크릿 창(다른 세션 취급)에서
    // 이어서 열도록 링크로 안내한다.
    const MV_CONTEXT_LIMIT = 4;

    function mvLaunchAll() {
        if (mvOrder.length === 0) return;
        let ordered;
        if (mvFocus) {
            const focusId = mvFocusEntryId();
            const focusIdx = mvOrder.findIndex(e => e.soopId === focusId);
            ordered = [mvOrder[focusIdx], ...mvOrder.filter((_, i) => i !== focusIdx)];
        } else {
            ordered = mvOrder;
        }
        const openCount = Math.min(ordered.length, MV_CONTEXT_LIMIT);
        // 타일 배치는 실제로 여는 개수(openCount) 기준으로 계산해야, 4명 넘는
        // 선택에서도 이번 창에 실제로 뜨는 4개가 화면을 꽉 채우게 나온다.
        const rects = mvFocus ? mvGetFocusRects(openCount) : Array.from({ length: openCount }, (_, i) => mvGetSlotRect(i, openCount));
        ordered.slice(0, openCount).forEach((entry, i) => mvOpenWindow(entry, rects[i]));
        mvRenderOverflowHint(ordered.slice(openCount));
        setTimeout(mvRenderOrderRow, 400);
    }
    function mvRenderOverflowHint(overflow) {
        const old = document.getElementById('mv-overflow-hint');
        if (old) old.remove();
        if (!overflow.length) return;
        const list = overflow.map(e => ({ id: e.soopId, name: e.name, isMember: e.isMember }));
        const params = new URLSearchParams({ list: JSON.stringify(list), theme: document.documentElement.getAttribute('data-theme') || 'light' });
        const url = `${location.origin}${location.pathname}?${params.toString()}`;
        const box = document.createElement('div');
        box.id = 'mv-overflow-hint';
        box.className = 'mv-overflow-hint';
        box.innerHTML = `
            <div>${overflow.length}명(${overflow.map(e => escapeHTML(e.name)).join(', ')})은 같은 세션에서 ${MV_CONTEXT_LIMIT}개 넘게 열면 SOOP 쪽에서 막힐 수 있어요. 아래 링크를 <b>시크릿 창</b>에서 열어 이어서 켜주세요.</div>
            <div class="mv-overflow-url-row">
                <input type="text" readonly value="${escapeHTML(url)}" onclick="this.select()">
                <button type="button" onclick="navigator.clipboard.writeText('${jsStrEscape(url)}').then(()=>alert('링크를 복사했어요. 시크릿 창에 붙여넣어 열어주세요.'))">복사</button>
            </div>`;
        document.querySelector('.mv-launch-bar').insertAdjacentElement('afterend', box);
    }
    function mvCloseAll() {
        Object.values(mvWindowRefs).forEach(win => {
            try { if (win && !win.closed) win.close(); } catch (_) { }
        });
        mvWindowRefs = {};
        mvRenderOrderRow();
    }
    // 열려있던 창을 사용자가 직접 닫은 경우도 목록에 "닫힘"으로 반영되도록 주기적으로 확인.
    setInterval(mvRenderOrderRow, 2000);

    // ===== 초기화 =====
    mvApplyTheme(localStorage.getItem('mv-theme') || 'light');
    mvInit();
    mvRenderOrderRow();
    mvLoadMembers();
</script>
</body>
</html>
