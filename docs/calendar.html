<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일 캘린더 일정표</title>
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- html2canvas 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==============================
            리뉴얼된 프리미엄 테마 시스템
        ============================== */
        :root {
            --bg-page: #f8fafc;        
            --bg-panel: #ffffff;       
            
            --text-heading: #0f172a;    
            --text-main: #334155;      
            --text-muted: #64748b;     
            
            --border-light: #e2e8f0;    
            --border-dark: #cbd5e1;    
            
            --primary: #3b82f6;        
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --sunday: #ef4444;
            --saturday: #3b82f6;
            
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            
            --shadow-panel: 0 4px 20px rgba(15, 23, 42, 0.04);
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-page); 
            color: var(--text-main); 
            font-family: 'Pretendard Variable', Pretendard, sans-serif; 
            padding: 30px 20px; 
            display: flex; 
            justify-content: center; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* 레이아웃 구조 (왼쪽 영역 최대 폭 960px로 설정) */
        .main-layout { display: flex; gap: 30px; width: 100%; max-width: 1370px; align-items: flex-start; justify-content: center; }
        .left-area { display: flex; flex-direction: column; width: 100%; max-width: 960px; }
        .sidebar { width: 380px; display: flex; flex-direction: column; gap: 24px; flex-shrink: 0; }
        
        @media(max-width: 1370px) { 
            .main-layout { flex-direction: column; align-items: center; } 
            .sidebar { width: 100%; max-width: 960px; }
        }

        /* 공통 패널 스타일 (부모 카드 섹션 최대 폭 960px 고정) */
        .box-panel {
            background: var(--bg-panel); 
            padding: 30px; 
            border-radius: var(--radius-xl); 
            box-shadow: var(--shadow-panel); 
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 960px;
        }
        .panel-title { 
            font-size: 18px; font-weight: 700; color: var(--text-heading); 
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }

        /* ==============================
            [1] 왼쪽 영역 (캡처 대상)
        ============================== */
        .capture-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 960px;
            background-color: var(--bg-page);
            padding: 10px;
            margin: -10px; 
            border-radius: var(--radius-xl);
        }

        /* 오늘의 일정 리스트 */
        .today-list { display: flex; flex-direction: column; gap: 12px; }
        .today-card {
            background: var(--bg-panel); border-radius: var(--radius-md); padding: 16px; 
            border: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 8px; 
            box-shadow: var(--shadow-card);
        }
        .no-schedule { font-size: 14px; color: var(--text-muted); text-align: center; padding: 20px 0; width: 100%; }

        /* 월간 캘린더 영역 개선 디자인 */
        .calendar-header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto 24px auto;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-light);
            width: 840px; /* 요일/날짜 그리드와 동일하게 840px 고정 */
        }
        
        /* 연월 텍스트 스타일 */
        .month-badge {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-heading);
            background: none;
            padding: 0;
            box-shadow: none;
            letter-spacing: normal;
        }

        .calendar-inner { width: 100%; overflow-x: auto; padding-bottom: 12px; }
        .calendar-inner::-webkit-scrollbar { height: 8px; }
        .calendar-inner::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .calendar-scroll-content { width: 840px; margin: 0 auto; }

        .weekdays { 
            display: grid; grid-template-columns: repeat(7, 120px); 
            text-align: center; font-size: 14px; font-weight: 600; 
            color: var(--text-muted); margin-bottom: 12px; 
        }
        .weekdays div:first-child { color: var(--sunday); } 
        .weekdays div:last-child { color: var(--saturday); } 

        .days-grid { 
            display: grid; grid-template-columns: repeat(7, 120px); 
            border-top: 1px solid var(--border-light); border-left: 1px solid var(--border-light); 
        }
        
        .day-cell {
            background: var(--bg-panel); width: 120px; 
            min-height: 130px; 
            display: flex; flex-direction: column; padding: 8px; cursor: pointer; 
            border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
            transition: background 0.15s ease;
        }
        .day-cell:hover { background-color: var(--primary-light); }
        .day-cell.other-month { background-color: #f8fafc; }
        .day-cell.other-month .day-number { color: #94a3b8; }

        .day-number { font-size: 15px; font-weight: 600; color: var(--text-heading); margin-bottom: 6px; line-height: 1.4; }
        .day-cell:nth-child(7n+1) .day-number { color: var(--sunday); }
        .day-cell:nth-child(7n) .day-number { color: var(--saturday); }

        .day-cell.today .day-number { width: max-content; position: relative; z-index: 1; }
        .day-cell.today .day-number::after {
            content: ''; position: absolute; bottom: 1px; left: -2px; right: -2px; height: 8px;
            background-color: rgba(59, 130, 246, 0.3); z-index: -1; border-radius: 2px;
        }

        /* 캘린더 내부 일정 셀 */
        .cell-event {
            border-radius: var(--radius-sm); 
            padding: 5px 6px; 
            margin-bottom: 4px; 
            font-weight: 500; 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            color: var(--text-heading); 
            box-shadow: var(--shadow-card);
        }
        .cell-top { display: flex; justify-content: space-between; align-items: center; font-weight: 600; white-space: nowrap; }
        .event-time { opacity: 0.8; font-size: 11px; }
        .event-person { font-weight: 700; font-size: 11px; margin-left: auto; text-align: right; }
        .event-desc { font-size: 12px; text-align: right; white-space: pre-wrap; word-break: break-all; margin-left: auto; line-height: 1.3; }


        /* ==============================
            [2] 사이드바 디자인
        ============================== */
        .sidebar .box-panel { padding: 24px; }
        
        .month-control-box { display: flex; gap: 8px; margin-bottom: 24px; align-items: center; }
        button { cursor: pointer; font-family: inherit; transition: all 0.2s; border: none; }
        
        .btn-outline { 
            flex: 1; background: var(--bg-panel); color: var(--text-main); 
            border: 1px solid var(--border-dark); padding: 10px 0; 
            border-radius: var(--radius-md); font-size: 13px; font-weight: 600; 
        }
        .btn-outline:hover { background-color: var(--bg-page); color: var(--text-heading); }
        
        .btn-action { 
            background: var(--success); color: white; padding: 10px 14px; 
            border-radius: var(--radius-md); font-size: 13px; font-weight: 600; flex-shrink: 0; 
        }
        .btn-action:hover { background: var(--success-hover); }
        .btn-primary { 
            width: 100%; padding: 14px; background: var(--primary); color: white; 
            border-radius: var(--radius-md); font-weight: 600; font-size: 14px; margin-top: 8px; 
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select, textarea {
            width: 100%; padding: 12px; background: var(--bg-page); 
            border: 1px solid var(--border-light); color: var(--text-heading); 
            border-radius: var(--radius-md); font-size: 14px; font-family: inherit; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { 
            outline: none; border-color: var(--primary); 
            background: var(--bg-panel); box-shadow: 0 0 0 3px var(--primary-light); 
        }
        textarea { resize: vertical; min-height: 80px; }

        .selected-list { display: flex; flex-direction: column; gap: 12px; }
        .selected-card {
            background: var(--bg-panel); border-radius: var(--radius-md); padding: 16px; 
            border: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 10px; 
            box-shadow: var(--shadow-card);
        }
        .card-main { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .card-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .card-time { color: var(--text-muted); font-weight: 600; font-size: 14px; } 
        .card-person { font-weight: 700; color: var(--text-heading); font-size: 14px; } 
        .card-desc { color: var(--text-main); font-size: 14px; flex-grow: 1; font-weight: 500; } 
        
        .btn-group { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
        .edit-btn { background: none; color: var(--primary); font-size: 13px; font-weight: 600; padding: 4px; }
        .edit-btn:hover { color: var(--primary-hover); text-decoration: underline; }
        .delete-btn { background: none; color: var(--danger); font-size: 13px; font-weight: 600; padding: 4px; }
        .delete-btn:hover { color: #dc2626; text-decoration: underline; }
    </style>
</head>
<body>

    <main class="main-layout">
        <section class="left-area">
            <div id="calendarCaptureArea" class="capture-wrapper">
                
                <!-- 1. 오늘의 일정 -->
                <div class="box-panel">
                    <div class="panel-title">
                        <span>⚡</span> 오늘의 일정
                    </div>
                    <div class="today-list" id="todayList"></div>
                </div>

                <!-- 2. 월간 캘린더 -->
                <div class="box-panel">
                    <div class="calendar-header-area">
                        <div class="panel-title" style="margin-bottom: 0;">
                            <span>📅</span> 이달의 일정
                        </div>
                        <div id="monthTitle" class="month-badge"></div>
                    </div>
                    <div class="calendar-inner" id="calendarInner">
                        <div class="calendar-scroll-content">
                            <div class="weekdays">
                                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                            </div>
                            <div class="days-grid" id="daysGrid"></div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <aside class="sidebar">
            <div class="box-panel">
                <div class="panel-title">🔑 관리자 연동</div>
                <div class="form-row" style="margin-bottom: 0;">
                    <input type="password" id="githubToken" placeholder="GitHub 토큰 입력">
                    <button class="btn-action" onclick="saveTokenLocally()" style="background-color: var(--text-heading);">연동</button>
                </div>
            </div>

            <div class="box-panel">
                <div class="month-control-box">
                    <button class="btn-outline" onclick="changeMonth(-1)">◀ 이전달</button>
                    <button class="btn-outline" onclick="changeMonth(1)">다음달 ▶</button>
                    <button class="btn-action" onclick="captureCalendar()">📸 캡처 적용</button>
                </div>

                <div class="panel-title" id="formTitle" style="margin-top: 24px;">➕ [<span id="selectedDateText">날짜선택</span>] 일정 추가</div>
                <input type="hidden" id="editScheduleId" value="">
                
                <div class="form-row">
                    <input type="text" id="inputTime" placeholder="시간 (예: 19:00)">
                    <input type="text" id="inputPerson" placeholder="타이틀 (예: 미팅)">
                </div>
                <div class="form-row">
                    <textarea id="inputDesc" placeholder="간략내용 (줄바꿈 가능)"></textarea>
                    <select id="inputColor">
                        <option value="#fee2e2">🔴 빨강</option>
                        <option value="#ffedd5">🟠 주황</option>
                        <option value="#fef3c7">🟡 노랑</option>
                        <option value="#d1fae5" selected>🟢 초록</option>
                        <option value="#dbeafe">🔵 파랑</option>
                        <option value="#e0e7ff">🟤 남색</option>
                        <option value="#f3e8ff">🟣 보라</option>
                        <option value="#f1f5f9">⚪ 회색</option>
                    </select>
                </div>
                <div class="form-row" style="margin-bottom: 0;">
                    <input type="text" id="inputDetail" placeholder="상세내용 (오늘의 일정에만 표시)">
                </div>
                <button class="btn-primary" id="submitBtn" onclick="addOrUpdateSchedule()">일정 등록하기</button>
            </div>

            <div class="box-panel">
                <div class="panel-title">📅 선택한 날짜 일정</div>
                <div class="selected-list" id="selectedDateList"></div>
            </div>
        </aside>
    </main>

    <script>
        let currentDate = new Date();
        let selectedDateStr = "";
        let schedules = {}; 
        
        const REPO_OWNER = 'ststats';
        const REPO_NAME = 'staruniv';
        const DATA_FILE_PATH = 'docs/data/calendar.json';
        const IMG_FILE_PATH = 'docs/data/calendar.png';
        let dataFileSha = ''; 

        const saveTokenLocally = () => {
            const token = document.getElementById('githubToken').value.trim();
            if(!token) return alert('토큰을 입력해주세요.');
            localStorage.setItem('gh_token', token);
            alert('토큰이 임시 저장되었습니다.');
            loadDataFromGithub();
        };

        const loadDataFromGithub = async () => {
            const token = document.getElementById('githubToken').value;
            if(!token) return;

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`, {
                    headers: { Authorization: `token ${token}` }
                });
                if(res.ok) {
                    const data = await res.json();
                    const decoded = decodeURIComponent(escape(atob(data.content))); 
                    schedules = JSON.parse(decoded);
                    dataFileSha = data.sha;
                    renderCalendar();
                } else if (res.status === 404) {
                    renderCalendar();
                } else {
                    alert("데이터를 불러오지 못했습니다. 토큰 권한을 확인하세요.");
                }
            } catch (e) {
                console.error(e);
            }
        };

        const saveData = async () => {
            const token = document.getElementById('githubToken').value;
            if(!token) return alert('GitHub 토큰을 입력하고 연동해주세요!');

            try {
                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(schedules)))); 
                const payload = { message: '일정 데이터 업데이트', content: contentBase64 };
                if (dataFileSha) payload.sha = dataFileSha;

                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`, {
                    method: 'PUT',
                    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const data = await res.json();
                    dataFileSha = data.content.sha; 
                } else {
                    alert('데이터 저장 실패!');
                }
            } catch (e) {
                console.error(e);
            }
        };

        const captureCalendar = () => {
            const token = document.getElementById('githubToken').value;
            if(!token) return alert('GitHub 토큰을 연동해주세요!');

            const target = document.getElementById('calendarCaptureArea');
            const calInner = document.getElementById('calendarInner');
            
            const originalWidth = target.style.width;
            const originalCalOverflow = calInner.style.overflow;
            
            target.style.width = '960px'; 
            calInner.style.overflow = 'visible'; 

            html2canvas(target, { 
                scale: 2, 
                useCORS: true,
                windowWidth: 1370,
                backgroundColor: "#f8fafc" 
            }).then(async canvas => {
                target.style.width = originalWidth;
                calInner.style.overflow = originalCalOverflow;

                const base64Image = canvas.toDataURL('image/png').split(',')[1]; 
                
                try {
                    let imgSha = '';
                    const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMG_FILE_PATH}`, {
                        headers: { Authorization: `token ${token}` }
                    });
                    if(getRes.ok) {
                        const data = await getRes.json();
                        imgSha = data.sha;
                    }

                    const payload = { message: '캘린더 이미지 갱신', content: base64Image };
                    if (imgSha) payload.sha = imgSha;

                    const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMG_FILE_PATH}`, {
                        method: 'PUT',
                        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (putRes.ok) {
                        alert('✅ 이미지가 깃허브에 완벽하게 갱신되었습니다!');
                    } else {
                        alert('이미지 갱신 실패!');
                    }
                } catch(e) {
                    console.error(e);
                    alert("캡처 중 오류가 발생했습니다.");
                }
            });
        };

        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        const getFormatDate = (year, month, day) => {
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };

        const renderCalendar = () => {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = "";

            const actualToday = new Date();
            const todayStr = getFormatDate(actualToday.getFullYear(), actualToday.getMonth() + 1, actualToday.getDate());

            for (let i = firstDayIndex; i > 0; i--) {
                daysGrid.insertAdjacentHTML('beforeend', `<div class="day-cell other-month"><span class="day-number">${prevLastDay - i + 1}</span></div>`);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateStr = getFormatDate(year, month + 1, i);
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-cell';
                
                if (dateStr === todayStr) dayDiv.classList.add('today');
                
                let dayHTML = `<span class="day-number">${i}</span>`;

                if (schedules[dateStr] && schedules[dateStr].length > 0) {
                    schedules[dateStr].forEach(item => {
                        const timeHtml = item.time ? `<span class="event-time">${escapeHTML(item.time)}</span>` : '';
                        const personText = item.person ? `<span class="event-person">${escapeHTML(item.person)}</span>` : '';
                        
                        dayHTML += `
                            <div class="cell-event" style="background-color: ${item.color || '#eff6ff'};">
                                <div class="cell-top">${timeHtml}${personText}</div>
                                <div class="event-desc">${escapeHTML(item.desc)}</div>
                            </div>
                        `;
                    });
                }

                dayDiv.innerHTML = dayHTML;
                dayDiv.onclick = () => selectDate(dateStr);
                daysGrid.appendChild(dayDiv);
            }

            const totalCellsCount = firstDayIndex + lastDay;
            const nextDaysCount = totalCellsCount % 7 === 0 ? 0 : 7 - (totalCellsCount % 7);
            for (let i = 1; i <= nextDaysCount; i++) {
                daysGrid.insertAdjacentHTML('beforeend', `<div class="day-cell other-month"><span class="day-number">${i}</span></div>`);
            }

            renderTodaySchedules();
            renderSelectedDateSchedules();
        };

        const changeMonth = (direction) => {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        };

        const selectDate = (dateStr) => {
            selectedDateStr = dateStr;
            document.getElementById('selectedDateText').innerText = dateStr;
            cancelEdit();
            renderSelectedDateSchedules();
        };

        const addOrUpdateSchedule = () => {
            if (!selectedDateStr) return alert('캘린더에서 날짜를 선택해주세요!');

            const time = document.getElementById('inputTime').value.trim();
            const person = document.getElementById('inputPerson').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();
            const detail = document.getElementById('inputDetail').value.trim();
            const color = document.getElementById('inputColor').value;
            const editId = document.getElementById('editScheduleId').value;

            if (!desc && !time && !person) return alert('입력된 내용이 없습니다.');

            if (!schedules[selectedDateStr]) schedules[selectedDateStr] = [];

            if (editId) {
                const item = schedules[selectedDateStr].find(i => i.id == editId);
                if (item) Object.assign(item, { time, person, desc, detail, color });
                cancelEdit();
            } else {
                schedules[selectedDateStr].push({ id: Date.now(), time, person, desc, detail, color });
            }

            renderCalendar(); 
            saveData();       
            clearForm();
        };

        const enterEditMode = (dateStr, id) => {
            const item = schedules[dateStr]?.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editScheduleId').value = item.id;
            document.getElementById('inputTime').value = item.time || '';
            document.getElementById('inputPerson').value = item.person || '';
            document.getElementById('inputDesc').value = item.desc || '';
            document.getElementById('inputDetail').value = item.detail || '';
            document.getElementById('inputColor').value = item.color || '#d1fae5';

            document.getElementById('formTitle').innerHTML = `✏️ [<span id="selectedDateText">${dateStr}</span>] 일정 수정`;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = '수정 완료하기';
            submitBtn.style.backgroundColor = 'var(--success)';
        };

        const cancelEdit = () => {
            clearForm();
            document.getElementById('formTitle').innerHTML = `➕ [<span id="selectedDateText">${selectedDateStr || '날짜선택'}</span>] 일정 추가`;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = '일정 등록하기';
            submitBtn.style.backgroundColor = 'var(--primary)';
        };

        const clearForm = () => {
            document.getElementById('editScheduleId').value = '';
            document.getElementById('inputTime').value = '';
            document.getElementById('inputPerson').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputDetail').value = '';
            document.getElementById('inputColor').value = '#d1fae5';
        };

        const deleteSchedule = (dateStr, id) => {
            if (!confirm("일정을 삭제하시겠습니까?")) return;
            if (document.getElementById('editScheduleId').value == id) cancelEdit();

            schedules[dateStr] = schedules[dateStr].filter(item => item.id !== id);
            if (schedules[dateStr].length === 0) delete schedules[dateStr];
            
            renderCalendar();
            saveData();
        };

        const renderTodaySchedules = () => {
            const container = document.getElementById('todayList');
            const today = new Date();
            const todayStr = getFormatDate(today.getFullYear(), today.getMonth() + 1, today.getDate());

            const todayItems = (schedules[todayStr] || []).slice();
            todayItems.sort((a, b) => (a.time || "").localeCompare(b.time || ""));

            if (todayItems.length === 0) {
                container.innerHTML = `<div class="no-schedule">오늘 등록된 일정이 없습니다.</div>`;
                return;
            }
            
            container.innerHTML = todayItems.map(item => {
                const timeHtml = item.time ? `<span class="card-time">${escapeHTML(item.time)}</span>` : '';
                const personHtml = item.person ? `<span class="card-person">${escapeHTML(item.person)}</span>` : '';
                const detailHtml = item.detail ? `<div style="color: var(--text-muted); font-size: 13px; padding-left: 22px;">↳ ${escapeHTML(item.detail)}</div>` : '';

                return `
                    <div class="today-card">
                        <div class="card-main">
                            <div class="card-dot" style="background-color: ${item.color || '#eff6ff'};"></div>
                            ${timeHtml} ${personHtml}
                            <span class="card-desc">${escapeHTML(item.desc)}</span>
                        </div>
                        ${detailHtml}
                    </div>
                `;
            }).join('');
        };

        const renderSelectedDateSchedules = () => {
            const container = document.getElementById('selectedDateList');
            if (!selectedDateStr) {
                container.innerHTML = `<div class="no-schedule">날짜를 클릭하세요.</div>`;
                return;
            }

            const daySchedules = schedules[selectedDateStr] || [];
            if (daySchedules.length === 0) {
                container.innerHTML = `<div class="no-schedule">등록된 일정이 없습니다.</div>`;
                return;
            }

            container.innerHTML = daySchedules.map(item => {
                const timeHtml = item.time ? `<span class="card-time">${escapeHTML(item.time)}</span>` : '';
                const personHtml = item.person ? `<span class="card-person">${escapeHTML(item.person)}</span>` : '';

                return `
                    <div class="selected-card">
                        <div class="card-main">
                            <div class="card-dot" style="background-color: ${item.color || '#eff6ff'};"></div>
                            ${timeHtml} ${personHtml}
                            <span class="card-desc">${escapeHTML(item.desc)}</span>
                            <div class="btn-group">
                                <button class="edit-btn" onclick="enterEditMode('${selectedDateStr}', ${item.id})">수정</button>
                                <button class="delete-btn" onclick="deleteSchedule('${selectedDateStr}', ${item.id})">삭제</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        const init = () => {
            const today = new Date();
            const todayStr = getFormatDate(today.getFullYear(), today.getMonth() + 1, today.getDate());
            selectDate(todayStr);

            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) {
                document.getElementById('githubToken').value = savedToken;
                loadDataFromGithub(); 
            } else {
                renderCalendar(); 
            }
        };

        init();
    </script>
</body>
</html>
