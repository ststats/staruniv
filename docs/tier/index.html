<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타대학 대시보드 - 스타유니브</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/redesign.css">
</head>
<body class="dark-theme">
  <!-- 상단 네비게이션 헤더 -->
  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span class="logo-txt-white">STAR</span><span class="logo-txt-blue">UNIV</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">홈</a>
        <a href="/members/" class="nav-link">멤버</a>
        <a href="/schedule/" class="nav-link">일정</a>
        <a href="/records/" class="nav-link">전적</a>
        <a href="/tier/" class="nav-link">티어표</a>
        <a href="/stats/" class="nav-link">통계</a>
        <a href="/tools/" class="nav-link">도구</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    
<div class="page-container tier-page">
  <div class="section-header-bar">
    <div class="header-title-group">
      <h2>스타크래프트 티어표</h2>
    </div>
    <!-- 25번: 티어표에서도 검은색 박스로 인원수 오른쪽 정렬(빨간색 박스 바로 왼쪽) -->
    <div class="header-badge-group">
      <span class="badge-count-black" id="tierTotalCount">총 0명</span>
      <span class="badge-live-red" id="tierLiveCount">0명 방송중</span>
    </div>
  </div>

  <!-- 22번: 모바일에서 상단 sticky 고정되는 필터 바 -->
  <div class="tier-filter-bar">
    <!-- 26번: '방송중'이 기본 선택 -->
    <button class="filter-btn is-active" data-filter="onair">방송중</button>
    <button class="filter-btn" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="terran">테란</button>
    <button class="filter-btn" data-filter="zerg">저그</button>
    <button class="filter-btn" data-filter="protoss">프로토스</button>
  </div>

  <!-- 티어별 카드 목록 (24번: 종족별 좌측 선, 30번: 썸네일 밑 얇은 선 제거) -->
  <div class="tier-sections-container" id="tierSections">
    <!-- page-tier.js 동적 렌더링 -->
  </div>
</div>

  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 StarUniv. 캄몬스타즈 및 스타크래프트 대학 대전 전적/일정 대시보드.</p>
    </div>
  </footer>

  <script src="/core.js"></script>
  
<script src="/assets/page-tier.js"></script>

</body>
</html>
