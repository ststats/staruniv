<main>

<section id="page-tier" class="page-section active">
    <div class="page-header">
        <div class="page-header-main" data-label="STARCRAFT TIERS">
            <h1 class="page-header-title">티어표</h1><p class="page-header-subtitle" id="tier-subtitle">스타대학 티어표입니다. 출처 :
                <a href="https://www.fmkorea.com/3844139388" target="_blank" rel="noopener">스타CK 밸런스 티어표 <span class="i-arrow" aria-hidden="true"></span></a></p>
        </div>
        <div class="sub-tabs tab-scroll" role="tablist">
            <div class="sub-tab active" id="tab-tier-list" role="tab" tabindex="0" aria-selected="true" onclick="switchTierView('list')">티어표</div>
            <div class="sub-tab" id="tab-tier-h2h" role="tab" tabindex="0" aria-selected="false" onclick="switchTierView('h2h')">상대전적</div>
            <div class="sub-tab" id="tab-tier-analysis" role="tab" tabindex="0" aria-selected="false" onclick="switchTierView('analysis')">분석</div>
        </div>
    </div>
    <div class="container"><div id="view-tier-list"><div class="selection-layout">
            <nav class="tier-bar" id="tier-bar" aria-label="티어 바로가기">
                <div class="tier-bar-tools">
                    <div class="bar-scope tier-scope" id="tier-scope" role="group" aria-label="보기 전환"></div>
                </div>
                <div class="tier-bar-list scroll-area" id="tier-bar-list"></div>
            </nav>

            <div class="selection-content">
                <div id="tier-root">
                    <div class="tier-empty">불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>
    <div id="view-tier-h2h" class="d-none">
        <div class="section-title" data-en="HEAD TO HEAD">
            <span class="section-title-label">상대전적</span>
            <span class="h2h-updated" id="h2h-updated"></span>
        </div>
        <div class="h2h-topbar">
            <div class="filter-nav h2h-period tab-scroll" id="h2h-period" role="group" aria-label="기간 선택"></div>
        </div>
        <div class="h2h-pick" id="h2h-pick">
            <div class="h2h-slot" id="h2h-slot-0"></div>
            <div class="h2h-vs" aria-hidden="true">VS</div>
            <div class="h2h-slot" id="h2h-slot-1"></div>
        </div>
        <div id="h2h-result"><div class="h2h-empty">불러오는 중...</div></div>
    </div>

    <div id="view-tier-analysis" class="d-none">
        <div class="section-title" data-en="ANALYSIS">
            <span class="section-title-label">분석</span>
            <span class="h2h-updated" id="analysis-updated"></span>
        </div>
        <div id="analysis-period"></div>
        <div class="h2h-slot-inner" id="analysis-search">
            <label class="h2h-slot-label" for="analysis-search-input">선수 검색</label>
            <input type="search" class="h2h-input" id="analysis-search-input" autocomplete="off"
                   placeholder="이름 또는 대학으로 검색" oninput="analysisOnQuery(this.value)">
        </div>
        <div id="analysis-body"><div class="h2h-empty">불러오는 중...</div></div>
    </div>
    </div>
</section>

</main>
