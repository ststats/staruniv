<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타대학 대시보드 - 스타유니브</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/redesign.css">
</head>
<body class="dark-theme">
  <!-- 상단 네비게이션 헤더 -->
  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span class="logo-txt-white">STAR</span><span class="logo-txt-blue">UNIV</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">홈</a>
        <a href="/members/" class="nav-link">멤버</a>
        <a href="/schedule/" class="nav-link">일정</a>
        <a href="/records/" class="nav-link">전적</a>
        <a href="/tier/" class="nav-link">티어표</a>
        <a href="/stats/" class="nav-link">통계</a>
        <a href="/tools/" class="nav-link">도구</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    
<div class="page-container records-page">
  <div class="section-header-bar">
    <div class="header-title-group">
      <h2>경기 전적 및 기록</h2>
    </div>
  </div>

  <div class="records-layout">
    <!-- 21번: 스크롤 추종 sticky 사이드바 -->
    <aside class="records-user-sidebar">
      <div class="sidebar-block cut-box">
        <h4 class="sidebar-title">크루별 전적 필터</h4>
        <ul class="crew-filter-list" id="crewFilterList">
          <li class="filter-item is-active" data-crew="all">전체</li>
          <li class="filter-item" data-crew="calmmon">캄몬스타즈</li>
          <li class="filter-item" data-crew="yb">YB</li>
          <li class="filter-item" data-crew="jsa">JSA</li>
          <li class="filter-item" data-crew="bgm">BGM</li>
        </ul>
      </div>
    </aside>

    <main class="records-main-content">
      <div class="records-list-wrapper" id="recordsList">
        <!-- 최근 경기 매치 목록 -->
        <div class="match-card cut-box">
          <div class="match-card-header">
            <span class="match-date">2026.09.14</span>
            <span class="match-badge badge-done">경기 종료</span>
          </div>
          <div class="match-card-teams">
            <div class="team team-a">
              <span class="team-name">캄몬스타즈</span>
              <span class="team-score win">4</span>
            </div>
            <span class="vs">VS</span>
            <div class="team team-b">
              <span class="team-score">3</span>
              <span class="team-name">YB</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 StarUniv. 캄몬스타즈 및 스타크래프트 대학 대전 전적/일정 대시보드.</p>
    </div>
  </footer>

  <script src="/core.js"></script>
  
<script src="/page-records.js"></script>

</body>
</html>
