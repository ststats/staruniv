<body><header class="top-navbar">

        <button type="button" class="nav-drawer-btn" id="navDrawerBtn" aria-label="메뉴 열기"
                aria-expanded="false" aria-controls="mainMenu" onclick="toggleMainMenu()">
            <span></span><span></span><span></span>

            <button type="button" data-theme-choice="dark" aria-label="다크 모드" onclick="setTheme('dark')">◐</button>

<main>

<!-- 시너지표: ststats(외부) 데이터에서 우리 로스터만 뽑아 방송 활동 랭킹 표시 -->
<section id="page-stats" class="page-section active container">
    <div class="page-header page-header-with-stats">
        <div class="page-header-main">
            <h1 class="page-header-title">방송통계</h1>
            <p class="page-header-subtitle">캄몬스타즈 멤버들의 이번 달 방송 통계입니다.</p>
        </div>
        <div class="page-header-stats">
            <div class="head-stat head-stat-wide">
                <div class="head-stat-label">UPDATED</div>
                <div class="head-stat-value head-stat-time" id="synergy-updated">-</div>
            </div>
        </div>
    </div>
    <hr class="page-header-divider tight">
    <div class="sub-tabs tab-scroll" id="synergy-metric-filter" role="tablist">
        <div class="sub-tab active" data-metric="balloons" role="tab" tabindex="0" aria-selected="true" onclick="setSynergyMetric('balloons')">별풍선</div>
        <div class="sub-tab" data-metric="broadcast_seconds" role="tab" tabindex="0" aria-selected="false" onclick="setSynergyMetric('broadcast_seconds')">방송시간</div>
        <div class="sub-tab" data-metric="cumulative_viewers" role="tab" tabindex="0" aria-selected="false" onclick="setSynergyMetric('cumulative_viewers')">누적시청자</div>
        <div class="sub-tab" data-metric="sponsor" role="tab" tabindex="0" aria-selected="false" onclick="setSynergyMetric('sponsor')">스폰전적</div>
    </div>
    <div class="section-title" data-en="SUMMARY">전체 요약</div>
    <div class="row g-3 mb-block" id="synergy-summary">
        <div class="col-md-4"><div class="clean-card head-plate">
            <div class="head-plate-label" id="synergy-sum-label">TOTAL</div>
            <div class="head-plate-value" id="synergy-sum-total">-</div>
            <div class="head-plate-sub">이번 달 합계</div>
        </div></div>
        <div class="col-md-4"><div class="clean-card head-plate">
            <div class="head-plate-label">TOP</div>
            <div class="head-plate-value" id="synergy-sum-top">-</div>
            <div class="head-plate-sub" id="synergy-sum-top-name">1위</div>
        </div></div>
        <div class="col-md-4"><div class="clean-card head-plate">
            <div class="head-plate-label">MEMBERS</div>
            <div class="head-plate-value" id="synergy-sum-count">-</div>
            <div class="head-plate-sub">집계 인원</div>
        </div></div>
    </div>
    <div class="row gap-block mb-block">
        <div class="col-md-6">
            <div class="section-title" data-en="MALE">남자 멤버</div>
            <div class="clean-card p-0 overflow-hidden">
                <div class="table-responsive scroll-area">
                    <table class="table table-borderless table-hover mb-0 text-center stat-table table-fixed minw-320">
                        <thead>
                            <tr>
                                <th scope="col" class="text-center colw-20 text-nowrap">순위</th>
                                <th scope="col" class="text-center colw-40 text-nowrap">멤버</th>
                                <th scope="col" class="text-center synergy-metric-label colw-40 text-nowrap">별풍선</th>
                            </tr>
                        </thead>
                        <tbody id="synergy-tbody-male">
                            <tr><td colspan="3" class="text-center text-muted py-4">불러오는 중...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="section-title" data-en="FEMALE">여자 멤버</div>
            <div class="clean-card p-0 overflow-hidden">
                <div class="table-responsive scroll-area">
                    <table class="table table-borderless table-hover mb-0 text-center stat-table table-fixed minw-320">
                        <thead>
                            <tr>
                                <th scope="col" class="text-center colw-20 text-nowrap">순위</th>
                                <th scope="col" class="text-center colw-40 text-nowrap">멤버</th>
                                <th scope="col" class="text-center synergy-metric-label colw-40 text-nowrap">별풍선</th>
                            </tr>
                        </thead>
                        <tbody id="synergy-tbody-female">
                            <tr><td colspan="3" class="text-center text-muted py-4">불러오는 중...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</section>

</main>
