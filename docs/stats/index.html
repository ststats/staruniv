<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타대학 대시보드 - 스타유니브</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/redesign.css">
</head>
<body class="dark-theme">
  <!-- 상단 네비게이션 헤더 -->
  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span class="logo-txt-white">STAR</span><span class="logo-txt-blue">UNIV</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">홈</a>
        <a href="/members/" class="nav-link">멤버</a>
        <a href="/schedule/" class="nav-link">일정</a>
        <a href="/records/" class="nav-link">전적</a>
        <a href="/tier/" class="nav-link">티어표</a>
        <a href="/stats/" class="nav-link">통계</a>
        <a href="/tools/" class="nav-link">도구</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    
<div class="page-container stats-page">
  <!-- 27번: 방송통계 요약 카드들 위에 '전체 요약' 타이틀 추가 -->
  <div class="stats-summary-header">
    <div class="section-header-bar">
      <div class="header-title-group">
        <h2 class="title-ko">전체 요약</h2>
        <span class="title-en" style="font-size: 13px; color: var(--text-muted); margin-left: 8px;">OVERALL SUMMARY</span>
      </div>
    </div>
  </div>

  <div class="stats-summary-cards-grid" id="statsSummaryGrid">
    <div class="stat-card cut-box">
      <span class="stat-label">총 경기수</span>
      <span class="stat-value" id="statTotalMatches">-</span>
    </div>
    <div class="stat-card cut-box">
      <span class="stat-label">최다 승리 크루</span>
      <span class="stat-value" id="statTopCrew">-</span>
    </div>
    <div class="stat-card cut-box">
      <span class="stat-label">승률 1위 플레이어</span>
      <span class="stat-value" id="statTopPlayer">-</span>
    </div>
  </div>

  <div class="stats-detail-section">
    <div class="section-header-bar" style="margin-top: 24px;">
      <h3>상세 전적 및 승률</h3>
    </div>
    <div class="stats-table-wrapper cut-box" id="statsTableContainer">
      <!-- page-stats.js 동적 렌더링 -->
    </div>
  </div>
</div>

  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 StarUniv. 캄몬스타즈 및 스타크래프트 대학 대전 전적/일정 대시보드.</p>
    </div>
  </footer>

  <script src="/core.js"></script>
  
<script src="/assets/page-stats.js"></script>

</body>
</html>
