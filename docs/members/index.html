<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타대학 대시보드 - 스타유니브</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/redesign.css">
</head>
<body class="dark-theme">
  <!-- 상단 네비게이션 헤더 -->
  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span class="logo-txt-white">STAR</span><span class="logo-txt-blue">UNIV</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">홈</a>
        <a href="/members/" class="nav-link">멤버</a>
        <a href="/schedule/" class="nav-link">일정</a>
        <a href="/records/" class="nav-link">전적</a>
        <a href="/tier/" class="nav-link">티어표</a>
        <a href="/stats/" class="nav-link">통계</a>
        <a href="/tools/" class="nav-link">도구</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    
<div class="page-container members-page">
  <div class="section-header-bar">
    <div class="header-title-group">
      <h2>크루 / 멤버 현황</h2>
    </div>
    <!-- 25번: 검은색 박스로 인원수 오른쪽 정렬 -->
    <div class="header-badge-group">
      <span class="badge-count-black" id="memberTotalCount">총 0명</span>
      <span class="badge-live-red" id="memberLiveCount">0명 방송중</span>
    </div>
  </div>

  <div class="members-layout">
    <!-- 21번: 스크롤 따라 움직이는 sticky 사이드바 -->
    <aside class="member-notice-sidebar">
      <div class="sidebar-block cut-box">
        <h4 class="sidebar-title">멤버 공지</h4>
        <!-- 20번: 오른쪽 리스트들 이어진 것들 개별 모서리 절삭 제거 -->
        <ul class="member-notice-list" id="memberNoticeList">
          <li class="notice-item">공지를 불러오는 중입니다...</li>
        </ul>
      </div>
    </aside>

    <!-- 멤버 카드 그리드 (31번: 라이브 표시 좌상단 이동) -->
    <main class="members-main-content">
      <div class="member-cards-grid" id="memberCardsGrid">
        <!-- page-members.js 동적 렌더링 -->
      </div>
    </main>
  </div>
</div>

  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 StarUniv. 캄몬스타즈 및 스타크래프트 대학 대전 전적/일정 대시보드.</p>
    </div>
  </footer>

  <script src="/core.js"></script>
  
<script src="/assets/page-members.js"></script>

</body>
</html>
