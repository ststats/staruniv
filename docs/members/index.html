<html lang="ko">
<head>
    <meta charset="UTF-8">
    <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="캄몬스타즈 멤버들의 현황과 소식입니다.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="스타대학">
    <meta property="og:title" content="멤버 | 스타대학">
    <meta property="og:description" content="캄몬스타즈 멤버들의 현황과 소식입니다.">
    <link rel="canonical" href="https://ststats.github.io/staruniv/members/">
    <meta property="og:url" content="https://ststats.github.io/staruniv/members/">
    <meta property="og:image" content="https://ststats.github.io/staruniv/images/%EC%BA%84%EB%AA%AC%EC%8A%A4%ED%83%80%EC%A6%88.webp">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/webp" href="images/파비콘.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=c389b6212b">
    <link rel="stylesheet" href="redesign.css?v=7f65b6631e">
    <meta name="site-data-version" content="8ed9592a5a">
</head>
<body><header class="top-navbar">
    <div class="navbar-inner container">
        <a class="logo" href="./" aria-label="스타대학 홈"><span class="logo-title"><span class="logo-black">스타</span><span class="logo-accent">대학</span></span><span class="logo-sub">CALMMON<br>STARZ</span></a>
        <button type="button" class="nav-drawer-btn" id="navDrawerBtn" aria-label="메뉴 열기"
                aria-expanded="false" aria-controls="mainMenu" onclick="toggleMainMenu()">
            <span></span><span></span><span></span>
        </button>
        <nav class="nav-menu tab-scroll" id="mainMenu" aria-label="주 메뉴">
            <a class="nav-item" href="schedule/" data-page="schedule">일정</a>
            <a class="nav-item active" href="members/" data-page="members" aria-current="page">멤버</a>
            <a class="nav-item" href="records/" data-page="records">전적</a>
            <a class="nav-item" href="stats/" data-page="stats">방송통계</a>
            <a class="nav-item" href="tier/" data-page="tier">티어표</a>
            <a class="nav-item" href="tools/" data-page="tools">도구</a>
        </nav>
        <div class="theme-toggle" role="group" aria-label="테마 선택">
            <button type="button" data-theme-choice="light" aria-label="라이트 모드" onclick="setTheme('light')">☀</button>
            <button type="button" data-theme-choice="dark" aria-label="다크 모드" onclick="setTheme('dark')">◐</button>
        </div>
    </div>
</header>

<main>

<section id="page-members" class="page-section active container">
    <div class="page-header page-header-with-stats">
        <div class="page-header-main">
            <h1 class="page-header-title">멤버</h1>
            <p class="page-header-subtitle">캄몬스타즈 멤버들의 현황과 소식입니다.</p>
        </div>
        <div class="page-header-stats">
            <div class="head-stat head-stat-ink">
                <div class="head-stat-label">ACTIVE</div>
                <div class="head-stat-value" id="member-count-active">-</div>
            </div>
            <div class="head-stat">
                <div class="head-stat-label">ON AIR</div>
                <div class="head-stat-value head-stat-live" id="member-count-live">-</div>
            </div>
        </div>
    </div>
    <hr class="page-header-divider tight">
    <div class="sub-tabs tab-scroll" role="tablist">
        <div class="sub-tab active" id="tab-member-status" role="tab" tabindex="0" aria-selected="true" onclick="switchMemberView('status')">현황</div>
        <div class="sub-tab" id="tab-member-news" role="tab" tabindex="0" aria-selected="false" onclick="switchMemberView('news')">공지</div>
    </div>

    <div id="view-member-status">
        <div id="members-groups"></div>
    </div>

    <div id="view-member-news" class="d-none">
        <div class="selection-layout">
            <div class="avatar-selector-scroll scroll-area">
                <div class="avatar-selector-list" id="news-avatar-list"></div>
            </div>
            <div class="selection-content">
                <div class="section-title" id="news-content-title" data-en="NOTICE">전체 공지</div>

                <div id="news-feed-content" aria-live="polite">
                    <div class="text-center text-muted py-4 fs-body">불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>
</section>

</main>


<div class="modal fade" id="memberProfileModal" tabindex="-1" aria-labelledby="memberProfileTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-w-400">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="memberProfileTitle">프로필</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body profile-modal-body">
                <div class="d-flex align-items-center mb-3">
                    <div class="profile-avatar" id="mp-avatar">👤</div>
                    <div>
                        <div class="fw-bold profile-modal-name" id="mp-name">이름</div>
                        <div class="d-flex gap-2 flex-wrap">
                            <span class="tag-badge" id="mp-role-badge">직책</span>
                            <span class="tag-badge" id="mp-tier-badge">티어</span>
                            <span class="tag-badge" id="mp-race-badge">종족</span>
                        </div>
                    </div>
                </div>
                <table class="table table-borderless mb-0 fs-body profile-info-table">
                    <tbody id="mp-info-body"></tbody>
                </table>

                <div class="mt-3">
                    <div class="section-title-sm">
                        이번 달 방송 활동
                        <span class="text-secondary title-count" id="mp-activity-status">데이터 준비중</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">별풍선</div>
                                <div class="fw-bold fs-body" id="mp-balloons">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">방송시간</div>
                                <div class="fw-bold fs-body" id="mp-broadcast-hours">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">누적시청자</div>
                                <div class="fw-bold fs-body" id="mp-viewers">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">스폰전적</div>
                                <div class="fw-bold fs-body" id="mp-sponsor-record">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="purify.min.js?v=2bdf4e9eee"></script>
<script src="core.js?v=1c731ef4ad"></script>
<script src="soop.js?v=68531e35cd"></script>
<script src="page-members.js?v=babce13f5c"></script>

</body>
</html>
