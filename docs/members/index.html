<body><header class="top-navbar">
    <div class="navbar-inner container">
        <div class="logo"><span class="logo-black">스타</span><span class="logo-accent">대학</span></div>
        <nav class="nav-menu" id="mainMenu" aria-label="주 메뉴">
            <a class="nav-item" href="./" data-page="home">홈</a>
            <a class="nav-item" href="schedule/" data-page="schedule">일정</a>
            <a class="nav-item active" href="members/" data-page="members" aria-current="page">멤버</a>
            <a class="nav-item" href="records/" data-page="records">전적</a>
            <a class="nav-item" href="stats/" data-page="stats">방송통계</a>
            <a class="nav-item" href="tools/" data-page="tools">도구</a>
        </nav>
    </div>
</header>

<main>

<section id="page-members" class="page-section active container">
    <div class="page-header">
        <h1 class="page-header-title">멤버</h1>
        <p class="page-header-subtitle">캄몬스타즈 멤버들의 현황과 소식입니다.</p>
    </div>
    <hr class="page-header-divider tight">
    <div class="sub-tabs" role="tablist">
        <div class="sub-tab active" id="tab-member-status" role="tab" tabindex="0" aria-selected="true" onclick="switchMemberView('status')">현황</div>
        <div class="sub-tab" id="tab-member-news" role="tab" tabindex="0" aria-selected="false" onclick="switchMemberView('news')">공지</div>
    </div>

    <div id="view-member-status">
        <div id="members-groups"></div>
    </div>

    <div id="view-member-news" class="d-none">
        <div class="avatar-selector-scroll">
            <div class="avatar-selector-list" id="news-avatar-list"></div>
        </div>

        <div class="section-title" id="news-content-title">전체 공지</div>

        <div id="news-feed-content" aria-live="polite">
            <div class="text-center text-muted py-4 fs-body">불러오는 중...</div>
        </div>
    </div>
</section>

</main>


<div class="modal fade" id="memberProfileModal" tabindex="-1" aria-labelledby="memberProfileTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-w-400">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="memberProfileTitle">프로필</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body profile-modal-body">
                <div class="d-flex align-items-center mb-3">
                    <div class="profile-avatar" id="mp-avatar">👤</div>
                    <div>
                        <div class="fw-bold profile-modal-name" id="mp-name">이름</div>
                        <div class="d-flex gap-2 flex-wrap">
                            <span class="tag-badge" id="mp-role-badge">직책</span>
                            <span class="tag-badge" id="mp-tier-badge">티어</span>
                            <span class="tag-badge" id="mp-race-badge">종족</span>
                        </div>
                    </div>
                </div>
                <table class="table table-borderless mb-0 fs-body profile-info-table">
                    <tbody id="mp-info-body"></tbody>
                </table>

                <div class="mt-3">
                    <div class="section-title-sm">
                        이번 달 방송 활동
                        <span class="text-secondary title-count" id="mp-activity-status">데이터 준비중</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">별풍선</div>
                                <div class="fw-bold fs-body" id="mp-balloons">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">방송시간</div>
                                <div class="fw-bold fs-body" id="mp-broadcast-hours">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">누적시청자</div>
                                <div class="fw-bold fs-body" id="mp-viewers">-</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="clean-card text-center py-2">
                                <div class="text-secondary activity-label">스폰전적</div>
                                <div class="fw-bold fs-body" id="mp-sponsor-record">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
