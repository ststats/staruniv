<body><header class="top-navbar">

                aria-expanded="false" aria-controls="mainMenu" onclick="toggleMainMenu()">
            <span></span><span></span><span></span>
        </button>
        <nav class="nav-menu tab-scroll" id="mainMenu" aria-label="주 메뉴">

            <button type="button" data-theme-choice="light" aria-label="라이트 모드" onclick="setTheme('light')">☀</button>

        </div>
    </div>

<main>

<section id="page-members" class="page-section active">
    <div class="page-header">
        <div class="page-header-main" data-label="ROSTER">
            <h1 class="page-header-title">멤버</h1>
            <p class="page-header-subtitle">캄몬스타즈 멤버들의 현황과 소식입니다.</p>
            <div class="page-header-stats">
                <div class="head-stat head-stat-ink">
                    <div class="head-stat-label">ACTIVE</div>
                    <div class="head-stat-value" id="member-count-active">-</div>
                </div>
                <div class="head-stat">
                    <div class="head-stat-label">ON AIR</div>
                    <div class="head-stat-value head-stat-live" id="member-count-live">-</div>
                </div>
            </div>
        </div>
        <div class="sub-tabs tab-scroll" role="tablist">
            <div class="sub-tab active" id="tab-member-status" role="tab" tabindex="0" aria-selected="true" onclick="switchMemberView('status')">현황</div>
            <div class="sub-tab" id="tab-member-news" role="tab" tabindex="0" aria-selected="false" onclick="switchMemberView('news')">공지</div>
        </div>
    </div>
    <div class="container">
    <div id="view-member-status">
        <div id="members-groups" aria-live="polite" aria-busy="true">
            <div class="content-state">멤버 정보를 불러오는 중...</div>
        </div>
    </div>

    <div id="view-member-news" class="d-none">
        <div class="selection-layout">
            <div class="avatar-selector-scroll scroll-area">
                <div class="avatar-selector-list" id="news-avatar-list"></div>
            </div>
            <div class="selection-content">
                <div class="section-title" data-en="NOTICE"><span class="section-title-label" id="news-content-title">전체 공지</span></div>

                <div id="news-feed-content" aria-live="polite" aria-busy="true">
                    <div class="content-state">공지를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>
    </div>
</section>


</main>


<div class="modal fade" id="memberProfileModal" tabindex="-1" aria-labelledby="mp-name" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered profile-dialog">
        <div class="modal-content">
            <div class="profile-modal-hero">
                <button type="button" class="btn-close btn-close-white profile-modal-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                <div class="profile-modal-identity">
                    <div class="profile-avatar" id="mp-avatar">👤</div>
                    <div class="profile-modal-identity-text">
                        <h2 class="profile-modal-name" id="mp-name">이름</h2>
                        <div class="d-flex gap-2 flex-wrap"><span class="tag-badge" id="mp-role-badge"></span><span class="tag-badge" id="mp-tier-badge"></span><span class="tag-badge" id="mp-race-badge"></span></div>
                    </div>
                </div>
            </div>
            <div class="modal-body profile-modal-body">
                <div class="section-title profile-modal-section" data-en="PROFILE"><h3 class="section-title-label">기본 정보</h3></div>
                <dl class="profile-modal-facts" id="mp-info-body"></dl>
                <div class="profile-modal-period"><div><div class="profile-modal-label">활동기간</div><div id="mp-period">-</div></div><span class="profile-modal-days" id="mp-days" hidden></span></div>
                <div class="section-title profile-modal-section" data-en="MONTHLY ACTIVITY"><h3 class="section-title-label">이번 달 방송 활동</h3></div>
                <div class="profile-modal-status" id="mp-activity-status" role="status">데이터 준비중</div>
                <div class="profile-modal-metrics">
                    
                    <div class="profile-modal-metric"><div class="profile-modal-label">별풍선</div><div class="profile-modal-value" id="mp-balloons">-</div></div>
                    
                    <div class="profile-modal-metric"><div class="profile-modal-label">방송시간</div><div class="profile-modal-value" id="mp-broadcast-hours">-</div></div>
                    
                    <div class="profile-modal-metric"><div class="profile-modal-label">누적시청자</div><div class="profile-modal-value" id="mp-viewers">-</div></div>
                    
                    <div class="profile-modal-metric"><div class="profile-modal-label">스폰전적</div><div class="profile-modal-value" id="mp-sponsor-record">-</div></div>
                    
                </div>
                <div class="profile-modal-shortcuts"><a id="mp-analysis-link" class="profile-modal-link" hidden><span class="profile-modal-link-label">티어표 분석</span><span class="i-arrow" aria-hidden="true"></span></a><a id="mp-records-link" class="profile-modal-link"><span class="profile-modal-link-label">개인 전적</span><span class="i-arrow" aria-hidden="true"></span></a><a id="mp-station-link" class="profile-modal-link profile-modal-station" target="_blank" rel="noopener" hidden><span class="profile-modal-link-label">SOOP 방송국</span><span class="i-arrow" aria-hidden="true"></span></a></div>
            </div>
        </div>
    </div>
</div>
