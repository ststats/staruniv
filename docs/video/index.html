<main>

<!-- 영상 페이지 -->
<section id="page-video" class="page-section active">
    <div class="page-header">
        <div class="page-header-main" data-label="VIDEO">
            <h1 class="page-header-title">영상</h1>
            <p class="page-header-subtitle">캄몬스타즈 팬 채널의 영상과 추천 영상입니다.</p>
        </div>
        <div class="sub-tabs tab-scroll" role="tablist">
            <div class="sub-tab active" id="tab-video-fantube" role="tab" tabindex="0" aria-selected="true" onclick="switchVideoView('fantube')">팬튜브</div>
            <div class="sub-tab" id="tab-video-pick" role="tab" tabindex="0" aria-selected="false" onclick="switchVideoView('pick')">보자</div>
        </div>
    </div>
    <div class="container">
    <div id="view-video-fantube">
        <div class="video-channel-row tab-scroll" id="video-channel-row" role="group" aria-label="채널 선택"></div>

        <div id="video-top-wrap" hidden>
            <div class="section-title section-title-spaced" data-en="MONTHLY TOP"><span class="section-title-label">이번 달 인기</span><span class="title-count">최근 30일 · 조회수순</span></div>
            <div class="video-top-grid" id="video-top-grid"></div>
        </div>

        <div id="video-shorts-wrap" hidden>
            <div class="section-title section-title-spaced has-shelf-nav" data-en="SHORTS"><span class="section-title-label">쇼츠</span><span class="title-count" id="video-shorts-count"></span>
                <span class="shelf-nav" id="video-shorts-nav" hidden>
                    <button type="button" class="shelf-nav-btn" aria-label="이전 쇼츠" onclick="videoShortsScroll(-1)">‹</button>
                    <button type="button" class="shelf-nav-btn" aria-label="다음 쇼츠" onclick="videoShortsScroll(1)">›</button>
                </span>
            </div>
            <div class="video-shorts-shelf tab-scroll" id="video-shorts-shelf"></div>
        </div>

        <div class="section-title section-title-spaced" data-en="LATEST"><span class="section-title-label">최신 영상</span><span class="title-count" id="video-latest-count"></span></div>
        <div class="video-grid" id="video-latest-grid" aria-live="polite" aria-busy="true"><div class="content-state video-empty">영상 목록을 불러오는 중...</div></div>
        <div class="news-load-more-wrap video-more-wrap" id="video-more-wrap" hidden>
            <button type="button" class="news-load-more" onclick="videoShowMore()">더 보기 <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
        </div>
    </div>
    <div id="view-video-pick" class="d-none">
        <div id="video-pick-grid"></div>
    </div>
    </div>
</section>
