<body><header class="top-navbar">
    <div class="navbar-inner container">

        <button type="button" class="nav-drawer-btn" id="navDrawerBtn" aria-label="메뉴 열기"
                aria-expanded="false" aria-controls="mainMenu" onclick="toggleMainMenu()">
            <span></span><span></span><span></span>
        </button>
        <nav class="nav-menu tab-scroll" id="mainMenu" aria-label="주 메뉴">
            <a class="nav-item active" href="schedule/" data-page="schedule" aria-current="page">일정</a>

        </nav>
        <div class="theme-toggle" role="group" aria-label="테마 선택">
            <button type="button" data-theme-choice="light" aria-label="라이트 모드" onclick="setTheme('light')">☀</button>
            <button type="button" data-theme-choice="dark" aria-label="다크 모드" onclick="setTheme('dark')">◐</button>
        </div>
    </div>
</header>

<main>

<section id="page-schedule" class="page-section active">
    <div class="page-header">
        <div class="page-header-main" data-label="SCHEDULE">
            <h1 class="page-header-title">일정</h1>
            <p class="page-header-subtitle">캄몬스타즈의 다가올 일정과 지나간 일정입니다.</p>
        </div>
        <div class="sub-tabs tab-scroll" role="tablist">
            <div class="sub-tab active" id="tab-calendar" role="tab" tabindex="0" aria-selected="true" onclick="switchScheduleView('calendar')">일정</div>
            <div class="sub-tab" id="tab-history" role="tab" tabindex="0" aria-selected="false" onclick="switchScheduleView('history')">연혁</div>
        </div>
    </div>
    <div class="container">
    <div id="view-calendar">
    <div class="cal-app-root">
        <div class="cal-main-layout">
            <!-- 모바일 분리용 사이드바 -->
            <aside class="cal-sidebar">
                <div class="cal-today-card-wrapper">
                    <div class="section-title" data-en="TODAY"><span class="section-title-label">오늘의 일정</span></div>
                    <div class="clean-card card-ink hatch p-4 cal-day-card cal-day-card-today">
                        <div class="cal-day-card-date" id="todayDateLabel"></div>
                        <div class="cal-today-list scroll-area" id="todayList"></div>
                    </div>
                </div>
                <div class="cal-selected-card-wrapper">
                    <div class="section-title" id="selectedListTitle" data-en="SELECTED"><span class="section-title-label">선택한 날짜 일정</span></div>
                    <div class="clean-card card-ink hatch p-4 cal-day-card cal-day-card-today">
                        <div class="cal-day-card-date" id="selectedDateLabel"></div>
                        <div class="cal-selected-list scroll-area" id="selectedDateList"></div>
                    </div>
                </div>
            </aside>

            <section class="cal-calendar-area">
                <div class="section-title" data-en="MONTHLY SCHEDULE">
                    <span class="section-title-label">이달의 일정</span>
                </div>
                <div class="clean-card cal-card p-0">
                    <div class="cal-month-bar hatch">
                        <div class="cal-month-id">
                            <div class="cal-month-year" id="monthYear">&nbsp;</div>
                            <div class="cal-month-name" id="monthName">&nbsp;</div>
                        </div>
                        <div class="cal-nav-group">
                            <button class="cal-nav-btn" onclick="changeMonth(-1)" aria-label="이전 달"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                            <div id="monthTitle" class="cal-nav-badge" aria-live="polite"></div>
                            <button class="cal-nav-btn" onclick="changeMonth(1)" aria-label="다음 달"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        </div>
                    </div>
                    <!-- 가로 스크롤 허용 캘린더 구역 -->
                    <div class="cal-calendar-inner scroll-area">
                        <div class="cal-calendar-scroll-content">
                            <div class="cal-weekdays">
                                <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                            </div>
                            <div class="cal-days-grid" id="daysGrid"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    </div>
    <div id="view-history" class="d-none">
        <div id="history-root" aria-live="polite"><div class="hist-empty">불러오는 중...</div></div>
    </div>
    </div>
</section>

</main>

</html>
