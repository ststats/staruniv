<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타대학 대시보드 - 스타유니브</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/redesign.css">
</head>
<body class="dark-theme">
  <!-- 상단 네비게이션 헤더 -->
  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span class="logo-txt-white">STAR</span><span class="logo-txt-blue">UNIV</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">홈</a>
        <a href="/members/" class="nav-link">멤버</a>
        <a href="/schedule/" class="nav-link">일정</a>
        <a href="/records/" class="nav-link">전적</a>
        <a href="/tier/" class="nav-link">티어표</a>
        <a href="/stats/" class="nav-link">통계</a>
        <a href="/tools/" class="nav-link">도구</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    
<div class="page-container schedule-page">
  <!-- 16번: 캘린더 상단 타이틀 '이달의 일정 / MONTHLY SCHEDULE' 추가 -->
  <div class="calendar-header-title-wrap">
    <div class="section-header-bar">
      <div class="header-title-group">
        <h2 class="title-ko">이달의 일정</h2>
        <span class="title-en" style="font-size: 13px; color: var(--text-muted); margin-left: 8px;">MONTHLY SCHEDULE</span>
      </div>
    </div>
  </div>

  <!-- 캘린더 컨트롤러 & 뷰 -->
  <div class="calendar-wrapper cut-box">
    <div class="calendar-nav-bar">
      <button id="calPrevBtn" class="btn-cal-nav">&lt;</button>
      <h3 id="calCurrentMonth">2026.09</h3>
      <button id="calNextBtn" class="btn-cal-nav">&gt;</button>
      <button id="calTodayBtn" class="btn-cal-today">오늘</button>
    </div>

    <!-- 18번(오늘 날짜 셀 배경 제거), 19번(연속 바) 렌더링 그리드 -->
    <div class="calendar-grid-header">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div id="calendarGrid" class="calendar-grid">
      <!-- calendar.js 동적 렌더링 -->
    </div>
  </div>
</div>

  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 StarUniv. 캄몬스타즈 및 스타크래프트 대학 대전 전적/일정 대시보드.</p>
    </div>
  </footer>

  <script src="/core.js"></script>
  
<script src="/assets/calendar.js"></script>
<script src="/assets/page-schedule.js"></script>

</body>
</html>
