openapi: 3.1.0
info:
  title: StarUniv public API
  version: 1.0.0
  description: |
    공개 페이지가 쓰는 데이터 API 규격. 브라우저 쪽 구현은 templates/assets/api.js의 Api 객체이고,
    함수 하나가 아래 주소 하나에 대응한다(주석의 GET /api/v1/…). 지금은 서버 없이 api.js가 Supabase의
    공개 읽기 함수를 바로 부른다 - 주소마다 x-db-function이 그 DB 함수다(supabase/staruniv.sql 2번,
    ststat.sql 14번. site/{part}는 빌드 파일). 서버를 붙이면 서버가 같은 함수를 불러 이 규격대로 돌려주고,
    api.js 안의 호출만 fetch('/api/v1/…')로 바꾼다.

    원칙: 응답에는 화면이 그리는 것만 넣는다(열·행 모두). 영상 목록은 커서로 이어 받으며 첫 응답에 요약을 포함한다.
    오류는 HTTP 상태 코드와 { "message": "…" }.
servers:
  - url: /api/v1
paths:
  /members:
    get:
      summary: 멤버 목록과 누적 매치·세트 수 (Api.members)
      x-db-function: api_site_members
      description: 사이트 순서(감독 → 코치 → 선수 → 그 밖, 같은 직책은 티어 높은 순 → 입단순 → 이름순). 목록·카드·선택 바가 쓰는 칸만.
      responses:
        '200': { description: "{ members: [ { _id, 이름, SOOP ID, 성별, 종족, 티어, 직책, 입단일, 퇴단일, 대표 사진 } ], matchCount, roundCount } - 빈 값은 '', 숫자만 든 티어·SOOP ID는 숫자", content: { application/json: { schema: { type: object } } } }
  /members/profiles:
    get:
      summary: 멤버 프로필 창 전용 칸 (Api.memberProfiles)
      x-db-function: api_member_profiles
      responses:
        '200': { description: "{ profiles: { 멤버 _id: { 생년월일, MBTI, YouTube, ELO ID, 입단 티어 } } }", content: { application/json: { schema: { type: object } } } }
  /holidays:
    get:
      summary: 공휴일 (Api.holidays)
      x-db-function: api_holidays
      description: 올해·내년은 정기 빌드가 자동으로 맞춘다(scripts/sync_holidays.py), 임시공휴일은 관리자가 더한다.
      responses:
        '200': { description: '{ "YYYY-MM-DD": true }', content: { application/json: { schema: { type: object, additionalProperties: { type: boolean } } } } }
  /site/{part}:
    get:
      summary: 전적 묶음 (Api.siteData)
      description: 빌드가 만든 data/site_records_v2.json. schemaVersion은 2이며 선수별 승패는 문자열 대신 { wins, losses } 숫자 객체로 반환한다.
      parameters:
        - { name: part, in: path, required: true, schema: { type: string, enum: [records] } }
      responses:
        '200': { description: "{ schemaVersion: 2, matches, rounds, playersStats }", content: { application/json: { schema: { type: object } } } }
  /site/nav:
    get:
      summary: 메뉴·히어로 설명·서브탭 설정 (Api.navConfig)
      x-db-function: api_site_nav
      responses:
        '200':
          description: 설정 JSON(없으면 {})
          content: { application/json: { schema: { $ref: '#/components/schemas/NavConfig' } } }
  /logos:
    get:
      summary: 대학 로고 (Api.universityLogos)
      x-db-function: api_university_logos
      description: 그 화면에 나오는 대학만(전적은 상대팀, 티어표는 명단 소속, 시너지는 카드가 그려지는 대학).
      parameters:
        - { name: names, in: query, required: true, description: "쉼표로 구분한 대학 이름", schema: { type: string } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Logo' } } } } }
  /live:
    get:
      summary: 지금 방송 중인 선수 (Api.liveBroadcasts)
      x-db-function: api_live
      description: 휴면이 아닌 명단 선수만. 수집이 5분 넘게 멈추면 빈 목록.
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LiveBroadcast' } } } } }
  /live/ids:
    get:
      summary: 방송 중인 선수의 SOOP ID만 (Api.liveSoopIds - LIVE 점만 찍는 화면 - 사이드바·멀티뷰어)
      x-db-function: api_live_ids
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { type: object, properties: { soop_id: { type: string } } } } } } }
  /stats/dates:
    get:
      summary: 방송통계가 있는 날짜, 최신순 (Api.statsDates)
      x-db-function: api_stats_dates
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { type: object, properties: { stat_date: { type: string, format: date } } } } } } }
  /stats/latest:
    get:
      summary: 가장 최근 날짜의 월 누적 방송통계, 날짜(stat_date) 포함 (Api.statsLatest)
      x-db-function: player_stats
      parameters:
        - { name: ids, in: query, required: true, description: "쉼표로 구분한 SOOP ID(한 번에 300개까지). 휴면 선수도 준다(그 선수 칸에 보이므로)", schema: { type: string } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { allOf: [ { $ref: '#/components/schemas/StatsRow' }, { type: object, properties: { stat_date: { type: string, format: date } } } ] } } } } }
  /stats:
    get:
      summary: 그날까지의 월 누적 방송통계 (Api.stats)
      x-db-function: player_stats
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: ids, in: query, required: true, description: "쉼표로 구분한 SOOP ID(한 번에 300개까지). 휴면 선수도 준다", schema: { type: string } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StatsRow' } } } } }
  /schedule:
    get:
      summary: 일정·휴방 (Api.schedule, Api.scheduleOn)
      x-db-function: api_schedule
      x-db-function-with-date: api_schedule_on
      parameters:
        - { name: date, in: query, required: false, description: "주면 그날에 걸친 일정만(홈, 휴방 없이 events 배열)", schema: { type: string, format: date } }
      responses:
        '200':
          description: date가 없으면 { events, offAir }
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
                  offAir: { type: array, items: { type: object, properties: { off_date: { type: string, format: date }, soop_id: { type: string } } } }
  /history:
    get:
      summary: 연혁 (Api.history)
      x-db-function: api_history
      description: 숨긴 수동 항목은 빠진다. 자동 항목을 덮어쓰는 override 행(숨김 포함)은 들어 있다.
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
  /posts:
    get:
      summary: 멤버 공지 모음, 최신순 (Api.memberPosts, Api.recentPosts)
      x-db-function: api_member_posts
      x-db-function-with-limit: api_recent_posts
      parameters:
        - { name: limit, in: query, required: false, description: "주면 최신 limit개만(홈 카드). 이때 글 전체 대신 카드 칸만 { soop_id, titleName, regDate, text, thumb }", schema: { type: integer, maximum: 2000 } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MemberPost' } } } } }
  /tier/members:
    get:
      summary: 티어표 명단 (Api.tierMembers)
      x-db-function: api_tier_members
      responses:
        '200': { description: "휴면 제외", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TierMember' } } } } }
  /teams/order:
    get:
      summary: 대학 이름, 창단일 순 (Api.teamOrder)
      x-db-function: api_team_order
      responses:
        '200': { description: "창단일을 비운 대학은 뒤에 등록 순", content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /videos:
    get:
      summary: 최신 영상 한 쪽과 첫 화면 요약 (Api.videos)
      x-db-function: api_videos
      description: 활성 채널과 숨기지 않은 영상만. 첫 쪽에는 채널별 개수·인기 3개·쇼츠 24개·추천 목록을 포함하며 이후에는 최신 영상만 반환한다. 정렬은 게시 시각 내림차순(NULL은 마지막), ID 내림차순이다.
      parameters:
        - { name: p_channel, in: query, schema: { type: string }, description: "채널 URL. 생략하면 전체" }
        - { name: p_before, in: query, schema: { type: string, format: date-time, nullable: true }, description: "직전 응답 next.published" }
        - { name: p_before_id, in: query, schema: { type: string }, description: "직전 응답 next.id. 생략하면 첫 쪽" }
        - { name: p_limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: p_admin, in: query, schema: { type: boolean, default: false }, description: "true는 인증된 관리자만 사용 가능. 숨긴 항목과 비활성 채널도 포함" }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos: { type: array, items: { $ref: '#/components/schemas/Video' } }
                  next:
                    type: object
                    nullable: true
                    properties:
                      published: { type: string, format: date-time, nullable: true }
                      id: { type: string }
                  summary:
                    type: object
                    nullable: true
                    properties:
                      channels: { type: array, items: { $ref: '#/components/schemas/VideoChannel' } }
                      total: { type: integer, description: "선택 채널의 일반 영상 전체 개수" }
                      top: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Video' } }
                      shorts: { type: array, maxItems: 24, items: { $ref: '#/components/schemas/Video' } }
                      picks: { type: array, items: { $ref: '#/components/schemas/VideoPick' } }
  /tools:
    get:
      summary: 외부 도구·사이트 링크 (Api.tools)
      x-db-function: api_tools
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tool' } } } } }
  /elo/players:
    get:
      summary: EloBoard 선수 목록 (Api.eloPlayers)
      x-db-function: elo_players_list
      parameters:
        - { name: ranked, in: query, required: false, description: "1이면 티어 안 순위·기준일까지(상대전적·분석)", schema: { type: integer, enum: [0, 1] } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EloPlayer' } } } } }
  /elo/players/{id}/matches:
    get:
      summary: 한 선수의 경기, 최신순 (Api.eloPlayerMatches)
      x-db-function: elo_player_match_list
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: since, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EloMatch' } } } } }
  /elo/players/{id}/ratings:
    get:
      summary: 한 선수의 월말 레이팅 (Api.eloRatingHistory)
      x-db-function: api_elo_rating_history
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { type: object, properties: { month_end: { type: string, format: date }, rating: { type: [number, 'null'] } } } } } } }
  /elo/ratings/range:
    get:
      summary: 레이팅 기록이 있는 첫 달·마지막 달 (Api.eloRatingRange)
      x-db-function: api_elo_rating_range
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: object, properties: { first: { type: string }, last: { type: string } } } } } }
  /elo/rankings:
    get:
      summary: 티어 안 순위·레이팅 (Api.eloRankings)
      x-db-function: elo_rankings_list
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EloRanking' } } } } }
  /elo/rankings/meta:
    get:
      summary: 가장 최근 랭킹의 티어 기준선·종족 상성 (Api.eloRankingMeta)
      x-db-function: api_elo_ranking_meta
      responses:
        '200': { description: "없으면 {}", content: { application/json: { schema: { $ref: '#/components/schemas/EloRankingMeta' } } } }
  /elo/ratings:
    get:
      summary: 순위 밖 선수까지 전 선수 레이팅 (Api.eloPlayerRatings)
      x-db-function: elo_player_ratings_list
      responses:
        '200': { description: "ok", content: { application/json: { schema: { type: array, items: { type: object, properties: { elo_id: { type: integer }, rating: { type: [number, 'null'] }, rating_se: { type: [number, 'null'] } } } } } } }
components:
  schemas:
    NavConfig:
      type: object
      properties:
        hidden: { type: array, items: { type: string }, description: "숨긴 메뉴 id" }
        order: { type: array, items: { type: string } }
        statsTabs: { type: object }
        heroDescriptions: { type: object, additionalProperties: { type: string } }
        subtabs: { type: object }
        homeCarousel: { type: object }
    Logo: { type: object, properties: { name: { type: string }, path: { type: string, description: "Storage staruniv-media 안 경로" } } }
    LiveBroadcast:
      type: object
      properties:
        soop_id: { type: string }
        broad_no: { type: string }
        broad_title: { type: string }
        current_sum_viewer: { type: integer }
        broad_start: { type: string }
        category_name: { type: string }
        broad_cate_no: { type: string }
    StatsRow:
      type: object
      properties:
        soop_id: { type: string }
        nickname: { type: string }
        balloons: { type: integer }
        broadcast_seconds: { type: integer }
        cumulative_viewers: { type: integer }
        sponsor_wins: { type: integer }
        sponsor_losses: { type: integer }
        updated_at: { type: string, format: date-time }
    CalendarEvent:
      type: object
      properties:
        id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: [string, 'null'], format: date }
        event_time: { type: [string, 'null'] }
        person: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
    HistoryEntry:
      type: object
      properties:
        id: { type: string }
        entry_kind: { type: string, enum: [manual, override] }
        event_date: { type: [string, 'null'], format: date }
        event_type: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        members: { type: array, items: { type: string } }
        youtube_url: { type: [string, 'null'] }
        image_path: { type: [string, 'null'] }
        sort_order: { type: [integer, 'null'] }
        hidden: { type: boolean }
    MemberPost:
      type: object
      properties:
        soop_id: { type: string }
        total_pages: { type: integer }
        post: { type: object, description: "titleNo, titleName, regDate, userId, userNick, content{textContent, content}, display{bbsName}, count{likeCnt, readCnt}, photos[{url}]" }
    TierMember:
      type: object
      properties:
        nickname: { type: string }
        soop_id: { type: string }
        race: { type: [string, 'null'] }
        tier: { type: [string, 'null'] }
        affiliation: { type: [string, 'null'] }
        modified_at: { type: [string, 'null'] }
    VideoChannel: { type: object, properties: { channel_url: { type: string }, title: { type: string }, display_name: { type: [string, 'null'] }, thumb: { type: [string, 'null'] }, count: { type: integer, description: "일반 영상과 쇼츠 합계" } } }
    Video:
      type: object
      properties:
        id: { type: string }
        channel_url: { type: string }
        title: { type: string }
        published: { type: string, format: date-time }
        thumb: { type: [string, 'null'] }
        views: { type: integer }
        short: { type: boolean }
    VideoPick:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        note: { type: [string, 'null'] }
        group_name: { type: [string, 'null'] }
        group_en: { type: [string, 'null'] }
        author: { type: [string, 'null'] }
        thumb: { type: [string, 'null'] }
        short: { type: boolean }
    Tool: { type: object, properties: { id: { type: integer }, category: { type: string, enum: [extTools, extSites] }, name: { type: string }, url: { type: string }, favicon: { type: [string, 'null'] } } }
    EloPlayer:
      type: object
      properties:
        elo_id: { type: integer }
        elo_name: { type: string }
        race: { type: [string, 'null'] }
        nickname: { type: [string, 'null'], description: "명단 선수가 아니면 null(상대 이름만 elo_name으로)" }
        soop_id: { type: [string, 'null'] }
        tier: { type: [string, 'null'] }
        affiliation: { type: [string, 'null'] }
        total_games: { type: [integer, 'null'] }
        tier_rank: { type: [integer, 'null'], description: "ranked=1일 때만" }
        tier_count: { type: [integer, 'null'], description: "ranked=1일 때만" }
        as_of: { type: [string, 'null'], description: "ranked=1일 때만" }
    EloMatch:
      type: object
      properties:
        match_date: { type: string, format: date }
        opponent_elo_id: { type: integer }
        won: { type: boolean }
        map_id: { type: [integer, 'null'] }
        map_name: { type: [string, 'null'] }
        category_name: { type: [string, 'null'] }
    EloRanking:
      type: object
      properties:
        elo_id: { type: integer }
        raw_rating: { type: [number, 'null'] }
        tier: { type: [string, 'null'] }
        tier_rank: { type: [integer, 'null'] }
        as_of: { type: [string, 'null'] }
    EloRankingMeta:
      type: object
      properties:
        as_of: { type: string }
        tier_counts: { type: object }
        tier_levels: { type: object }
        race_matchup: { type: object }
